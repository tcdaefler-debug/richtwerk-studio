/* ---- tafel.js ---- */
/* =========================================================================
   Auftragstafel (Büro): jeder Auftrag ist eine Karte, die von links nach
   rechts wandert: Anfrage → Angebot → Auftrag → Baustelle → Rechnung → Bezahlt.
   Karten rücken von selbst weiter, wenn im Angebot, auf der Baustelle oder
   in der Rechnung etwas passiert. Von Hand verschieben geht per Ziehen oder
   mit dem Pfeil auf der Karte (Handy, Tastatur).

   Übergabe an bewährte Programme: Rechnungsliste (CSV) mit E-Rechnungen für
   Buchhaltung und Steuerbüro, Wochenplan als Kalenderdatei (.ics).
   ========================================================================= */
const Uebergabe = (() => {
  const csv = (zeilen) => '\ufeff' + zeilen.map((z) => z.map((v) => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(';')).join('\r\n');
  const dez = (n) => Number(n || 0).toFixed(2).replace('.', ',');
  const dt = (iso) => (iso ? `${Datum.kurz(iso)}${iso.slice(0, 4)}` : '');

  function rechnungsZeilen(c, liste) {
    const z = [['Rechnungsnummer', 'Rechnungsdatum', 'Faellig', 'Kunde', 'Kundenart', 'Betreff', 'Netto', 'USt-Satz', 'USt', 'Brutto', 'Status', 'Bezahlt am', 'Angebot']];
    liste.forEach((r) => { const m = Auftraege.mwstVon(c, r); const s = Auftraege.summen(r, m); z.push([r.nr, dt(r.datum), dt(r.faellig), r.kunde, r.kundenart === 'gewerblich' ? 'Firma' : 'Privat', r.betreff, dez(s.netto), m, dez(s.steuer), dez(s.brutto), { gestellt: 'offen', bezahlt: 'bezahlt', storniert: 'storniert' }[r.status] || r.status, dt(r.bezahltAm), r.angebotNr || '']); });
    return z;
  }
  const gestellte = (c, filter = () => true) => c.typ('rechnung').filter((r) => r.nr && r.status !== 'entwurf').filter(filter).sort((a, b) => a.nr.localeCompare(b.nr));

  /* In einen ZIP-Ordner: Liste + eine E-Rechnung je Rechnung */
  function rechnungenInZip(c, ordner, filter) {
    const liste = gestellte(c, filter); if (!liste.length) return 0;
    ordner.file('Ausgangsrechnungen.csv', csv(rechnungsZeilen(c, liste)));
    if (c.R.p('rechnungen').erechnung !== 'aus') { const x = ordner.folder('E-Rechnungen'); liste.filter((r) => r.status !== 'storniert').forEach((r) => x.file(`${r.nr}_XRechnung.xml`, Auftraege.xrechnung(c, r))); }
    return liste.length;
  }

  async function buchhaltungsPaket(c, von, bis) {
    if (!window.JSZip) return meldung('Das ZIP-Werkzeug konnte nicht geladen werden (keine Internetverbindung?).', 'fehler');
    const zip = new JSZip(); const n = rechnungenInZip(c, zip, (r) => r.datum >= von && r.datum <= bis);
    if (!n) return meldung('In diesem Zeitraum gibt es keine gestellten Rechnungen.', 'fehler');
    zip.file('LIESMICH.txt', `Ausgangsrechnungen ${c.cfg.name}, ${dt(von)} bis ${dt(bis)}\r\n\r\nAusgangsrechnungen.csv: eine Zeile je Rechnung, Trennzeichen Semikolon, Beträge mit Komma.\r\nE-Rechnungen: je Rechnung eine XRechnung-Datei (UBL). Buchhaltungsprogramme und das Steuerbüro können sie einlesen.\r\n`);
    const blob = await zip.generateAsync({ type: 'blob' });
    speichern(`Rechnungen_${c.cfg.kennung || 'betrieb'}_${von}_${bis}.zip`, blob);
    meldung(`${n} Rechnungen exportiert`);
  }

  /* Wochenplan als Kalenderdatei: ein ganztägiger Termin je Baustelle und Tag */
  function planIcs(c, montag) {
    const w = c.planWoche(montag); const n = Number(c.R.p('wochenplan').tage) || 5;
    const stempel = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const t = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
    const ereignisse = [];
    for (let i = 0; i < n; i++) {
      const d = Datum.plus(montag, i);
      c.baustellenOffen().forEach((b) => {
        const leute = c.arbeiter().filter((p) => !c.abwesend(p.id, d) && w && w.zellen && w.zellen[p.id] && w.zellen[p.id][i] === b.id);
        if (!leute.length) return;
        const tag = d.replace(/-/g, ''); const naechster = Datum.plus(d, 1).replace(/-/g, '');
        ereignisse.push(['BEGIN:VEVENT', `UID:${b.id}-${tag}@${c.cfg.kennung || 'richtwerk'}`, `DTSTAMP:${stempel}`, `DTSTART;VALUE=DATE:${tag}`, `DTEND;VALUE=DATE:${naechster}`,
          `SUMMARY:${t(b.name)}: ${t(leute.map((p) => p.name.split(' ')[0]).join(', '))}`, `LOCATION:${t(b.adresse || b.ort)}`, `DESCRIPTION:${t([b.arbeit, b.kunde && 'Kunde: ' + b.kunde, b.telefon && 'Tel. ' + b.telefon, b.notiz].filter(Boolean).join('\n'))}`, 'END:VEVENT'].join('\r\n'));
      });
    }
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', `PRODID:-//${t(c.cfg.name)}//Wochenplan//DE`, 'CALSCALE:GREGORIAN', `X-WR-CALNAME:Wochenplan ${t(c.cfg.name)}`, ...ereignisse, 'END:VCALENDAR', ''].join('\r\n');
  }

  return { rechnungenInZip, buchhaltungsPaket, planIcs, gestellte };
})();

const Tafel = (() => {
  const { seitenkopf, leer } = Buero.teile;
  const STUFEN = ['anfrage', 'angebot', 'auftrag', 'baustelle', 'rechnung', 'bezahlt'];
  const spaltenNamen = (c) => { const n = c.R.liste('tafel', 'spalten'); const std = ['Anfrage', 'Angebot', 'Auftrag', 'Auf der Baustelle', 'Rechnung', 'Bezahlt']; return std.map((s, i) => n[i] || s); };

  /* Alle Karten: eigene Vorgänge (Anfragen) plus Angebote und Rechnungen, die noch keinen Vorgang haben */
  function karten(c) {
    const vorgaenge = c.typ('vorgang').filter((v) => !v.archiv);
    const angeboteMitV = new Set(vorgaenge.map((v) => v.angebot).filter(Boolean));
    const rechnungenMitV = new Set();
    const out = vorgaenge.map((v) => ({ v, id: v.id, angebot: c.items.find((i) => i.id === v.angebot), bs: v.bs }));
    c.typ('angebot').filter((a) => !angeboteMitV.has(a.id) && a.status !== 'abgelehnt').forEach((a) => out.push({ id: 'a:' + a.id, angebot: a, bs: a.bs }));
    out.forEach((k) => {
      const a = k.angebot; k.bs = k.bs || (a && a.bs) || '';
      k.rechnung = c.typ('rechnung').filter((r) => r.status !== 'storniert' && ((a && r.angebot === a.id) || (k.v && r.id === k.v.rechnung))).sort((x, y) => (x.status === 'bezahlt') - (y.status === 'bezahlt'))[0];
      if (k.rechnung) rechnungenMitV.add(k.rechnung.id);
    });
    c.typ('rechnung').filter((r) => !rechnungenMitV.has(r.id) && r.status !== 'storniert').forEach((r) => out.push({ id: 'r:' + r.id, rechnung: r, bs: r.bs }));
    out.forEach((k) => { k.auto = automatisch(c, k); k.stufe = Math.max(k.auto, k.v ? STUFEN.indexOf(k.v.spalte) : 0); });
    return out;
  }
  /* Wie weit ist der Auftrag laut Angebot, Baustelle und Rechnung? */
  function automatisch(c, k) {
    const r = k.rechnung; const a = k.angebot; const b = k.bs && c.baustelle(k.bs);
    if (r && r.status === 'bezahlt') return 5;
    if (r && r.status === 'gestellt') return 4;
    if (b && (b.status === 'laufend' || b.status === 'fertig') && c.typ('stunden').some((s) => s.bs === b.id)) return 3;
    if (a && a.status === 'angenommen') return 2;
    if (a) return 1;
    return 0;
  }
  const kunde = (k) => (k.v && k.v.kunde) || (k.angebot && k.angebot.kunde) || (k.rechnung && k.rechnung.kunde) || '';
  const titel = (k) => (k.v && k.v.titel) || (k.angebot && k.angebot.betreff) || (k.rechnung && k.rechnung.betreff) || 'Ohne Titel';

  function karteHtml(c, k, namen) {
    const doc = k.rechnung || k.angebot; const betrag = doc ? Auftraege.summen(doc, Auftraege.mwstVon(c, doc)).netto : 0;
    const chips = [];
    if (k.angebot && Auftraege.offeneFragen(k.angebot).length) chips.push('<span class="chip warn">Kundenfrage</span>');
    if (k.angebot && k.angebot.angenommenOnline && k.stufe === 2) chips.push('<span class="chip ok">online angenommen</span>');
    if (k.rechnung && Auftraege.ueberfaellig(c, k.rechnung)) chips.push('<span class="chip bad">überfällig</span>');
    if (k.stufe === 1 && k.angebot && k.angebot.status === 'entwurf') chips.push('<span class="chip">Entwurf</span>');
    if (k.v && k.v.termin) chips.push(`<span class="chip info">${Icon('kalender')} ${Datum.kurz(k.v.termin)}</span>`);
    const links = [];
    if (k.angebot) links.push(`<button class="t-link" data-a="angebot" data-id="${k.angebot.id}">${Icon('angebot')} ${esc(k.angebot.nr || 'Angebot')}</button>`);
    else if (k.v && c.R.hat('angebote')) links.push(`<button class="t-link" data-a="tafel-angebot" data-id="${k.id}">${Icon('plus')} Angebot schreiben</button>`);
    if (k.bs && c.baustelle(k.bs)) links.push(`<button class="t-link" data-a="akte" data-id="${k.bs}">${Icon('karte')} Akte</button>`);
    if (k.rechnung) links.push(`<button class="t-link" data-a="rechnung" data-id="${k.rechnung.id}">${Icon('rechnung')} ${esc(k.rechnung.nr || 'Entwurf')}</button>`);
    return `<article class="t-karte" draggable="true" data-karte="${k.id}" tabindex="0" aria-label="${esc(kunde(k))}: ${esc(titel(k))}, ${esc(namen[k.stufe])}">
      <div class="t-oben"><b>${esc(kunde(k) || 'Neuer Kunde')}</b>${betrag ? `<span class="num">${Zahl.eur(betrag)}</span>` : ''}</div>
      <p>${esc(titel(k))}</p>
      ${k.v && k.v.notiz && k.stufe === 0 ? `<small>${esc(k.v.notiz)}</small>` : ''}
      ${chips.length ? `<div class="t-chips">${chips.join('')}</div>` : ''}
      <div class="t-unten"><div class="t-links">${links.join('')}</div>
        <span class="t-pfeile">${k.v && k.stufe > k.auto ? `<button class="k klein" data-a="tafel-schieben" data-id="${k.id}" data-wohin="-1" aria-label="Eine Spalte zurück">${Icon('zurueck')}</button>` : ''}${k.stufe < 5 ? `<button class="k klein" data-a="tafel-schieben" data-id="${k.id}" data-wohin="1" aria-label="Eine Spalte weiter">${Icon('pfeil')}</button>` : ''}</span></div>
    </article>`;
  }

  function seite(c) {
    const alle = karten(c); const namen = spaltenNamen(c);
    const grenze = Datum.plus(c.heute, -Number(c.R.p('tafel').bezahltTage || 30));
    const sichtbar = alle.filter((k) => k.stufe < 5 || !k.rechnung || (k.rechnung.bezahltAm || c.heute) >= grenze);
    const spalten = STUFEN.map((s, i) => {
      const hier = sichtbar.filter((k) => k.stufe === i).sort((a, b) => kunde(a).localeCompare(kunde(b)));
      const summe = hier.reduce((x, k) => { const d = k.rechnung || k.angebot; return x + (d ? Auftraege.summen(d, Auftraege.mwstVon(c, d)).netto : 0); }, 0);
      return `<section class="t-spalte" data-spalte="${i}" aria-label="${esc(namen[i])}">
        <header><b>${esc(namen[i])}</b><span class="t-zahl">${hier.length}</span>${summe ? `<small class="num">${Zahl.eur(summe)}</small>` : ''}</header>
        <div class="t-liste">${hier.map((k) => karteHtml(c, k, namen)).join('') || '<div class="t-leer">Karte hierher ziehen</div>'}</div>
        ${i === 0 ? `<button class="t-neu" data-a="tafel-neu">${Icon('plus')} Anfrage</button>` : ''}
      </section>`;
    }).join('');
    return seitenkopf(esc(c.R.name('tafel')), 'Jeder Auftrag eine Karte. Sie rückt von selbst weiter, wenn Angebot, Baustelle oder Rechnung sich ändern.', `<button class="k haupt" data-a="tafel-neu">${Icon('plus')} Neue Anfrage</button>`)
      + `<div class="tafel">${spalten}</div>`;
  }

  function anfrageFenster(c, v = {}) {
    Fenster.oeffne({
      titel: v.id ? 'Anfrage bearbeiten' : 'Neue Anfrage', bereich: 'ui-buero-fenster',
      inhalt: `<div class="reihe"><label class="feld"><span>Kunde</span><input name="kunde" value="${esc(v.kunde || '')}" placeholder="Name oder Firma"></label><label class="feld"><span>Telefon</span><input name="telefon" type="tel" value="${esc(v.telefon || '')}"></label></div>
        <div class="reihe"><label class="feld"><span>Was soll gemacht werden?</span><input name="titel" value="${esc(v.titel || '')}" placeholder="z. B. Carport 6 x 3 m"></label><label class="feld"><span>Besichtigung (optional)</span><input name="termin" type="date" value="${esc(v.termin || '')}"></label></div>
        <label class="feld"><span>Anschrift (Straße, PLZ Ort)</span><textarea name="adresse" rows="2">${esc(v.adresse || '')}</textarea></label>
        <label class="feld"><span>Notiz</span><input name="notiz" value="${esc(v.notiz || '')}" placeholder="z. B. kam über Empfehlung Gerdes"></label>`,
      fuss: `${v.id ? '<button class="k nein" data-f="weg" style="margin-right:auto">Karte entfernen</button>' : '<span style="margin-right:auto"></span>'}<button class="k" data-f="zu">Abbrechen</button><button class="k haupt" data-f="ok">Speichern</button>`,
      aktionen: {
        ok: (b, hg) => {
          const w = Fenster.werte(hg); if (!w.kunde.trim()) return meldung('Bitte einen Kunden eintragen.', 'fehler');
          const daten = { kunde: w.kunde.trim(), telefon: w.telefon.trim(), titel: w.titel.trim(), termin: w.termin, adresse: w.adresse.trim(), notiz: w.notiz.trim() };
          if (v.id) Store.aendere(v.id, daten); else Store.neu({ typ: 'vorgang', spalte: 'anfrage', datum: c.heute, ...daten });
          Fenster.schliesse(); meldung('Gespeichert');
        },
        weg: (b) => { if (!b.dataset.sicher) { b.dataset.sicher = '1'; b.textContent = 'Wirklich entfernen?'; return; } Store.aendere(v.id, { archiv: true }); Fenster.schliesse(); },
      },
    });
  }

  /* Karte verschieben. Nach vorn geht immer, zurück nur so weit, wie Angebot und Rechnung es zulassen. */
  async function schieben(c, kid, ziel) {
    const k = karten(c).find((x) => x.id === kid); if (!k || ziel === k.stufe) return;
    if (ziel < k.auto) return meldung(`Das geht nicht zurück: ${k.auto >= 4 ? 'die Rechnung ist schon gestellt' : k.auto === 3 ? 'auf der Baustelle wurde schon gearbeitet' : k.auto === 2 ? 'das Angebot ist angenommen' : 'es gibt schon ein Angebot'}.`, 'fehler');
    let vid = k.v && k.v.id;
    if (!vid) vid = await Store.neu({ typ: 'vorgang', spalte: STUFEN[ziel], datum: c.heute, kunde: kunde(k), titel: titel(k), angebot: k.angebot ? k.angebot.id : '', rechnung: k.rechnung ? k.rechnung.id : '', bs: k.bs || '' });
    else Store.aendere(vid, { spalte: STUFEN[ziel] });
    if (ziel === 2 && k.angebot && ['entwurf', 'gesendet'].includes(k.angebot.status)) {
      const patch = { status: 'angenommen', entschieden: Date.now() };
      if (!k.angebot.bs && c.R.an('angebote', 'baustelleAnlegen')) { patch.bs = Auftraege.baustelleAusAngebot(k.angebot); Store.aendere(vid, { bs: patch.bs }); }
      Store.aendere(k.angebot.id, patch); meldung(`Angebot ${k.angebot.nr} als angenommen markiert${patch.bs ? ', Baustelle angelegt' : ''}.`);
    } else if (ziel === 1 && !k.angebot && c.R.hat('angebote')) {
      neuesAngebot(c, { ...k.v, id: vid });
    } else if (ziel === 3 && k.bs && c.baustelle(k.bs) && c.baustelle(k.bs).status === 'geplant') {
      Store.speichereCfg({ ...Store.cfg, baustellen: Store.cfg.baustellen.map((b) => (b.id === k.bs ? { ...b, status: 'laufend' } : b)) }); meldung('Baustelle läuft');
    } else if (ziel === 4 && !k.rechnung) {
      meldung('Rechnung erstellen: Öffnen Sie das Angebot und klicken Sie auf „Rechnung erstellen“.');
    } else if (ziel === 5 && k.rechnung && k.rechnung.status === 'gestellt') {
      Store.aendere(k.rechnung.id, { status: 'bezahlt', bezahltAm: c.heute }); meldung(`Rechnung ${k.rechnung.nr} als bezahlt markiert`);
    }
  }
  async function neuesAngebot(c, v) {
    const id = Store.uid('d');
    const a = { id, typ: 'angebot', status: 'entwurf', kunde: v.kunde, adresse: v.adresse || '', betreff: v.titel || '', kundenart: 'privat', telefon: v.telefon || '', positionen: [{ text: '', menge: 1, einheit: 'm²', preis: '' }] };
    // Nummer, Datum, Gültigkeit vergibt der Editor beim ersten Speichern, dann hängt er das Angebot an die Karte
    Auftraege.editor(c, { ...a, id: undefined, _vorgang: v.id, _id: id });
  }

  /* Ziehen und Ablegen */
  let gezogen = null;
  document.addEventListener('dragstart', (e) => { const k = e.target.closest && e.target.closest('.t-karte'); if (!k) return; gezogen = k.dataset.karte; k.classList.add('zieht'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', gezogen); } catch { /* alt */ } });
  document.addEventListener('dragend', () => { gezogen = null; $$('.t-karte.zieht, .t-spalte.ueber').forEach((x) => x.classList.remove('zieht', 'ueber')); });
  document.addEventListener('dragover', (e) => { const s = e.target.closest && e.target.closest('.t-spalte'); if (!s || !gezogen) return; e.preventDefault(); $$('.t-spalte.ueber').forEach((x) => x !== s && x.classList.remove('ueber')); s.classList.add('ueber'); });
  document.addEventListener('drop', (e) => { const s = e.target.closest && e.target.closest('.t-spalte'); if (!s || !gezogen) return; e.preventDefault(); const kid = gezogen; gezogen = null; s.classList.remove('ueber'); schieben(ctxNeu(), kid, Number(s.dataset.spalte)); });
  const ctxNeu = () => kontext(Store.cfg, Store.items, (Sitzung.lies('buero') || {}).pid);

  Buero.erweitern({
    nav: [{ id: 'tafel', name: 'Auftragstafel', icon: 'plan', braucht: 'tafel', gruppe: 'Aufträge', zahl: (o, c) => c.typ('vorgang').filter((v) => !v.archiv && v.spalte === 'anfrage' && !v.angebot).length }],
    seiten: { tafel: seite },
    aktionen: {
      'tafel-neu'(el, c) { anfrageFenster(c); },
      'tafel-schieben'(el, c) { const k = karten(c).find((x) => x.id === el.dataset.id); if (k) schieben(c, k.id, k.stufe + Number(el.dataset.wohin)); },
      'tafel-angebot'(el, c) { const v = c.items.find((i) => i.id === el.dataset.id); if (v) neuesAngebot(c, v); },
    },
  });
  // Doppelklick auf eine Anfrage öffnet sie
  document.addEventListener('dblclick', (e) => { const k = e.target.closest && e.target.closest('.t-karte'); if (!k) return; const c = ctxNeu(); const v = c.items.find((i) => i.id === k.dataset.karte); if (v && v.typ === 'vorgang') anfrageFenster(c, v); });

  return { karten };
})();

/* Rechtliche Texte: vorhanden und sichtbar, aber Muster. Vor dem echten Einsatz prüfen lassen. */
const RECHT_TITEL = { agb: 'Allgemeine Geschäftsbedingungen', widerruf: 'Widerrufsbelehrung', datenschutz: 'Datenschutzhinweis', impressum: 'Impressum' };
function rechtText(c, was) {
  const P = c.R.p('angebote'); const f = c.cfg;
  if (was === 'impressum') return [`Angaben gemäß § 5 DDG`, `${f.name}${f.inhaber ? `\nInhaber: ${f.inhaber}` : ''}`, [f.strasse, [f.plz, f.ort].filter(Boolean).join(' ')].filter(Boolean).join('\n'), [f.telefon && 'Telefon: ' + f.telefon, f.email && 'E-Mail: ' + f.email].filter(Boolean).join('\n'), f.ustid ? 'Umsatzsteuer-Identifikationsnummer: ' + f.ustid : '', 'Zuständige Handwerkskammer: [bitte ergänzen]\nEintragung in die Handwerksrolle: [bitte ergänzen]\nBerufshaftpflichtversicherung: [Versicherer und Geltungsbereich ergänzen]', 'Verbraucherstreitbeilegung: Wir sind nicht bereit und nicht verpflichtet, an Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle teilzunehmen.'].filter(Boolean).join('\n\n');
  return { agb: P.agb, widerruf: P.widerrufText, datenschutz: P.datenschutz }[was] || '';
}

Buero.erweitern({
  einstellungen: (c) => `<div class="karte"><div class="kopf"><h3>Rechtliche Texte</h3><span class="chip warn">Muster, vor Einsatz prüfen</span></div><div class="koerper recht-knoepfe">
    <p style="margin:0 0 12px;color:#5f6862">Diese Texte erscheinen auf Angeboten und auf der Seite, auf der Ihre Kunden online annehmen. Richtwerk pflegt sie für Sie ein. Die Muster ersetzen keine Rechtsberatung.</p>
    ${Object.entries(RECHT_TITEL).map(([k, t]) => `<button class="k" data-a="recht" data-id="${k}">${Icon('paragraph')} ${t}</button>`).join(' ')}</div></div>`,
  aktionen: { recht(el) { KundenSeite.lesen(el.dataset.id); } },
});

const KundenSeite = (() => {
  let leer = true;

  function warteAufDaten(fid, id) {
    return new Promise((fertig) => {
      Store.oeffne(fid);
      const pruefe = () => Store.cfg && Store.items.some((i) => i.id === id);
      if (pruefe()) return fertig(true);
      const ab = Store.abonniere(() => { if (pruefe()) { ab(); clearTimeout(t); fertig(true); } });
      const t = setTimeout(() => { ab(); fertig(pruefe()); }, 6000);
    });
  }

  async function start(ziel) {
    const [, fid, id, schluessel] = ziel.split('/');
    document.body.className = 'kunde-modus';
    Wurzel().innerHTML = `<div class="laden"><div>Angebot wird geladen<div class="balken"><i></i></div></div></div>`;
    const da = await warteAufDaten(fid, id);
    const a = da && Store.items.find((i) => i.id === id);
    if (!a || a.typ !== 'angebot' || !a.schluessel || a.schluessel !== schluessel) return hinweis('Dieses Angebot wurde nicht gefunden', 'Der Link ist unvollständig oder nicht mehr gültig. Bitte wenden Sie sich an den Betrieb, von dem Sie den Link bekommen haben.');

  }

  function hinweis(titel, text) {
    Wurzel().innerHTML = `<div class="kd-leer"><h1>${esc(titel)}</h1><p>${esc(text)}</p></div>`;
  }

  const ctx = () => kontext(Store.cfg, Store.items, null);
  const datum = (iso) => `${Datum.kurz(iso)}${iso.slice(0, 4)}`;

  function zeichne(id) {
    const c = ctx(); const a = Store.items.find((i) => i.id === id); const f = c.cfg;
    const P = c.R.p('angebote'); const s = Auftraege.summen(a, Auftraege.mwstVon(c, a)); const mwst = Auftraege.mwstVon(c, a);
    document.documentElement.style.setProperty('--firma', f.farbe || '#2f5e4e');
    document.title = `Angebot ${a.nr} · ${f.name}`;
    const privat = a.kundenart !== 'gewerblich';
    const widerruf = !privat || P.widerruf === 'nicht anzeigen' ? '' : P.widerruf === 'Ausschluss Maßanfertigung' ? 'massanfertigung' : 'belehrung';
    const mitAgb = String(P.agb || '').trim() !== '';

    const online = c.R.an('angebote', 'onlineAnnahme');

        ${c.R.an('angebote', 'bestaetigung') ? `<button class="kd-knopf" data-k="bestaetigung">${Icon('drucken')} Auftragsbestätigung drucken oder als PDF speichern</button>` : ''}
        <p class="kd-klein">Fragen? ${f.telefon ? `Telefon <a href="tel:${esc(f.telefon.replace(/\s+/g, ''))}">${esc(f.telefon)}</a>` : ''}${f.telefon && f.email ? ' · ' : ''}${f.email ? `<a href="mailto:${esc(f.email)}">${esc(f.email)}</a>` : ''}</p></div>`;
    } else if (a.status === 'abgelehnt' || a.status === 'storniert' || !online) {
      links = `<div class="kd-fertig neutral"><h2>Dieses Angebot ist nicht mehr offen</h2><p>Bitte sprechen Sie uns an, wenn Sie den Auftrag doch vergeben möchten. Wir erstellen Ihnen gern ein neues Angebot.</p></div>`;
    } else {
      const haken = (name, text) => `<label class="kd-haken"><input type="checkbox" name="${name}"><span>${text}</span></label>`;
      links = `
        <form id="kd-annahme" autocomplete="off">
          ${abgelaufen ? `<p class="kd-warn">Die Annahmefrist ist am ${datum(a.gueltigBis)} abgelaufen. Bitte rufen Sie uns kurz an, damit wir Preise und Termin bestätigen können.</p>` : ''}
          <fieldset ${abgelaufen ? 'disabled' : ''}>

          ${widerruf === 'massanfertigung' ? haken('widerruf', `Mir ist bekannt, dass es sich um eine Anfertigung nach meinen Maßen und Wünschen handelt und ein Widerrufsrecht nach § 312g Abs. 2 Nr. 1 BGB nicht besteht. <button type="button" class="kd-link" data-k="lesen" data-id="widerruf">Widerrufsbelehrung</button>`) : ''}
          ${widerruf === 'belehrung' ? haken('widerruf', `Ich habe die <button type="button" class="kd-link" data-k="lesen" data-id="widerruf">Widerrufsbelehrung</button> zur Kenntnis genommen.`) : ''}

          ${haken('datenschutz', `Ich habe den <button type="button" class="kd-link" data-k="lesen" data-id="datenschutz">Datenschutzhinweis</button> gelesen.`)}
          ${c.R.an('angebote', 'unterschriftOnline') ? `<div class="kd-feld"><span>Ihre Unterschrift</span><div class="unterschrift-feld kd-unterschrift"><canvas id="kd-canvas" aria-label="Hier mit Finger oder Maus unterschreiben"></canvas><span class="linie">Hier mit Finger oder Maus unterschreiben</span><button type="button" data-k="neu-zeichnen">Neu zeichnen</button></div></div>` : ''}
          <label class="kd-feld"><span>Vor- und Nachname</span><input name="name" autocomplete="name" value=""></label>
          <p class="kd-recht">Mit Klick auf „Zahlungspflichtig annehmen“ nehmen Sie das Angebot Nr. ${esc(a.nr)} vom ${datum(a.datum)} verbindlich an. Gesamtpreis: <b>${Zahl.eur(s.brutto)}</b> inkl. ${mwst} % USt. Danach erhalten Sie eine Auftragsbestätigung.</p>
          <button class="kd-knopf voll" type="submit">Zahlungspflichtig annehmen</button>
          </fieldset>
        </form>
        ${c.R.an('angebote', 'fragen') ? `<details class="kd-frage" ${abgelaufen ? 'open' : ''}><summary>Ich habe noch eine Frage zum Angebot</summary>
          <form id="kd-frage"><label class="kd-feld"><span>Woran hakt es noch?</span><textarea name="text" rows="4" placeholder="z. B. Geht es auch mit Lärche statt Douglasie?"></textarea></label>
          <label class="kd-feld"><span>Rückruf unter (optional)</span><input name="telefon" type="tel" autocomplete="tel"></label>
          <button class="kd-knopf" type="submit">Frage senden</button></form></details>` : ''}`;
    }

    Wurzel().innerHTML = `<div class="kd">
      <header class="kd-kopf"><div class="kd-firma"><span class="kd-zeichen">${esc((f.kuerzel || f.name || '?').slice(0, 2))}</span><div><b>${esc(f.name)}</b><small>${esc([f.strasse, [f.plz, f.ort].filter(Boolean).join(' ')].filter(Boolean).join(', '))}</small></div></div>
        <button class="kd-knopf rand" data-k="drucken">${Icon('drucken')} Drucken / PDF</button></header>
      <div class="kd-raster">
        <aside class="kd-links">
          <h1>Ihr Angebot von ${esc(f.name)}</h1>
          <dl class="kd-uebersicht">
            <dt>Angebot-Nr.</dt><dd>${esc(a.nr)}</dd>
            <dt>Für</dt><dd>${esc(a.kunde)}</dd>
            ${a.betreff ? `<dt>Leistung</dt><dd>${esc(a.betreff)}</dd>` : ''}

        <main class="kd-papier" aria-label="Angebot als Dokument">${Auftraege.dokumentHtml(c, a, a.status === 'angenommen' && c.R.an('angebote', 'bestaetigung') ? 'bestaetigung' : 'angebot')}</main>
      </div>
      <footer class="kd-fuss">${esc(f.name)}${f.inhaber ? ', Inh. ' + esc(f.inhaber) : ''} · ${esc([f.strasse, [f.plz, f.ort].filter(Boolean).join(' ')].filter(Boolean).join(', '))}${f.telefon ? ' · Tel. ' + esc(f.telefon) : ''} · <button class="kd-link" data-k="lesen" data-id="impressum">Impressum</button> · <button class="kd-link" data-k="lesen" data-id="datenschutz">Datenschutz</button> · <button class="kd-link" data-k="lesen" data-id="agb">AGB</button></footer>
    </div>`;
    bilderNachladen(Wurzel(), Store.items);

    verbinden(id, { widerruf, mitAgb });
  }

  function unterschrift() {
    const cv = $('#kd-canvas'); leer = true; if (!cv) return;
    const r = cv.getBoundingClientRect(); const f = Math.min(2, window.devicePixelRatio || 1);
    cv.width = r.width * f; cv.height = r.height * f;
    const g = cv.getContext('2d'); g.scale(f, f); g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#1d2a4a';
    let zieht = false;
    const pos = (e) => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };

      if (mitAgb && !fd.get('agb')) return meldung('Bitte bestätigen Sie die AGB.', 'fehler');

/* ---- sprache.js ---- */
/* =========================================================================
   Einsprechen: Erinnerungen und Materialbestellungen per Sprache
   Spracherkennung: in claude.ai die Diktierfunktion der Seite, sonst die des
   Browsers (Chrome, Edge, Safari). Wo es keine gibt, bleibt das Textfeld
   (die Diktiertaste der Handy-Tastatur funktioniert dort trotzdem).
   Aus dem Text wird erkannt: Händler, Mengen mit Einheit, Fälligkeit.
   ========================================================================= */
const Sprache = (() => {
  /* ---------- Spracherkennung ---------- */
  let diktat = null;
  try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('dictation').then((d) => { diktat = d; }).catch(() => {}); } catch { /* ohne */ }
  const BrowserSR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const verfuegbar = () => !!(diktat || BrowserSR);

  /* ---------- Text verstehen ---------- */
  const ZAHLWORT = { ein: 1, eine: 1, einen: 1, einer: 1, zwei: 2, drei: 3, vier: 4, 'fünf': 5, fuenf: 5, sechs: 6, sieben: 7, acht: 8, neun: 9, zehn: 10, elf: 11, 'zwölf': 12, zwanzig: 20, dreißig: 30, fünfzig: 50, hundert: 100, halbe: 0.5 };
  const EINHEIT = [
    [/^paletten?$/i, 'Pal.'], [/^rollen?$/i, 'Rollen'], [/^(stück|stk\.?)$/i, 'Stk'], [/^bund$/i, 'Bund'], [/^(pakete?|pack|packungen?)$/i, 'Pak.'],
    [/^kartons?$/i, 'Kart.'], [/^eimer$/i, 'Eimer'], [/^(sack|säcke)$/i, 'Sack'], [/^(m²|qm|quadratmeter)$/i, 'm²'], [/^(m³|kubik(meter)?)$/i, 'm³'],
    [/^(meter|m|lfm|laufmeter|laufende meter)$/i, 'm'], [/^(kg|kilo(gramm)?)$/i, 'kg'], [/^(liter|l)$/i, 'l'], [/^(dosen?|kartuschen?)$/i, 'Dosen'], [/^(kisten?|boxen?|schachteln?)$/i, 'Kisten'], [/^(tafeln|platten)$/i, 'Platten'],
  ];
  const zahlVon = (w) => { const s = String(w).toLowerCase().replace(',', '.'); return /^\d+(\.\d+)?$/.test(s) ? Number(s) : ZAHLWORT[s]; };
  const WT = { montag: 1, dienstag: 2, mittwoch: 3, donnerstag: 4, freitag: 5, samstag: 6 };

  function lieferantenListe(c) {
    return String(c.R.p('material').lieferanten || '').split('\n').map((z) => z.split('|').map((s) => s.trim())).filter((t) => t[0]).map(([name, telefon, email]) => ({ name, telefon: telefon || '', email: email || '' }));
  }

  function verstehen(c, roh) {
    const text = String(roh || '').replace(/\s+/g, ' ').trim();
    const klein = text.toLowerCase();
    // Händler: bekannte zuerst, sonst „bei/beim X“
    let lieferant = '';
    const bekannte = lieferantenListe(c);
    const treffer = bekannte.find((l) => { const n = l.name.toLowerCase(); const kern = n.split(/[\s-]+/)[0]; return klein.includes(n) || (kern.length > 3 && klein.includes(kern)); });
    if (treffer) lieferant = treffer.name;
    else { const m = text.match(/\b(?:bei|beim|von)\s+(?:der |dem |den )?([A-ZÄÖÜ][\wäöüß.&-]*(?:[\s-](?:[A-ZÄÖÜ][\wäöüß.&-]*|Einkauf|Handel))*)/); if (m && !/^(Baustelle|Kunde|Chef)/.test(m[1])) lieferant = m[1].replace(/[.,]$/, ''); }
    // Fälligkeit
    let faellig = '';
    if (/übermorgen/.test(klein)) faellig = Datum.plus(c.heute, 2);
    else if (/morgen/.test(klein)) faellig = Datum.plus(c.heute, 1);
    else if (/\bheute\b/.test(klein)) faellig = c.heute;
    else { const w = Object.keys(WT).find((t) => klein.includes(t)); if (w) { let d = Datum.plus(c.heute, 1); while (Datum.wochentag(d) !== WT[w] - 1) d = Datum.plus(d, 1); faellig = d; } }
    // Mengen: „6 Paletten Steine“, „eine Palette Gratziegel“, „3 Rollen Firstrolle“
    const positionen = [];
    const teile = text.split(/,|;|\.\s|\bund\b|\bsowie\b|\bplus\b|\n/i);
    teile.forEach((t) => {
      const m = t.trim().match(/(?:^|\s)(\d+(?:[.,]\d+)?|ein|eine|einen|einer|zwei|drei|vier|fünf|fuenf|sechs|sieben|acht|neun|zehn|elf|zwölf|zwanzig|dreißig|fünfzig|hundert|halbe)\s+(.+)$/i);
      if (!m) return; const menge = zahlVon(m[1]); if (!menge) return;
      const worte = m[2].trim().split(/\s+/);
      let einheit = ''; const e = EINHEIT.find(([r]) => r.test(worte[0])); if (e && worte.length > 1) { einheit = e[1]; worte.shift(); }
      let was = worte.join(' ').replace(/^(stück|stk)\s+/i, '').replace(/\s+(bestellen|besorgen|mitbringen|holen|ordern)\b.*$/i, '').replace(/\b(beim|bei|von)\s+.*$/i, '').replace(/[.!?]+$/, '').trim();
      if (!was || /^(uhr|tage?n?|wochen?|minuten?|mal|erinnerung|frage|termin|moment|bestellung|sache|gefallen)\b/i.test(was)) return;
      if (!einheit && /^(paletten?|rollen?)$/i.test(was)) return;
      positionen.push({ menge, einheit: einheit || 'Stk', text: was.charAt(0).toUpperCase() + was.slice(1) });
    });
    const art = positionen.length ? 'bestellung' : 'erinnerung';
    // Kurzer Titel für Erinnerungen: Floskeln vorne weg
    const kurz = text.replace(/^(bitte\s+)?(schreib(e)?\s+(mir\s+)?(eine\s+)?erinnerung,?\s*|erinner(e|n)?\s+(mich|uns)\s*(daran)?,?\s*|nicht vergessen,?\s*)/i, '').replace(/^(dass|das)\s+(ich|wir)\s+/i, '').replace(/^an\s+/i, '');
    return { art, text, kurz: kurz.charAt(0).toUpperCase() + kurz.slice(1), lieferant, faellig, positionen };
  }

  /* ---------- Dialog ---------- */
  let hoert = false; let stopFn = null;
  function oeffne(c, bereich = 'ui-buero-fenster') {
    let erkannt = verstehen(c, '');
    const kannHoeren = verfuegbar();
    const hg = Fenster.oeffne({
      titel: 'Einsprechen', bereich: `${bereich} sprach-fenster`,
      inhalt: `<div class="sp-mikro">
          <button type="button" class="sp-knopf" data-f="hoeren" ${kannHoeren ? '' : 'hidden'} aria-label="Aufnahme starten">${Icon('mikro')}</button>
          <div><b id="sp-status">${kannHoeren ? 'Antippen und sprechen' : 'Hier eintippen oder die Diktiertaste der Tastatur nutzen'}</b>
          <small>z. B. „Beim Dachdecker-Einkauf bestellen: 6 Paletten Steine, eine Palette Gratziegel, 3 Rollen Firstrolle“ oder „Erinnere mich morgen, Gerdes wegen der Rinne anzurufen“</small></div></div>
        <label class="feld"><span>Text</span><textarea id="sp-text" rows="3" placeholder="Was soll ich aufschreiben?"></textarea></label>
        <div id="sp-ergebnis"></div>
        <p class="sp-ausblick">Die Erkennung von Mengen und Händlern läuft nach festen Regeln im Programm. Ausblick: Ein KI-Assistent, der aus dem Gesprochenen auch Aufmaße und Angebotsentwürfe macht, ist in Planung.</p>`,
      fuss: `<button class="k" data-f="zu">Abbrechen</button><button class="k haupt" data-f="speichern">${Icon('haken')} Speichern</button>`,
      aktionen: {
        hoeren: () => (hoert ? stopp() : hoeren()),
        art: (b) => { erkannt.art = b.dataset.id; zeigen(); },
        speichern: () => speichern(),
      },
    });
    const feld = $('#sp-text', hg);
    feld.addEventListener('input', () => { erkannt = verstehen(c, feld.value); zeigen(); });
    hg.addEventListener('change', (e) => { if (e.target.id === 'sp-lieferant') erkannt.lieferant = e.target.value.trim(); if (e.target.id === 'sp-faellig') erkannt.faellig = e.target.value; });
    function status(t, an) { const s = $('#sp-status', hg); if (s) s.textContent = t; const k = $('.sp-knopf', hg); if (k) k.classList.toggle('an', !!an); }
    function zeigen() {
      const e = erkannt; const z = $('#sp-ergebnis', hg); if (!z) return;
      if (!e.text) { z.innerHTML = ''; return; }
      const wahl = `<span class="segment"><button type="button" class="${e.art === 'bestellung' ? 'an' : ''}" data-f="art" data-id="bestellung">Bestellung</button><button type="button" class="${e.art === 'erinnerung' ? 'an' : ''}" data-f="art" data-id="erinnerung">Erinnerung</button></span>`;
      z.innerHTML = `<div class="sp-erkannt"><div class="sp-kopf"><b>Erkannt</b>${wahl}</div>
        ${e.art === 'bestellung' ? `<div class="reihe"><label class="feld"><span>Bei</span><input id="sp-lieferant" list="sp-liste" value="${esc(e.lieferant)}" placeholder="${esc(c.R.p('material').haendler)}"><datalist id="sp-liste">${lieferantenListe(c).map((l) => `<option value="${esc(l.name)}">`).join('')}</datalist></label>
          ${c.R.mitBaustelle('material') ? `<label class="feld"><span>Baustelle</span><select id="sp-bs"><option value="">ohne Baustelle</option>${c.baustellenOffen().map((b) => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label>` : ''}</div>
          ${e.positionen.length ? `<table class="t sp-pos"><tbody>${e.positionen.map((p) => `<tr><td class="r num">${String(p.menge).replace('.', ',')}</td><td>${esc(p.einheit)}</td><td>${esc(p.text)}</td></tr>`).join('')}</tbody></table>` : '<p class="sp-leer">Keine Mengen erkannt. Die Bestellung wird als Text gespeichert.</p>'}`
        : `<div class="reihe"><label class="feld"><span>Erinnerung</span><input id="sp-kurz" value="${esc(e.kurz)}"></label><label class="feld"><span>Wann</span><input id="sp-faellig" type="date" value="${esc(e.faellig || c.heute)}"></label></div>`}</div>`;
    }
    function hoeren() {
      hoert = true; status('Ich höre zu …', true);
      const basis = feld.value ? feld.value.replace(/\s*$/, ' ') : '';
      let fertig = basis;
      const neu = (t, vorlaeufig) => { feld.value = (fertig + (vorlaeufig || '')).trimStart(); if (!vorlaeufig) fertig = feld.value; erkannt = verstehen(c, feld.value); zeigen(); };
      if (diktat) {
        const ab = [diktat.onPartial(({ text }) => neu('', text)), diktat.onFinal(({ text }) => { fertig += text; neu(''); }),
          diktat.onState(({ state, reason }) => { if (state === 'idle') { hoert = false; ab.forEach((u) => u()); status(reason === 'not_granted' ? 'Mikrofon nicht erlaubt. Bitte eintippen.' : 'Fertig. Noch etwas? Nochmal antippen.', false); } })];
        diktat.start({ language: 'de' }).catch((err) => { hoert = false; ab.forEach((u) => u()); status(err && err.code === 'not_granted' ? 'Mikrofon nicht erlaubt. Bitte eintippen.' : 'Spracherkennung gerade nicht verfügbar. Bitte eintippen.', false); });
        stopFn = () => diktat.stop();
        return;
      }
      const sr = new BrowserSR(); sr.lang = 'de-DE'; sr.interimResults = true; sr.continuous = true;
      sr.onresult = (ev) => { let vorl = ''; for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) { fertig += (fertig && !/\s$/.test(fertig) ? ' ' : '') + r[0].transcript.trim(); neu(''); } else vorl += r[0].transcript; } if (vorl) neu('', (fertig && !/\s$/.test(fertig) ? ' ' : '') + vorl); };
      sr.onerror = (ev) => { status(ev.error === 'not-allowed' ? 'Mikrofon nicht erlaubt. Bitte eintippen.' : 'Nicht verstanden. Nochmal antippen oder eintippen.', false); };
      sr.onend = () => { hoert = false; status('Fertig. Noch etwas? Nochmal antippen.', false); };
      try { sr.start(); } catch { hoert = false; status('Spracherkennung gerade nicht verfügbar. Bitte eintippen.', false); }
      stopFn = () => sr.stop();
    }
    function stopp() { hoert = false; if (stopFn) stopFn(); status('Fertig.', false); }
    async function speichern() {
      if (hoert) { stopp(); await new Promise((r) => setTimeout(r, 400)); }
      const e = verstehen(c, feld.value); e.art = erkannt.art || e.art;
      if (!e.text) return meldung('Bitte etwas einsprechen oder eintippen.', 'fehler');
      const pid = c.ich ? c.ich.id : '';

        const lief = ($('#sp-lieferant', hg) || {}).value; const bs = ($('#sp-bs', hg) || {}).value || '';

        Store.neu({ typ: 'material', pid, datum: c.heute, bs, text, positionen: e.positionen, lieferant: (lief || e.lieferant || '').trim(), quelle: 'sprache', status: 'offen' });
        meldung(c.ich && ['chef', 'buero'].includes(c.ich.rolle) ? 'Auf der Bestellliste' : 'An den Chef gesendet');
      } else {
        Store.neu({ typ: 'erinnerung', pid, datum: c.heute, text: (($('#sp-kurz', hg) || {}).value || e.kurz).trim(), faellig: ($('#sp-faellig', hg) || {}).value || e.faellig || c.heute, quelle: 'sprache' });

  }

  /* Knöpfe mit data-sprache gehen überall (Büro und App) */
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest && ev.target.closest('[data-sprache]'); if (!el) return;
    ev.preventDefault();
    const app = document.body.classList.contains('app-modus');
    const s = Sitzung.lies(app ? 'app' : 'buero') || {};
    oeffne(kontext(Store.cfg, Store.items, s.pid), app ? 'ui-buero-fenster app-fenster' : 'ui-buero-fenster');
  });

  /* Erinnerungen abhaken (Büro und App) */
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest && ev.target.closest('[data-erinnerung]'); if (!el) return;
    ev.preventDefault(); ev.stopPropagation();

  }, true);
  const meine = (c) => c.typ('erinnerung').filter((e) => !e.erledigt && c.ich && e.pid === c.ich.id).sort((a, b) => (a.faellig || '').localeCompare(b.faellig || ''));

  Buero.erweitern({ aufgaben: (c) => meine(c).filter((e) => !e.faellig || e.faellig <= Datum.plus(c.heute, 1)).map((e) => ({ titel: e.text, unter: `Erinnerung · ${wann(c, e)}`, erinnerung: e.id })) });

  return { oeffne, verstehen, lieferantenListe, meine, wann };
})();

/* ---- rechner.js ---- */
/* =========================================================================
   Rechner für die Baustelle: Lattung mit Schrauben bei Aufsparrendämmung
   und U-Wert eines Bauteils. Ergebnisse sind Richtwerte, kein Ersatz für
   Statik, Herstellerangaben oder einen Energieberater. Druck = PDF.
   ========================================================================= */
const Rechner = (() => {
  const zahl = (v) => Number(String(v ?? '').replace(',', '.')) || 0;
  const z1 = (n, s = 1) => (Math.round(n * 10 ** s) / 10 ** s).toLocaleString('de-DE', { minimumFractionDigits: s, maximumFractionDigits: s });
  const ganz = (n) => Math.round(n).toLocaleString('de-DE');
  const feld = (name, titel, wert, einheit, extra = '') => `<label class="feld"><span>${titel}</span><div class="mit-einheit"><input name="${name}" inputmode="decimal" value="${esc(String(wert).replace('.', ','))}" ${extra}><i>${einheit}</i></div></label>`;
  const HINWEIS = 'Richtwert zur Planung und Bestellung. Maßgeblich sind Statik, Verlegeanleitung und Zulassung des Herstellers.';
  const HERSTELLER = [['SFS', 'https://www.sfs.com'], ['Würth', 'https://www.wuerth.de'], ['SPAX', 'https://www.spax.com'], ['Steico', 'https://www.steico.com'], ['Gutex', 'https://www.gutex.de'], ['Bauder', 'https://www.bauder.de']];

  /* ---------- Lattung ---------- */
  function lattung(w) {
    const traufe = zahl(w.traufe); const sparren = zahl(w.sparren); const flaechen = Math.max(1, Math.round(zahl(w.flaechen)));
    const abstand = zahl(w.abstand) / 100; const lattweite = zahl(w.lattweite) / 100; const sAbst = zahl(w.schraubAbstand) / 100;
    const [klH, klB] = String(w.kl).split('/').map(Number); const [tlH, tlB] = String(w.tl).split('/').map(Number);
    const daemm = zahl(w.daemmung); const tiefe = zahl(w.tiefe); const versch = 1 + zahl(w.verschnitt) / 100;
    if (!traufe || !sparren || !abstand || !lattweite) return null;
    const nSparren = Math.floor(traufe / abstand + 1e-9) + 1;
    const reihen = Math.ceil(sparren / lattweite - 1e-9) + 1;
    const klLfm = nSparren * sparren * flaechen * versch;
    const tlLfm = reihen * traufe * flaechen * versch;
    const schraubenJeSparren = Math.ceil(sparren / sAbst - 1e-9) + 1;
    const schrauben = Math.ceil(nSparren * schraubenJeSparren * flaechen * 1.03);
    const mindLaenge = klH + daemm + (tiefe || 80);
    const laenge = Math.ceil(mindLaenge / 20) * 20;
    const befestiger = Math.ceil(nSparren * reihen * flaechen * 1.05);
    const flaeche = traufe * sparren * flaechen;
    return { nSparren, reihen, klLfm, tlLfm, schraubenJeSparren, schrauben, mindLaenge, laenge, befestiger, flaeche, klB, klH, tlB, tlH, flaechen, daemm, lattStk: Math.ceil(tlLfm / zahl(w.lattlaenge || 4)), klStk: Math.ceil(klLfm / zahl(w.lattlaenge || 4)) };
  }
  function lattungHtml(c, w, e) {
    const zeilen = [
      [`Konterlatten ${e.klH}/${e.klB} mm`, `${z1(e.klLfm)} lfm`, `ca. ${e.klStk} Stk à ${z1(zahl(w.lattlaenge), 1)} m`],
      [`Traglatten ${e.tlH}/${e.tlB} mm`, `${z1(e.tlLfm)} lfm`, `ca. ${e.lattStk} Stk à ${z1(zahl(w.lattlaenge), 1)} m`],
      ['Befestiger Traglatte (je Kreuzungspunkt)', `${ganz(e.befestiger)} Stk`, 'Nägel oder Schrauben nach Herstellerangabe'],
    ];
    return `<div class="r-ergebnis"><div class="r-kacheln">
        <div><small>Dachfläche</small><b>${z1(e.flaeche)} m²</b></div><div><small>Sparren je Fläche</small><b>${e.nSparren}</b></div><div><small>Lattreihen</small><b>${e.reihen}</b></div></div>
      <table class="t"><thead><tr><th>Material</th><th class="r">Menge</th><th>Hinweis</th></tr></thead><tbody>${zeilen.map(([a, b, h]) => `<tr><td>${a}</td><td class="r num">${b}</td><td>${h}</td></tr>`).join('')}</tbody></table>
      ${e.daemm ? `<div class="r-hersteller"><b>Schrauben für die Konterlatte durch ${e.daemm} mm Aufsparrendämmung</b><p>Anzahl, Länge und Abstand hängen von Schneelast, Windsog und Dachneigung ab. Sie werden mit dem Bemessungsprogramm des Herstellers ermittelt, dessen Dämmung oder Schrauben verbaut werden. Richtwerk rechnet sie bewusst nicht selbst.</p>
        <div class="r-links">${HERSTELLER.map(([n, u]) => `<a class="k klein" href="${u}" target="_blank" rel="noopener">${n}</a>`).join('')}</div></div>` : ''}
      <p class="r-hinweis">Verschnitt ${z1(zahl(w.verschnitt), 0)} % auf Latten, 5 % auf Befestiger. ${HINWEIS}</p></div>`;
  }

  /* ---------- U-Wert ---------- */
  const STOFFE = [
    ['Mineralwolle WLS 035', 0.035], ['Mineralwolle WLS 032', 0.032], ['Holzfaser WLS 040', 0.040], ['Holzfaser-Unterdeckplatte WLS 045', 0.045], ['Zellulose WLS 040', 0.040],
    ['PIR/PUR WLS 023', 0.023], ['EPS WLS 035', 0.035], ['Holz (Sparren, Schalung)', 0.13], ['OSB-Platte', 0.13], ['Gipskartonplatte', 0.25], ['Ziegelmauerwerk (alt)', 0.81], ['Beton', 2.1], ['Eigener Wert', 0],
  ];
  const STD_SCHICHTEN = [
    { stoff: 'Holzfaser-Unterdeckplatte WLS 045', d: 60, lambda: 0.045, zw: false },
    { stoff: 'Mineralwolle WLS 035', d: 180, lambda: 0.035, zw: true },
    { stoff: 'OSB-Platte', d: 15, lambda: 0.13, zw: false },
    { stoff: 'Gipskartonplatte', d: 12.5, lambda: 0.25, zw: false },
  ];
  function uwert(schichten, w) {
    const rsi = 0.10; const rse = w.belueftet === 'ja' ? 0.10 : 0.04;
    const f = Math.min(0.5, Math.max(0, zahl(w.holz) / 100));
    let rG = rsi + rse; let rH = rsi + rse;
    schichten.forEach((s) => { const d = zahl(s.d) / 1000; const l = zahl(s.lambda); if (!d || !l) return; rG += d / l; rH += d / (s.zw ? 0.13 : l); });
    const hatZw = schichten.some((s) => s.zw);
    const u = hatZw ? f / rH + (1 - f) / rG : 1 / rG;
    const vorher = zahl(w.vorher); const flaeche = zahl(w.flaeche);
    return { u, rG, vorher, flaeche, ersparnis: vorher > u && flaeche ? (vorher - u) * flaeche * 84 : 0, f, hatZw };
  }
  function uHtml(e) {
    const ampel = e.u <= 0.14 ? 'ok' : e.u <= 0.24 ? 'info' : 'bad';
    return `<div class="r-ergebnis"><div class="r-kacheln">
        <div class="gross ${ampel}"><small>U-Wert</small><b>${z1(e.u, 3)}</b><i>W/(m²·K)</i></div>
        ${e.vorher ? `<div><small>Vorher</small><b>${z1(e.vorher, 2)}</b><i>W/(m²·K)</i></div><div><small>Verbesserung</small><b>${e.vorher > e.u ? z1(100 * (e.vorher - e.u) / e.vorher, 0) + ' %' : '–'}</b></div>` : ''}
        ${e.ersparnis ? `<div><small>Heizwärme gespart, grob</small><b>${ganz(e.ersparnis)}</b><i>kWh im Jahr</i></div>` : ''}</div>
      <ul class="r-grenzen">
        <li class="${e.u <= 0.24 ? 'ok' : 'bad'}">${e.u <= 0.24 ? 'Erfüllt' : 'Nicht erfüllt'}: Höchstwert 0,24 W/(m²·K) für Steildächer bei Erneuerung (GEG, Anlage 7)</li>
        <li class="${e.u <= 0.14 ? 'ok' : 'bad'}">${e.u <= 0.14 ? 'Erfüllt' : 'Nicht erfüllt'}: 0,14 W/(m²·K) für die Förderung als Einzelmaßnahme (BEG, Dachflächen)</li></ul>
      <p class="r-hinweis">Vereinfacht nach DIN EN ISO 6946: Rsi 0,10${e.f && e.hatZw ? `, Holzanteil ${z1(e.f * 100, 0)} % in der Dämmebene (λ 0,13)` : ''}, ohne Wärmebrücken und Korrekturen. Ersparnis geschätzt mit 84 kKh/a. Grenzwerte vor Angebot auf aktuellen Stand prüfen. Kein Ersatz für einen Energieausweis oder die Berechnung eines Energieberaters.</p></div>`;
  }

  /* ---------- Fenster ---------- */
  function oeffne(c, art = 'lattung', bereich = 'ui-buero-fenster') {
    const P = c.R.hat('rechner') ? c.R.p('rechner') : {};
    let schichten = JSON.parse(JSON.stringify(STD_SCHICHTEN));
    const reiter = `<div class="bf-reiter r-reiter"><button type="button" data-f="art" data-id="lattung" class="${art === 'lattung' ? 'an' : ''}">Lattung</button><button type="button" data-f="art" data-id="uwert" class="${art === 'uwert' ? 'an' : ''}">U-Wert</button></div>`;
    const formLattung = `<form id="r-form" class="r-form">
        <div class="r-raster">${feld('traufe', 'Länge an der Traufe', 10.5, 'm')}${feld('sparren', 'Sparrenlänge (Traufe bis First)', 6.2, 'm')}${feld('flaechen', 'Dachflächen (Satteldach = 2)', 2, 'Stk')}
          ${feld('abstand', 'Sparrenabstand', 75, 'cm')}${feld('lattweite', 'Lattweite (laut Ziegel)', 33.5, 'cm')}${feld('daemmung', 'Aufsparrendämmung', 160, 'mm')}
          <label class="feld"><span>Konterlatte</span><select name="kl">${['40/60', '30/50', '50/80', '60/80'].map((v) => `<option ${v === '40/60' ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
          <label class="feld"><span>Traglatte</span><select name="tl">${['30/50', '40/60', '24/48'].map((v) => `<option ${v === '30/50' ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
          ${feld('verschnitt', 'Verschnitt Latten', P.verschnitt || 10, '%')}${feld('lattlaenge', 'Lattenlänge', 4, 'm')}</div>
      </form>`;
    const formU = () => `<form id="r-form" class="r-form">
        <table class="t r-schichten"><thead><tr><th>Schicht von außen nach innen</th><th style="width:96px">Dicke mm</th><th style="width:96px">λ W/(m·K)</th><th style="width:96px" title="Liegt zwischen den Sparren">Zw. Sparren</th><th></th></tr></thead><tbody>
          ${schichten.map((s, i) => `<tr data-i="${i}"><td><select data-k="stoff">${STOFFE.map(([n]) => `<option ${n === s.stoff ? 'selected' : ''}>${n}</option>`).join('')}</select></td>
            <td><input data-k="d" inputmode="decimal" value="${String(s.d).replace('.', ',')}"></td><td><input data-k="lambda" inputmode="decimal" value="${String(s.lambda).replace('.', ',')}"></td>

        <div class="r-raster">${feld('holz', 'Holzanteil zwischen den Sparren', 12, '%')}${feld('vorher', 'U-Wert vorher (optional)', '', 'W/(m²·K)')}${feld('flaeche', 'Fläche (optional)', '', 'm²')}
          <label class="feld"><span>Dach hinterlüftet (Ziegel, Schiefer)</span><select name="belueftet"><option value="ja">ja</option><option value="nein">nein</option></select></label></div>
      </form>`;
    const hg = Fenster.oeffne({
      titel: 'Rechner', breit: true, bereich: `${bereich} rechner-fenster`,

          meldung('Auf der Bestellliste');
        },

    const werte = () => Object.fromEntries(new FormData($('#r-form', hg)));
    function lesenSchichten() { $$('.r-schichten tr[data-i]', hg).forEach((tr) => { const s = schichten[Number(tr.dataset.i)]; s.stoff = $('[data-k=stoff]', tr).value; s.d = zahl($('[data-k=d]', tr).value); s.lambda = zahl($('[data-k=lambda]', tr).value); s.zw = $('[data-k=zw]', tr).checked; }); }
    function rechnen() {
      const out = $('#r-aus', hg); if (!out) return;
      if (art === 'lattung') { const e = lattung(werte()); out.innerHTML = e ? lattungHtml(c, werte(), e) : '<p class="r-hinweis">Bitte Maße eintragen.</p>'; }
      else { lesenSchichten(); out.innerHTML = uHtml(uwert(schichten, werte())); }
    }
    function aufbauen() { $('#r-koerper', hg).innerHTML = (art === 'lattung' ? formLattung : formU()) + '<div id="r-aus"></div>'; $('#r-bestellen', hg).hidden = art !== 'lattung'; rechnen(); }
    hg.addEventListener('input', rechnen);
    hg.addEventListener('change', (ev) => {
      if (ev.target.dataset.k === 'stoff') { const st = STOFFE.find(([n]) => n === ev.target.value); if (st && st[1]) ev.target.closest('tr').querySelector('[data-k=lambda]').value = String(st[1]).replace('.', ','); }
      rechnen();
    });
    function dokument() {
      const f = c.cfg; const w = werte();
      const titel = art === 'lattung' ? 'Materialermittlung Lattung' : 'U-Wert-Berechnung (Richtwert)';
      const eingaben = art === 'lattung'
        ? `<table class="d-pos"><tbody>${[['Länge Traufe', w.traufe + ' m'], ['Sparrenlänge', w.sparren + ' m'], ['Dachflächen', w.flaechen], ['Sparrenabstand', w.abstand + ' cm'], ['Lattweite', w.lattweite + ' cm'], ['Aufsparrendämmung', w.daemmung + ' mm'], ['Konterlatte / Traglatte', `${w.kl} / ${w.tl} mm`]].map(([a, b]) => `<tr><td>${a}</td><td class="r">${esc(b)}</td></tr>`).join('')}</tbody></table>`

  document.addEventListener('click', (ev) => {

  return { oeffne, lattung, uwert };
})();

      html += `<div class="a-karte">${zeile({ sym: 'haken', symKlasse: 'firma', titel: n ? `${n} Freigaben warten` : 'Keine Freigaben offen', unter: n ? [o.urlaub.length && `${o.urlaub.length} Urlaub`, o.stunden.length && `${o.stunden.length} Stunden`, o.material.length && `${o.material.length} Material`].filter(Boolean).join(' · ') : 'Alles erledigt', a: n ? 'reiter' : '', id: 'freigaben' })}</div>
        <div class="a-titel">Heute im Einsatz</div><div class="a-karte">${arbeiter.map((p) => { const l = c.laeuft(p.id); const abw = c.abwesend(p.id, c.heute);
          return zeile({ sym: 'person', titel: esc(p.name), unter: l ? `${esc(c.bsName(l.bs))} · seit ${esc(l.von)}` : abw ? (abw.typ === 'krank' ? 'Krank' : 'Urlaub') : 'nicht eingestempelt', rechts: l ? '<span class="a-status ok">Da</span>' : '' }); }).join('') || zeile({ titel: 'Noch keine Mitarbeiter' })}</div>`;
      return html;
    }

    // Stempeluhr
    if (R.stempeln()) {
      const l = c.laeuft(ich.id);
      if (l) {
        html += `<div class="a-karte stempel"><div class="status laeuft"><i></i>Eingestempelt seit ${esc(l.von)} Uhr</div>
          <div class="zeit" data-seit="${esc(l.datum)}T${esc(l.von)}">${Zahl.hhmm((Date.now() - new Date(`${l.datum}T${l.von}`).getTime()) / 60000)}</div>
          <div class="ort">${R.mitBaustelle('stunden') ? esc(c.bsName(l.bs)) : 'Arbeitszeit läuft'}</div>
          <button class="gross-knopf rot" data-a="feierabend">${Icon('stop')} Feierabend</button>
          ${R.mitBaustelle('stunden') ? `<button class="gross-knopf hell" style="margin-top:10px" data-a="unter" data-id="wechsel">Baustelle wechseln</button>` : ''}</div>`;
      } else {
        const heuteErfasst = c.stundenAm(ich.id, c.heute).reduce((s, e) => s + stundenVon(e), 0);
        html += `<div class="a-karte stempel"><div class="status"><i></i>${heuteErfasst ? `Heute schon ${Zahl.std(heuteErfasst)} Std. erfasst` : 'Nicht eingestempelt'}</div>
          <div class="zeit">${Datum.uhr(Date.now())}</div><div class="ort">${esc(c.cfg.name)}</div>
          <button class="gross-knopf firma" data-a="${R.mitBaustelle('stunden') ? 'unter' : 'einstempeln'}" data-id="einstempeln">${Icon('play')} Arbeitsbeginn</button></div>`;
      }
    } else if (R.stundenImApp()) {
      html += `<div class="a-karte stempel"><div class="status"><i></i>Stundenzettel</div><div class="ort" style="margin-top:8px">Trage deine Arbeitszeit für heute ein.</div><button class="gross-knopf firma" data-a="unter" data-id="stunden">${Icon('plus')} Stunden eintragen</button></div>`;
    }

    // Baustelle heute und Plan für den nächsten Arbeitstag
    const lauf = c.laeuft(ich.id);
    const heutePlan = c.geplant(ich.id, c.heute);
    const bsHeute = (lauf && lauf.bs) || (c.baustelle(heutePlan) ? heutePlan : '');
    if (bsHeute && R.hat('baustellen')) html += baustelleKarte(c, bsHeute, lauf ? 'Deine Baustelle' : 'Heute laut Plan');
    if (R.plan()) {
      const morgen = naechsterArbeitstag(c.heute); const wert = c.geplant(ich.id, morgen);
      html += `<div class="a-karte" style="margin-top:12px">${zeile({ sym: 'plan', titel: `${Datum.WT[Datum.wochentag(morgen)]}, ${Datum.kurz(morgen)}: ${esc(c.planText(wert))}`, unter: wert && c.baustelle(wert) ? esc(c.baustelle(wert).ort) : wert ? '' : 'Noch nicht eingeteilt', a: 'reiter', id: 'zeiten' })}</div>`;
    }

    // Woche
    if (R.stundenImApp()) {
      const wo = Datum.montag(c.heute); const soll = Number(ich.soll) || Number(R.p('stunden').soll);
      const tage = Array.from({ length: 5 }, (_, i) => Datum.plus(wo, i));
      const werte = tage.map((d) => c.stundenAm(ich.id, d));
      const max = Math.max(9, ...werte.map((w) => w.reduce((s, e) => s + stundenVon(e), 0)));
      const summe = werte.flat().reduce((s, e) => s + stundenVon(e), 0);
      html += `<div class="a-titel">Diese Woche</div><div class="a-karte"><div class="woche-balken">${tage.map((d, i) => { const hh = werte[i].reduce((s, e) => s + stundenVon(e), 0); const offen = werte[i].some((e) => e.status === 'offen');
        return `<div><span class="num" style="color:#15191e;font-weight:600">${hh ? Zahl.std(hh).replace(',00', '') : ''}</span><i class="${d === c.heute ? 'heute' : offen ? 'offen' : ''}" style="height:${d > c.heute ? 0 : (hh / max) * 70}%;${d > c.heute ? 'min-height:0' : ''}"></i>${Datum.WT[i]}</div>`; }).join('')}</div>
        <div class="summe-zeile"><span>Summe</span><b class="num">${Zahl.std(summe)} / ${soll} Std.</b></div></div>`;
    }

    // Neuigkeiten
    const neu = [];
    c.items.filter((i) => i.pid === ich.id && i.typ === 'urlaub' && i.entschieden && Date.now() - i.entschieden < 14 * 864e5).forEach((u) => neu.push(zeile({ sym: u.status === 'genehmigt' ? 'haken' : 'x', titel: `Urlaub ${u.status === 'genehmigt' ? 'genehmigt' : 'abgelehnt'}`, unter: `${Datum.kurz(u.von)} bis ${Datum.kurz(u.bis)}`, rechts: status(u.status) })));
    c.items.filter((i) => i.typ === 'dokument' && (i.fuer === ich.id || i.fuer === 'alle') && !i.gelesen).forEach((d) => neu.push(zeile({ sym: 'dokument', symKlasse: 'firma', titel: esc(d.titel), unter: 'Neu vom Büro', a: 'dokument', id: d.id })));
    c.items.filter((i) => i.pid === ich.id && i.typ === 'beleg' && i.status === 'abgelehnt').forEach((b) => neu.push(zeile({ sym: 'beleg', titel: `Beleg ${Zahl.eur(b.betrag)} abgelehnt`, unter: 'Bitte im Büro melden', rechts: status('abgelehnt') })));
    if (neu.length) html += `<div class="a-titel">Neuigkeiten</div><div class="a-karte">${neu.join('')}</div>`;

    // Zuletzt gesendet
    const letzte = c.items.filter((i) => i.pid === ich.id && ['beleg', 'lieferschein', 'material'].includes(i.typ)).sort((a, b) => b.erstellt - a.erstellt).slice(0, 3);
    if (letzte.length) html += `<div class="a-titel">Zuletzt gesendet</div><div class="a-karte">${letzte.map((e) => zeile({ sym: e.typ === 'beleg' ? 'beleg' : e.typ === 'material' ? 'material' : 'liefer', titel: e.typ === 'beleg' ? `${esc(e.kategorie)} ${Zahl.eur(e.betrag)}` : e.typ === 'material' ? esc(e.text) : `Lieferschein ${esc(e.lieferant)}`, unter: `${Datum.kurz(e.datum)} · ${esc(c.bsName(e.bs))}`, rechts: status(e.status) })).join('')}</div>`;
    return html;
  };

  BILD.zeiten = (c) => {
    const wo = zustand.woche; const tage = Array.from({ length: 7 }, (_, i) => Datum.plus(wo, i));
    const eig = c.items.filter((i) => i.typ === 'stunden' && i.pid === c.ich.id && i.datum >= wo && i.datum <= tage[6]);
    const summe = eig.reduce((s, e) => s + stundenVon(e), 0);
    const nachtrag = Number(c.R.p('stunden').nachtrag);
    return `<div class="unterseite-kopf" style="justify-content:space-between"><h2>Meine Zeiten</h2><span style="display:flex;gap:6px"><button class="rund-knopf" data-a="woche" data-id="-7">${Icon('zurueck')}</button><button class="rund-knopf" data-a="woche" data-id="7">${Icon('pfeil')}</button></span></div>
      <div class="a-titel">KW ${Datum.kw(wo)} · ${Datum.kurz(wo)} – ${Datum.kurz(tage[6])}</div>
      <div class="a-karte">${tage.filter((d) => Datum.istWerktag(d) || eig.some((e) => e.datum === d)).map((d) => {
        const es = eig.filter((e) => e.datum === d); const abw = c.abwesend(c.ich.id, d);
        if (!es.length) return zeile({ titel: Datum.mittel(d), unter: abw ? (abw.typ === 'krank' ? 'Krank' : 'Urlaub') : d > c.heute ? '' : 'nichts erfasst', rechts: '' });
        return es.map((e) => zeile({ titel: `${Datum.mittel(d)} · ${esc(e.von)} – ${esc(e.bis || 'läuft')}`, unter: [c.R.mitBaustelle('stunden') && c.bsName(e.bs), e.taetigkeit].filter(Boolean).map(esc).join(' · '), rechts: `${e.bis ? Zahl.std(stundenVon(e)) : ''}<small>${status(e.status)}</small>`, a: e.status === 'offen' || e.status === 'abgelehnt' ? 'eintrag' : '', id: e.id })).join('');
      }).join('')}<div class="summe-zeile"><span>Woche gesamt</span><b class="num">${Zahl.std(summe)} Std.</b></div></div>
      ${c.R.plan() ? `<div class="a-titel">Plan KW ${Datum.kw(wo)}</div><div class="a-karte">${tage.slice(0, c.R.p('wochenplan').tage === 'Mo bis Sa' ? 6 : 5).map((d) => { const w = c.geplant(c.ich.id, d); return zeile({ titel: `${Datum.WT[Datum.wochentag(d)]} ${Datum.kurz(d)}`, unter: esc(c.planText(w)), rechts: d === c.heute ? '<span class="a-status info">Heute</span>' : '' }); }).join('')}</div>` : ''}
      ${c.R.stundenImApp() ? `<button class="gross-knopf hell" style="margin-top:16px" data-a="unter" data-id="stunden">${Icon('plus')} Stunden nachtragen</button><p style="color:#6b7280;font-size:13px;text-align:center">Nachtragen bis ${nachtrag} Tage zurück möglich.</p>` : ''}`;
  };

  BILD.erfassen = (c) => {
    const R = c.R; const k = [];
    if (R.imApp('belege')) k.push(`<button class="erfassen-kachel gross" data-a="unter" data-id="beleg"><span class="sym">${Icon('kamera')}</span><span><b>Beleg scannen</b><small>Tankquittung, Baumarkt, Werkzeug</small></span></button>`);
    if (R.imApp('lieferscheine')) k.push(`<button class="erfassen-kachel" data-a="unter" data-id="lieferschein"><span class="sym">${Icon('liefer')}</span><span><b>${esc(R.name('lieferscheine').replace(/e$/, ''))}</b><small>${esc(R.hinweis('lieferscheine') || 'abfotografieren')}</small></span></button>`);
    if (R.stundenImApp()) k.push(`<button class="erfassen-kachel" data-a="unter" data-id="stunden"><span class="sym">${Icon('uhr')}</span><span><b>Stunden</b><small>nachtragen</small></span></button>`);
    if (R.imApp('urlaub')) k.push(`<button class="erfassen-kachel" data-a="unter" data-id="urlaubsantrag"><span class="sym">${Icon('kalender')}</span><span><b>Urlaub</b><small>beantragen</small></span></button>`);
    if (R.imApp('urlaub') && R.p('urlaub').krank === 'ja') k.push(`<button class="erfassen-kachel" data-a="unter" data-id="krank"><span class="sym">${Icon('krank')}</span><span><b>Krank melden</b><small>geht direkt ans Büro</small></span></button>`);
    if (R.imApp('regie')) k.push(`<button class="erfassen-kachel" data-a="unter" data-id="regie"><span class="sym">${Icon('unterschrift')}</span><span><b>${esc(R.name('regie'))}</b><small>${esc(R.hinweis('regie') || 'Zusatzarbeit, Kunde unterschreibt')}</small></span></button>`);
    if (R.imApp('bautagebuch')) k.push(`<button class="erfassen-kachel" data-a="unter" data-id="tagebuch"><span class="sym">${Icon('foto')}</span><span><b>${esc(R.name('bautagebuch'))}</b><small>${esc(R.hinweis('bautagebuch') || 'Fotos und Notiz zum Tag')}</small></span></button>`);
    if (R.imApp('material') && R.an('material', 'sprache')) k.unshift(`<button class="erfassen-kachel gross sprach-kachel" data-sprache><span class="sym">${Icon('mikro')}</span><span><b>Einsprechen</b><small>Bestellung oder Erinnerung, einfach sagen</small></span></button>`);
    if (R.imApp('rechner')) k.push(`<button class="erfassen-kachel" data-rechner="lattung"><span class="sym">${Icon('rechner')}</span><span><b>Lattung</b><small>Latten und Befestiger für das Dach</small></span></button>`, `<button class="erfassen-kachel" data-rechner="uwert"><span class="sym">${Icon('rechner')}</span><span><b>U-Wert</b><small>Dämmwert für den Bauherrn</small></span></button>`);
    if (R.imApp('material')) k.push(`<button class="erfassen-kachel" data-a="unter" data-id="material"><span class="sym">${Icon('material')}</span><span><b>${esc(R.name('material') === 'Materialbedarf' ? 'Material' : R.name('material'))}</b><small>${esc(R.hinweis('material') || 'fehlt auf der Baustelle')}</small></span></button>`);
    return `<div class="unterseite-kopf"><h2>Erfassen</h2></div>${k.length ? `<div class="erfassen-raster">${k.join('')}</div>` : '<div class="a-karte"><div class="leer">Für dich ist noch nichts freigeschaltet.</div></div>'}`;
  };

  BILD.urlaub = (c) => {
    const k = c.urlaubKonto(c.ich.id);
    const eig = c.items.filter((i) => (i.typ === 'urlaub' || i.typ === 'krank') && i.pid === c.ich.id).sort((a, b) => b.von.localeCompare(a.von));
    return `<div class="unterseite-kopf"><h2>Urlaub</h2></div>
      <div class="a-karte stempel"><div class="status"><i style="background:var(--firma)"></i>Resturlaub ${c.heute.slice(0, 4)}</div><div class="zeit">${k.rest}<span style="font-size:18px;color:#6b7280;font-family:var(--schrift);font-weight:400"> von ${k.anspruch} Tagen</span></div>
      <div class="ort">${k.genommen} genommen${k.beantragt ? ` · ${k.beantragt} beantragt` : ''}</div>
      <button class="gross-knopf firma" data-a="unter" data-id="urlaubsantrag">${Icon('plus')} Urlaub beantragen</button>
      ${c.R.p('urlaub').krank === 'ja' ? `<button class="gross-knopf hell" style="margin-top:10px" data-a="unter" data-id="krank">${Icon('krank')} Krank melden</button>` : ''}</div>
      <div class="a-titel">Meine Anträge</div><div class="a-karte">${eig.map((u) => zeile({ sym: u.typ === 'krank' ? 'krank' : 'kalender', titel: `${u.typ === 'krank' ? 'Krank' : esc(u.art || 'Urlaub')}: ${Datum.kurz(u.von)} – ${Datum.kurz(u.bis)}`, unter: `${Zahl.tage(Datum.werktageZwischen(u.von, u.bis), 'Arbeitstag')}${u.notiz ? ' · ' + esc(u.notiz) : ''}`, rechts: status(u.status) })).join('') || '<div class="leer">Noch keine Anträge.</div>'}</div>`;
  };

  BILD.mehr = (c) => {
    const doks = c.items.filter((i) => i.typ === 'dokument' && (i.fuer === c.ich.id || i.fuer === 'alle')).sort((a, b) => b.erstellt - a.erstellt);
    return `<div class="unterseite-kopf"><h2>Mehr</h2></div>
      <div class="a-karte">${zeile({ sym: 'person', symKlasse: 'firma', titel: esc(c.ich.name), unter: `${esc(c.ich.funktion || '')} · ${esc(c.cfg.name)}` })}</div>
      ${c.R.imApp('dokumente') ? `<div class="a-titel">Meine Dokumente</div><div class="a-karte">${doks.map((d) => zeile({ sym: 'dokument', titel: esc(d.titel), unter: d.gelesen ? 'gelesen' : '<b style="color:#c23a2b">neu</b>', a: 'dokument', id: d.id })).join('') || '<div class="leer">Noch keine Dokumente.</div>'}</div>` : ''}
      ${c.R.imApp('regie') ? (() => { const offen = c.typ('regie').filter((r) => r.pid === c.ich.id && r.status === 'offen'); return offen.length ? `<div class="a-titel">Noch nicht unterschrieben</div><div class="a-karte">${offen.map((r) => zeile({ sym: 'unterschrift', titel: esc(r.text), unter: `${Datum.kurz(r.datum)} · ${esc(c.bsName(r.bs))}`, a: 'regie-nach', id: r.id })).join('')}</div>` : ''; })() : ''}
      <div class="a-titel">Konto</div><div class="a-karte">${zeile({ sym: 'abmelden', titel: 'Abmelden', unter: 'Ein anderer Mitarbeiter meldet sich an', a: 'abmelden' })}${zeile({ sym: 'x', titel: 'Betrieb trennen', unter: 'Handy von diesem Betrieb lösen', a: 'trennen' })}</div>
      <p style="text-align:center;color:#9aa1ad;font-size:12px;margin-top:24px">${LOGO.replace('<svg', '<svg style="width:18px;height:18px;vertical-align:-4px;margin-right:6px"')}Richtwerk · Mitarbeiter-App 1.0</p>`;
  };

  BILD.freigaben = (c) => {
    const o = c.offen(); const darf = c.R.darfFreigeben(c.ich.rolle);
    let html = `<div class="unterseite-kopf"><h2>Freigaben</h2></div>`;
    if (!darf) html += `<div class="hinweis-box">Freigaben macht in diesem Betrieb nur der Chef.</div>`;
    if (o.urlaub.length) html += `<div class="a-titel">Urlaub</div><div class="a-karte">${o.urlaub.map((u) => `${zeile({ sym: 'kalender', titel: `${esc(c.person(u.pid).name)}: ${Datum.kurz(u.von)} – ${Datum.kurz(u.bis)}`, unter: `${Zahl.tage(Datum.werktageZwischen(u.von, u.bis))} · ${esc(u.art || 'Urlaub')}${u.notiz ? ' · ' + esc(u.notiz) : ''}` })}${darf ? `<div style="display:flex;gap:8px;padding:0 16px 14px"><button class="gross-knopf hell" style="padding:11px;font-size:15px" data-a="entscheide" data-id="${u.id}" data-wert="abgelehnt">Ablehnen</button><button class="gross-knopf firma" style="padding:11px;font-size:15px" data-a="entscheide" data-id="${u.id}" data-wert="genehmigt">Genehmigen</button></div>` : ''}`).join('')}</div>`;
    if (o.stunden.length) {
      const proPerson = {}; o.stunden.forEach((s) => { (proPerson[s.pid] = proPerson[s.pid] || []).push(s); });
      html += `<div class="a-titel">Stunden</div><div class="a-karte">${Object.entries(proPerson).map(([pid, l]) => zeile({ sym: 'uhr', titel: esc(c.person(pid).name), unter: `${l.length} Tage · ${Zahl.std(l.reduce((s, e) => s + stundenVon(e), 0))} Std.`, rechts: darf ? `<button class="a-status ok" style="border:0;padding:8px 12px;font-size:13px" data-a="stunden-frei" data-id="${pid}">Freigeben</button>` : '' })).join('')}</div>`;
    }
    const belege = o.belege.filter((b) => b.status === 'offen');
    if (belege.length) html += `<div class="a-titel">Belege über ${Zahl.eur(c.R.p('belege').grenze)}</div><div class="a-karte">${belege.map((b) => `${zeile({ sym: 'beleg', titel: `${Zahl.eur(b.betrag)} · ${esc(b.kategorie)}`, unter: `${esc(c.person(b.pid).name)} · ${esc(b.haendler || b.notiz || '')}` })}${darf ? `<div style="display:flex;gap:8px;padding:0 16px 14px"><button class="gross-knopf hell" style="padding:11px;font-size:15px" data-a="entscheide" data-id="${b.id}" data-wert="abgelehnt">Ablehnen</button><button class="gross-knopf firma" style="padding:11px;font-size:15px" data-a="entscheide" data-id="${b.id}" data-wert="freigegeben">Freigeben</button></div>` : ''}`).join('')}</div>`;
    if (o.material.length) html += `<div class="a-titel">Material</div><div class="a-karte">${o.material.map((m) => zeile({ sym: 'material', titel: esc(m.text), unter: `${esc(c.person(m.pid).name)} · ${esc(c.bsName(m.bs))}`, rechts: `<button class="a-status info" style="border:0;padding:8px 12px;font-size:13px" data-a="entscheide" data-id="${m.id}" data-wert="bestellt">Bestellt</button>` })).join('')}</div>`;
    if (!o.urlaub.length && !o.stunden.length && !belege.length && !o.material.length) html += `<div class="hinweis-box gruen">${Icon('haken')} Alles erledigt. Nichts wartet auf dich.</div>`;
    return html;
  };

  /* ---------- Unterseiten (Formulare) ---------- */
  const UNTER = {};

  UNTER.einstempeln = (c) => { const plan = c.geplant(c.ich.id, c.heute); return `${unterKopf('Arbeitsbeginn')}<p style="color:#6b7280;margin:-6px 4px 14px">Wo arbeitest du heute?</p>
    <div class="a-karte">${[...c.baustellenOffen()].sort((a, b) => (b.id === plan) - (a.id === plan)).map((b) => zeile({ sym: 'haus', symKlasse: b.id === plan ? 'firma' : '', titel: esc(b.name), unter: esc(b.ort) + (b.id === plan ? ' · laut Plan' : ''), a: 'einstempeln', id: b.id })).join('')}${zeile({ sym: 'start', titel: 'Ohne Baustelle', unter: 'Halle, Fahrt, Sonstiges', a: 'einstempeln', id: '' })}</div>`; };
  UNTER.wechsel = (c) => `${unterKopf('Baustelle wechseln')}<p style="color:#6b7280;margin:-6px 4px 14px">Die bisherige Zeit wird abgeschlossen, ab jetzt zählt die neue Baustelle.</p>
    <div class="a-karte">${c.baustellenOffen().map((b) => zeile({ sym: 'haus', titel: esc(b.name), unter: esc(b.ort), a: 'wechseln', id: b.id })).join('')}</div>`;

  UNTER.feierabend = (c) => {
    const d = zustand.daten;
    return `${unterKopf('Feierabend')}<div class="a-karte" style="padding:16px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="a-feld"><span>Beginn</span><input type="time" name="von" value="${esc(d.von)}"></label><label class="a-feld"><span>Ende</span><input type="time" name="bis" value="${esc(d.bis)}"></label></div>
      <label class="a-feld"><span>Pause (Minuten)</span><input type="number" name="pause" inputmode="numeric" value="${esc(d.pause)}"></label>
      ${c.R.mitBaustelle('stunden') ? bsAuswahl(c, d.bs) : ''}
      <label class="a-feld"><span>Was hast du gemacht?</span><input name="taetigkeit" placeholder="z. B. Sparren gesetzt" value="${esc(d.taetigkeit || '')}"></label>

  /* Verbindung: offline erfasste Einträge werden nachgeschickt */

  function html(c, { reiter = zustand.reiter, unter = zustand.unter } = {}) {

  /* =====================================================================
     Anmeldung
     ===================================================================== */
  function anmeldungBetrieb(fehler = '') {
    Wurzel().innerHTML = `<div class="ui-app"><div class="app-rahmen" style="padding:0"><div class="a-login"><div class="oben">
      <div class="marke">${LOGO}</div><h1>Mit deinem Betrieb verbinden</h1><p>Die Betriebskennung bekommst du von deinem Chef oder aus dem Büro.</p>
      <form id="f-betrieb"><label class="a-feld"><span>Betriebskennung</span><input name="kennung" autocapitalize="none" autocomplete="off" spellcheck="false" required></label>
      <div class="fehlertext">${esc(fehler)}</div><button class="gross-knopf" type="submit">Weiter</button></form></div>
      <a href="#" style="color:#9aa1ad;font-size:13px;text-align:center;text-decoration:none">Richtwerk · Bereich wählen</a></div></div></div>`;
    $('#f-betrieb').addEventListener('submit', async (e) => {
      e.preventDefault();
      const b = await findeBetrieb(new FormData(e.target).get('kennung'));
      if (!b) return anmeldungBetrieb('Diese Betriebskennung gibt es nicht.');
      koppeln({ fid: b.fid, name: b.cfg.name, kuerzel: b.cfg.kuerzel, farbe: b.cfg.farbe });
      anmeldungCode();
    });
  }

  function anmeldungCode() {
    const b = gekoppelt(); let code = '';
    const punkte = () => `<div class="pin-punkte" id="pin">${[0, 1, 2, 3].map((i) => `<i class="${i < code.length ? 'voll' : ''}"></i>`).join('')}</div>`;
    Wurzel().innerHTML = `<div class="ui-app" style="--firma:${esc(b.farbe)}"><div class="app-rahmen" style="padding:0"><div class="a-login"><div class="oben">
      <div class="firmenzeile"><span class="firmenzeichen">${esc(b.kuerzel || '')}</span><b>${esc(b.name)}</b><button data-a="anderer">Ändern</button></div>
      <h1 style="text-align:center">Zugangscode</h1><p style="text-align:center">Gib deinen persönlichen Code ein.</p>
      <div id="pin-huelle">${punkte()}</div>
      <div class="ziffernblock">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map((z) => `<button class="${z === '' ? 'leer' : ''}" data-z="${z}" ${z === '' ? 'disabled' : ''} aria-label="${z === '⌫' ? 'Löschen' : z}">${z}</button>`).join('')}</div>
      </div></div></div></div>`;
    const huelle = $('#pin-huelle');
    Wurzel().querySelector('.a-login').addEventListener('click', async (e) => {
      if (e.target.closest('[data-a="anderer"]')) { koppeln(null); return anmeldungBetrieb(); }
      const t = e.target.closest('[data-z]'); if (!t) return;
      const z = t.dataset.z;
      if (z === '⌫') code = code.slice(0, -1); else if (code.length < 4) code += z;
      huelle.innerHTML = punkte();
      if (code.length === 4) {
        const cfg = await Store.ladeCfg(b.fid);
        const p = cfg && cfg.personen.find((x) => x.code === code);
        if (!p) { $('#pin').classList.add('falsch'); setTimeout(() => { code = ''; huelle.innerHTML = punkte(); }, 450); return; }
        Sitzung.setze('app', { fid: b.fid, pid: p.id });
        zustand.reiter = 'start'; zustand.unter = null; start();
      }
    });
  }

  /* =====================================================================
     Ablauf
     ===================================================================== */
  function ctx() { return kontext(Store.cfg, Store.items, sitzung && sitzung.pid); }
  let uhrTimer = null;

  function start() {
    aktiverBereich = Handy;
    document.body.classList.add('app-modus');
    sitzung = Sitzung.lies('app');
    if (!sitzung) { aktiverBereich = null; return gekoppelt() ? anmeldungCode() : anmeldungBetrieb(); }
    Store.oeffne(sitzung.fid);
    Store.setzeBenutzer(sitzung.pid);
    zeichne(true);
    clearInterval(uhrTimer);
    uhrTimer = setInterval(() => {
      if (aktiverBereich !== Handy) return;
      const z = $('.stempel .zeit[data-seit]'); if (z) z.textContent = Zahl.hhmm((Date.now() - new Date(z.dataset.seit).getTime()) / 60000);
    }, 20000);
  }

  function zeichne(erzwingen = false) {
    if (aktiverBereich !== Handy) return;
    const c = ctx();
    if (!c.cfg) { Wurzel().innerHTML = `<div class="laden" style="background:#fff;color:#6b7280"><div>Wird geladen<div class="balken"><i></i></div></div></div>`; return; }
    if (!c.ich) { Sitzung.setze('app', null); aktiverBereich = null; return anmeldungCode(); }
    if (!erzwingen && zustand.unter && !['gesendet', 'dokument', 'eintrag'].includes(zustand.unter)) return; // Formular offen
    document.documentElement.style.setProperty('--firma', c.cfg.farbe);
    const scroll = window.scrollY;
    Wurzel().innerHTML = html(c);
    if (zustand.unter === 'dokument') dokumentLaden(c);
    if (zustand.unter === 'urlaubsantrag') urlaubstageZeigen();
    if (zustand.unter === 'regie') unterschriftVorbereiten();
    window.scrollTo(0, erzwingen ? 0 : scroll);
  }

  function geheZu(unter, daten = {}) { zustand.unter = unter; zustand.daten = daten; zeichne(true); }
  function werte() { const out = {}; $$('.a-inhalt [name]').forEach((el) => { out[el.name] = el.value; }); $$('.a-inhalt [data-wahl]').forEach((g) => { const an = $('.an', g); if (an) out[g.dataset.wahl] = an.dataset.id; }); return out; }
  function gesendet(titel, text, nochmal) { geheZu('gesendet', { titel, text, nochmal }); }

  function runde(min, schritt) { return Math.round(min / schritt) * schritt; }
  function jetztHHMM(rundung) { const d = new Date(); return Zahl.hhmm(runde(d.getHours() * 60 + d.getMinutes(), rundung)); }

  function dokumentLaden(c) {
    const d = c.items.find((i) => i.id === zustand.daten.id); if (!d) return;
    if (!d.gelesen) Store.aendere(d.id, { gelesen: true });
    bildFuer(d).then((url) => {
      const box = $('#dok-anzeige'); if (!box) return;
      box.innerHTML = url && url.startsWith('data:application/pdf')
        ? `<div style="padding:16px"><a class="gross-knopf firma" href="${url}" download="${esc(d.name || 'Dokument.pdf')}" style="text-decoration:none">${Icon('download')} PDF öffnen</a></div><iframe src="${url}" style="width:100%;height:60vh;border:0"></iframe>`

  function urlaubstageZeigen() {

  /* Unterschrift mit Finger oder Maus */
  let unterschriftLeer = true;
  function unterschriftVorbereiten() {
    const cv = $('#unterschrift'); if (!cv) return;
    const r = cv.getBoundingClientRect(); const f = Math.min(2, window.devicePixelRatio || 1);
    cv.width = r.width * f; cv.height = r.height * f;
    const g = cv.getContext('2d'); g.scale(f, f); g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#1d2a4a';
    unterschriftLeer = true; let zieht = false;
    const pos = (e) => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    cv.addEventListener('pointerdown', (e) => { zieht = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); g.beginPath(); g.moveTo(x, y); e.preventDefault(); });
    cv.addEventListener('pointermove', (e) => { if (!zieht) return; const [x, y] = pos(e); g.lineTo(x, y); g.stroke(); unterschriftLeer = false; cv.parentElement.classList.add('voll'); });
    const ende = () => { zieht = false; }; cv.addEventListener('pointerup', ende); cv.addEventListener('pointercancel', ende);
  }

    async 'speichere-tagebuch'(el, c) {

        neu = { typ: 'regie', pid: c.ich.id, datum: c.heute, bs: w.bs || '', text: w.text.trim(), leute: Math.max(1, Number(w.leute) || 1), stunden, material: (w.material || '').trim(), extra };

      Store.neu({ typ: 'stunden', pid: c.ich.id, datum: c.heute, von: jetzt, bis: '', pause: 0, bs: el.dataset.id, taetigkeit: '', quelle: 'stempeln', status: 'laeuft' });

      gesendet('Gespeichert', std > Number(c.R.p('stunden').maxTag) ? `${Zahl.std(std)} Stunden. Das ist ein langer Tag, das Büro sieht einen Hinweis.` : `${Zahl.std(std)} Stunden eingetragen.`, 'stunden');

      const extra = Zusatz.lesen($('.a-inhalt')); const fehlt = Zusatz.fehlt(c, 'material', extra); if (fehlt) return meldung(`Bitte „${fehlt}“ ausfüllen.`, 'fehler');
      Store.neu({ typ: 'material', pid: c.ich.id, datum: c.heute, bs: w.bs || '', text: w.text.trim(), extra, status: 'offen' });

  };

  return { start, neuZeichnen: () => zeichne(false), html, BILD };
