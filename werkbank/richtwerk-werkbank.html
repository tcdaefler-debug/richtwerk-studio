<title>Richtwerk Werkbank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0c1424">
<style>
/* =========================================================================
   Gestaltung
   Drei Bereiche mit eigener Optik:
   .ui-start  Richtwerk intern (Startseite, Anmeldungen)
   .ui-buero  Betriebszentrale im Büro (hell, sachlich, Firmenfarbe)
   .ui-app    Mitarbeiter-App am Handy (weiß, große Flächen, Scan-Stil)
   .ui-studio Entwickler-Tool (dunkel, Raster, Bausteine)
   ========================================================================= */
:root {
  --schrift: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --rw-navy: #0c1424;
  --rw-blau: #6f94ff;
  --rw-orange: #ff6b3d;
  --firma: #2f5e4e;
  --firma-hell: color-mix(in srgb, var(--firma) 10%, white);
  --ok: #2e7d4f; --ok-hell: #e3f1e8;
  --warn: #a8690c; --warn-hell: #fbf0dc;
  --bad: #b23b2a; --bad-hell: #f8e4e0;
  --info: #2f5f9e; --info-hell: #e4ecf7;
}
:root:not([data-theme="light"]) { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --dummy: 0; } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--schrift); font-size: 14px; line-height: 1.45; color: #1d2420; background: #eceee9; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

/* ---------- Meldung ---------- */
.meldung { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 999; background: #1d2420; color: #fff; padding: 10px 16px; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100vw - 32px); font-size: 14px; }
.meldung.fehler { background: var(--bad); }
.ui-app ~ .meldung, body.app-modus .meldung { bottom: 96px; }

/* ---------- Laden ---------- */
.laden { position: fixed; inset: 0; display: grid; place-items: center; background: var(--rw-navy); color: #c9d3e6; font-family: var(--mono); font-size: 13px; letter-spacing: .04em; }
.laden .balken { width: 160px; height: 2px; background: #1e2a40; margin-top: 14px; overflow: hidden; }
.laden .balken i { display: block; height: 100%; width: 40%; background: var(--rw-blau); animation: lauf 1.1s infinite ease-in-out; }
@keyframes lauf { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

/* =========================================================================
   Startseite + Anmeldung (Richtwerk intern)
   ========================================================================= */
.ui-start { min-height: 100%; background: #f4f3ef; color: #121a26; }
.start-kopf { display: flex; align-items: center; justify-content: space-between; padding: 18px 32px; border-bottom: 1px solid #dedbd3; background: #fbfaf7; }
.marke { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .01em; }
.marke svg { width: 28px; height: 28px; }
.marke small { font-weight: 400; color: #6b7280; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border-left: 1px solid #d5d2c9; padding-left: 10px; }
.start-kopf .stand { font-family: var(--mono); font-size: 11px; color: #7b8190; }
.start-inhalt { max-width: 980px; margin: 0 auto; padding: 56px 32px 40px; }
.start-inhalt h1 { font-size: 30px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 6px; }
.start-inhalt .unter { color: #5b6270; margin: 0 0 36px; max-width: 620px; }
.bereiche { border-top: 1px solid #d9d5cc; }
.bereich { display: grid; grid-template-columns: 64px 1fr auto; gap: 20px; align-items: center; padding: 24px 8px; border-bottom: 1px solid #d9d5cc; text-decoration: none; color: inherit; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; transition: background .15s; }
.bereich:hover { background: #ecebe5; }
.bereich .nr { font-family: var(--mono); font-size: 13px; color: #8a8f99; }
.bereich h2 { margin: 0 0 4px; font-size: 19px; font-weight: 600; }
.bereich p { margin: 0; color: #5b6270; font-size: 14px; }
.bereich .wer { font-family: var(--mono); font-size: 11px; color: #8a8f99; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.bereich .aktionen { display: flex; gap: 8px; align-items: center; }
.knopf-rand { border: 1px solid #c9c5bb; background: #fff; padding: 8px 14px; border-radius: 4px; font-size: 13px; color: #1d2430; text-decoration: none; white-space: nowrap; }
.knopf-rand:hover { border-color: #8a8f99; }
.knopf-voll { border: 0; background: #121a26; color: #fff; padding: 9px 16px; border-radius: 4px; font-size: 13px; text-decoration: none; white-space: nowrap; }
.start-fuss { max-width: 980px; margin: 0 auto; padding: 0 32px 40px; display: flex; gap: 32px; flex-wrap: wrap; color: #6b7280; font-size: 13px; }
.start-fuss b { color: #121a26; font-weight: 600; display: block; font-size: 12px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.start-fuss .datenmodus { font-family: var(--mono); font-size: 12px; }

/* Anmeldung Büro */
.anmeldung { min-height: 100vh; display: grid; grid-template-columns: minmax(320px, 44%) 1fr; }
.anmeldung .links { background: var(--rw-navy); color: #d5dcea; padding: 40px 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.anmeldung .links::after { content: ""; position: absolute; right: -120px; bottom: -120px; width: 420px; height: 420px; border: 1px solid #1f2b44; border-radius: 50%; box-shadow: 0 0 0 60px rgba(31,43,68,.25), 0 0 0 140px rgba(31,43,68,.15); }
.anmeldung .links h1 { color: #fff; font-size: 28px; font-weight: 600; margin: 0 0 10px; line-height: 1.2; }
.anmeldung .links p { margin: 0; max-width: 360px; color: #9aa7bf; }
.anmeldung .links .marke { color: #fff; }
.anmeldung .links .marke small { color: #7f8ba3; border-color: #2a3650; }
.anmeldung .links .fuss { font-family: var(--mono); font-size: 11px; color: #5f6b84; position: relative; z-index: 1; }
.anmeldung .rechts { display: grid; place-items: center; padding: 40px 24px; background: #fbfaf7; }
.formular { width: 100%; max-width: 360px; }
.formular h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
.formular .hinweis { color: #6b7280; margin: 0 0 28px; font-size: 14px; }
.feld { display: block; margin-bottom: 16px; }
.feld > span { display: block; font-size: 12px; font-weight: 600; color: #3b4250; margin-bottom: 6px; }
.feld input, .feld select, .feld textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbc8bf; border-radius: 4px; background: #fff; font-size: 15px; }
.feld input:focus, .feld select:focus, .feld textarea:focus { outline: 2px solid color-mix(in srgb, var(--rw-blau) 45%, transparent); border-color: var(--rw-blau); }
.feld input.code { font-family: var(--mono); letter-spacing: .4em; font-size: 18px; }
.fehlertext { color: var(--bad); font-size: 13px; min-height: 20px; margin: -4px 0 10px; }
.formular .knopf-voll { width: 100%; padding: 12px; font-size: 15px; }
.formular .zurueck { display: inline-flex; gap: 6px; align-items: center; margin-top: 22px; color: #6b7280; font-size: 13px; background: none; border: 0; padding: 0; }

/* =========================================================================
   Betriebszentrale (Büro)
   ========================================================================= */
.ui-buero { background: linear-gradient(to right, #f7f8f5 228px, #eef0ec 228px) !important; min-height: 100vh; display: grid; grid-template-rows: 52px 1fr; grid-template-columns: 228px 1fr; grid-template-areas: "kopf kopf" "nav inhalt"; background: #eef0ec; }
.b-kopf { grid-area: kopf; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: #fff; border-bottom: 1px solid #d9ddd6; position: sticky; top: 0; z-index: 20; }
.firmenzeichen { width: 30px; height: 30px; border-radius: 5px; background: var(--firma); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: .02em; flex: none; }
.b-kopf .firma { font-weight: 600; font-size: 15px; white-space: nowrap; }
.b-kopf .firma small { display: block; font-weight: 400; font-size: 11px; color: #6c746e; margin-top: -2px; }
.b-kopf .luecke { flex: 1; }
.b-kopf .wer { text-align: right; font-size: 13px; line-height: 1.2; }
.b-kopf .wer small { display: block; color: #6c746e; font-size: 11px; }
.b-kopf .rund { width: 32px; height: 32px; border-radius: 50%; background: #e3e7e1; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #2a332e; }
.b-kopf .flach { background: none; border: 1px solid transparent; padding: 6px 8px; border-radius: 4px; color: #4a524c; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.b-kopf .flach:hover { border-color: #d9ddd6; background: #f5f6f3; }
.b-kopf .menueknopf { display: none; }
.b-nav { grid-area: nav; background: #f7f8f5; border-right: 1px solid #d9ddd6; padding: 14px 10px; position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; }
.b-nav .gruppe { font-size: 11px; font-weight: 600; color: #858c86; text-transform: uppercase; letter-spacing: .07em; padding: 14px 10px 6px; }
.b-nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 4px; text-align: left; color: #2f3832; font-size: 14px; }
.b-nav button:hover { background: #eaede7; }
.b-nav button.aktiv { background: #fff; color: var(--firma); font-weight: 600; box-shadow: inset 3px 0 0 var(--firma), 0 0 0 1px #dde1da; }
.b-nav button .zahl { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--firma); color: #fff; border-radius: 9px; padding: 1px 7px; }
.b-nav .unten { margin-top: 24px; border-top: 1px solid #e0e3dd; padding-top: 12px; font-size: 12px; color: #858c86; padding-left: 10px; }
.b-inhalt { grid-area: inhalt; padding: 24px 28px 60px; min-width: 0; }
.seitenkopf { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.seitenkopf h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.005em; }
.seitenkopf p { margin: 2px 0 0; color: #66706a; }
.seitenkopf .rechts { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.k { border: 1px solid #c8cdc5; background: #fff; padding: 7px 12px; border-radius: 4px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; color: #27302a; white-space: nowrap; }
.k:hover { border-color: #9aa29c; }
.k.haupt { background: var(--firma); border-color: var(--firma); color: #fff; }
.k.haupt:hover { filter: brightness(1.08); }
.k.ok { color: var(--ok); }
.k.nein { color: var(--bad); }
.k.klein { padding: 4px 8px; font-size: 12px; }
.k:disabled { opacity: .45; cursor: default; }
.kacheln { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.kachel { background: #fff; border: 1px solid #dadfd7; border-radius: 6px; padding: 14px 16px; text-align: left; }
button.kachel:hover { border-color: #aab2ab; }
.kachel .titel { font-size: 12px; color: #66706a; font-weight: 500; }
.kachel .wert { font-size: 26px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kachel .wert small { font-size: 14px; color: #7d857f; font-weight: 400; }
.kachel .fuss { font-size: 12px; color: #66706a; margin-top: 2px; }
.kachel.achtung { border-color: color-mix(in srgb, var(--warn) 45%, #dadfd7); background: linear-gradient(#fff, #fff) padding-box; box-shadow: inset 3px 0 0 var(--warn); }
.zwei { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.karte { background: #fff; border: 1px solid #dadfd7; border-radius: 6px; margin-bottom: 16px; min-width: 0; }
.karte > .kopf { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #e6e9e3; }
.karte > .kopf h3 { margin: 0; font-size: 14px; font-weight: 600; }
.karte > .kopf .rechts { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.karte > .koerper { padding: 14px 16px; }
.karte > .leer, .leer { padding: 28px 16px; color: #7a827c; text-align: center; font-size: 13px; }
.tabelle-huelle { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; font-weight: 600; color: #5f6862; font-size: 12px; padding: 9px 12px; border-bottom: 1px solid #e1e5de; background: #fafbf9; white-space: nowrap; }
.t td { padding: 9px 12px; border-bottom: 1px solid #eef0ec; vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tr.klickbar { cursor: pointer; }
.t tr.klickbar:hover td { background: #f7f9f6; }
.t .r { text-align: right; }
.t .zelle-std { text-align: center; font-variant-numeric: tabular-nums; cursor: pointer; border-left: 1px solid #f0f2ee; }
.t .zelle-std:hover { background: #f1f5f2; }
.t .zelle-std.offen { color: var(--warn); font-weight: 600; }
.t .zelle-std.laeuft { color: var(--info); }
.t .zelle-std.abw { color: #8a7a52; font-size: 11px; }
.t .zelle-std.leer { color: #c3c8c2; }
.t tfoot td { font-weight: 600; background: #fafbf9; border-top: 1px solid #e1e5de; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; background: #eef0ec; color: #535c56; }
.chip.ok { background: var(--ok-hell); color: var(--ok); }
.chip.warn { background: var(--warn-hell); color: var(--warn); }
.chip.bad { background: var(--bad-hell); color: var(--bad); }
.chip.info { background: var(--info-hell); color: var(--info); }
.person { display: flex; align-items: center; gap: 10px; }
.person .ava { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--firma-hell); color: var(--firma); flex: none; }
.person small { display: block; color: #7a827c; font-size: 11px; }
.liste-zeile { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #eef0ec; }
.liste-zeile:last-child { border-bottom: 0; }
.liste-zeile .text { flex: 1; min-width: 0; }
.liste-zeile .text small { display: block; color: #7a827c; }
.liste-zeile .aktionen { display: flex; gap: 6px; }
.daumen { width: 46px; height: 58px; border-radius: 3px; object-fit: cover; border: 1px solid #dadfd7; background: #f0f0ec; flex: none; }
.raster-belege { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; padding: 14px; }
.beleg-karte { border: 1px solid #dadfd7; border-radius: 6px; overflow: hidden; background: #fff; text-align: left; padding: 0; }
.beleg-karte:hover { border-color: #9aa29c; }
.beleg-karte img { width: 100%; height: 150px; object-fit: cover; object-position: top; display: block; background: #ecebe6; border-bottom: 1px solid #eee; }
.beleg-karte .angaben { padding: 10px 12px; }
.beleg-karte .angaben b { display: block; font-size: 15px; }
.beleg-karte .angaben small { color: #6d756f; display: block; }
.filterleiste { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filterleiste select, .filterleiste input { padding: 6px 10px; border: 1px solid #c8cdc5; border-radius: 4px; background: #fff; font-size: 13px; }
.segment { display: inline-flex; border: 1px solid #c8cdc5; border-radius: 4px; overflow: hidden; background: #fff; }
.segment button { border: 0; background: none; padding: 6px 12px; font-size: 13px; color: #4a534d; }
.segment button + button { border-left: 1px solid #c8cdc5; }
.segment button.an { background: #27302a; color: #fff; }
.wochenwahl { display: inline-flex; align-items: center; gap: 4px; }
.wochenwahl b { min-width: 170px; text-align: center; font-weight: 600; font-size: 13px; }
.balken-urlaub { height: 6px; background: #e8ebe5; border-radius: 3px; overflow: hidden; min-width: 80px; }
.balken-urlaub i { display: block; height: 100%; background: var(--firma); }
.kalender-urlaub { display: grid; font-size: 11px; }
.kalender-urlaub .zk { height: 26px; border-right: 1px solid #f0f2ee; border-bottom: 1px solid #eef0ec; display: grid; place-items: center; color: #9aa19b; }
.kalender-urlaub .zk.we { background: #f6f7f4; }
.kalender-urlaub .zk.u { background: color-mix(in srgb, var(--firma) 70%, white); color: #fff; }
.kalender-urlaub .zk.ub { background: repeating-linear-gradient(135deg, var(--warn-hell), var(--warn-hell) 4px, #f3dfb5 4px, #f3dfb5 8px); color: var(--warn); }
.kalender-urlaub .zk.k { background: #e9d6d2; color: var(--bad); }
.kalender-urlaub .zk.heute { box-shadow: inset 0 0 0 2px #27302a; }
.kalender-urlaub .name { padding: 0 10px; display: flex; align-items: center; height: 26px; border-bottom: 1px solid #eef0ec; font-size: 12px; white-space: nowrap; position: sticky; left: 0; background: #fff; z-index: 1; }
.kalender-urlaub .kopfz { font-weight: 600; color: #5f6862; background: #fafbf9; }
.legende { display: flex; gap: 14px; font-size: 12px; color: #66706a; padding: 10px 16px; border-top: 1px solid #eef0ec; flex-wrap: wrap; }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.ablage { border: 1.5px dashed #b9c0b8; border-radius: 6px; padding: 22px; text-align: center; color: #5f6862; background: #fafbf9; }
.ablage.drueber { border-color: var(--firma); background: var(--firma-hell); }
.pruefliste { list-style: none; margin: 0; padding: 0; }
.pruefliste li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-bottom: 1px solid #eef0ec; }
.pruefliste li:last-child { border-bottom: 0; }
.pruefliste .marke-p { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 1px; }
.pruefliste .marke-p.ok { background: var(--ok-hell); color: var(--ok); }
.pruefliste .marke-p.warn { background: var(--warn-hell); color: var(--warn); }
.pruefliste .marke-p .ic { width: 14px; height: 14px; stroke-width: 2.4; }
.pruefliste small { display: block; color: #6d756f; }
.einstellungen-raster { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.farbwahl { display: flex; gap: 8px; flex-wrap: wrap; }
.farbwahl button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #c8cdc5; }
.farbwahl button.an { box-shadow: 0 0 0 2px #27302a; }

/* Fenster (Dialog) */
.fenster-hg { position: fixed; inset: 0; background: rgba(20, 26, 22, .42); z-index: 100; display: grid; place-items: center; padding: 16px; animation: einblenden .12s ease-out; }
@keyframes einblenden { from { opacity: 0; } }
.fenster { background: #fff; border-radius: 8px; width: 100%; max-width: 520px; max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.fenster.breit { max-width: 860px; }
.fenster > .kopf { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid #e6e9e3; position: sticky; top: 0; background: #fff; z-index: 1; }
.fenster > .kopf h3 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
.fenster > .kopf button { border: 0; background: none; padding: 4px; color: #66706a; }
.fenster > .koerper { padding: 18px; }
.fenster > .fuss { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid #e6e9e3; background: #fafbf9; flex-wrap: wrap; }
.fenster .feld input, .fenster .feld select, .fenster .feld textarea { font-size: 14px; padding: 8px 10px; }
.reihe { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0 12px; }
.vorschau-bild { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; }
.vorschau-bild img { width: 100%; border-radius: 4px; border: 1px solid #dadfd7; background: #ecebe6; }
.vorschau-bild iframe { width: 100%; height: 420px; border: 1px solid #dadfd7; }
dl.daten { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
dl.daten dt { color: #6d756f; }
dl.daten dd { margin: 0; font-weight: 500; }

/* Kompakte Büro-Ansicht (Handy) */
.ui-buero.kompakt { background: #eef0ec !important; grid-template-columns: 1fr; grid-template-areas: "kopf" "inhalt"; }
.ui-buero.kompakt .b-nav { position: fixed; top: 52px; left: 0; bottom: 0; width: 260px; z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: 8px 0 30px rgba(0,0,0,.12); height: auto; }
.ui-buero.kompakt.nav-offen .b-nav { transform: none; }
.ui-buero.kompakt .b-kopf .menueknopf { display: inline-flex; }
.ui-buero.kompakt .b-kopf .wer, .ui-buero.kompakt .b-kopf .firma small, .ui-buero.kompakt .b-kopf .nur-breit { display: none; }
.ui-buero.kompakt .b-inhalt { padding: 16px 14px 60px; }
.ui-buero.kompakt .kacheln { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ui-buero.kompakt .zwei, .ui-buero.kompakt .einstellungen-raster, .ui-buero.kompakt .vorschau-bild { grid-template-columns: minmax(0, 1fr); }
.ui-buero.kompakt .seitenkopf .rechts { margin-left: 0; }
.ui-buero.kompakt .seitenkopf h1 { font-size: 19px; }
.ui-buero.kompakt .t th, .ui-buero.kompakt .t td { padding: 8px 8px; }

/* =========================================================================
   Mitarbeiter-App (Handy)
   ========================================================================= */
.ui-app { min-height: 100vh; background: #f3f4f6; color: #15191e; display: flex; justify-content: center; }
.app-rahmen { width: 100%; max-width: 480px; min-height: 100vh; background: #f3f4f6; position: relative; display: flex; flex-direction: column; padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
@media (min-width: 560px) { .app-rahmen { border-left: 1px solid #e1e3e7; border-right: 1px solid #e1e3e7; } }
.a-kopf { padding: calc(14px + env(safe-area-inset-top)) 18px 12px; background: #fff; border-bottom: 1px solid #e6e8ec; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
.a-kopf .firmenzeichen { width: 34px; height: 34px; border-radius: 8px; font-size: 13px; }
.a-kopf .titel { flex: 1; min-width: 0; }
.a-kopf .titel b { display: block; font-size: 16px; font-weight: 600; }
.a-kopf .titel small { color: #6b7280; font-size: 12px; }
.a-kopf .rund-knopf { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #e3e5ea; background: #fff; display: grid; place-items: center; color: #3a404a; }
.a-inhalt { padding: 16px; flex: 1; }
.a-titel { font-size: 13px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .06em; margin: 22px 4px 8px; }
.a-titel:first-child { margin-top: 4px; }
.a-karte { background: #fff; border-radius: 14px; border: 1px solid #e6e8ec; overflow: hidden; }
.a-karte + .a-karte { margin-top: 12px; }
.stempel { padding: 20px; }
.stempel .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6b7280; }
.stempel .status i { width: 8px; height: 8px; border-radius: 50%; background: #c3c7cf; }
.stempel .status.laeuft i { background: #22a06b; box-shadow: 0 0 0 4px #d7f2e5; }
.stempel .zeit { font-size: 46px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin: 8px 0 2px; font-family: var(--mono); }
.stempel .ort { color: #3a404a; font-size: 14px; margin-bottom: 16px; }
.gross-knopf { width: 100%; border: 0; border-radius: 12px; padding: 16px; font-size: 17px; font-weight: 600; background: #15191e; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
.gross-knopf.firma { background: var(--firma); }
.gross-knopf.hell { background: #eef0f3; color: #15191e; }
.gross-knopf.rot { background: #c23a2b; }
.gross-knopf .ic { width: 22px; height: 22px; }
.gross-knopf:disabled { opacity: .5; }
.a-zeile { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #f0f1f4; background: #fff; width: 100%; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.a-zeile:last-child { border-bottom: 0; }
.a-zeile .sym { width: 38px; height: 38px; border-radius: 10px; background: #f0f2f5; display: grid; place-items: center; color: #3a404a; flex: none; }
.a-zeile .sym.firma { background: var(--firma-hell); color: var(--firma); }
.a-zeile .text { flex: 1; min-width: 0; }
.a-zeile .text b { display: block; font-weight: 600; font-size: 15px; }
.a-zeile .text small { display: block; color: #6b7280; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-zeile .rechts { text-align: right; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.a-zeile .rechts small { display: block; font-weight: 400; }
.a-zeile .pfeil { color: #b3b8c2; }
.erfassen-raster { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.erfassen-kachel { background: #fff; border: 1px solid #e6e8ec; border-radius: 14px; padding: 18px 16px; text-align: left; display: flex; flex-direction: column; gap: 12px; min-height: 126px; }
.erfassen-kachel .sym { width: 44px; height: 44px; border-radius: 12px; background: var(--firma-hell); color: var(--firma); display: grid; place-items: center; }
.erfassen-kachel .sym .ic { width: 24px; height: 24px; }
.erfassen-kachel b { font-size: 15px; font-weight: 600; }
.erfassen-kachel small { color: #6b7280; font-size: 12px; display: block; margin-top: 2px; font-weight: 400; }
.erfassen-kachel.gross { grid-column: span 2; flex-direction: row; align-items: center; min-height: 0; background: var(--firma); color: #fff; border: 0; }
.erfassen-kachel.gross .sym { background: rgba(255,255,255,.16); color: #fff; }
.erfassen-kachel.gross small { color: rgba(255,255,255,.75); }
.a-tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #fff; border-top: 1px solid #e3e5ea; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 20; }
.a-tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #7a808c; padding: 6px 0; }
.a-tabs button.an { color: var(--firma); font-weight: 600; }
.a-tabs button .ic { width: 22px; height: 22px; }
.a-tabs .scan { position: relative; }
.a-tabs .scan span.kreis { width: 54px; height: 54px; border-radius: 50%; background: var(--firma); color: #fff; display: grid; place-items: center; margin-top: -24px; box-shadow: 0 6px 16px color-mix(in srgb, var(--firma) 40%, transparent); border: 4px solid #fff; }
.a-tabs .scan span.kreis .ic { width: 24px; height: 24px; }
.a-tabs .zahl { position: absolute; top: 2px; right: calc(50% - 20px); background: #c23a2b; color: #fff; font-size: 10px; border-radius: 8px; padding: 0 5px; font-weight: 700; }
.a-tabs button { position: relative; }
.a-feld { display: block; margin-bottom: 14px; }
.a-feld > span { display: block; font-size: 13px; color: #4b5260; margin-bottom: 6px; font-weight: 500; }
.a-feld input, .a-feld select, .a-feld textarea { width: 100%; border: 1px solid #dfe2e7; background: #fff; border-radius: 10px; padding: 13px 14px; font-size: 16px; }
.a-feld textarea { min-height: 80px; resize: vertical; }
.a-feld .betrag { font-size: 28px; font-weight: 600; font-family: var(--mono); }
.a-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.a-chips button { border: 1px solid #dfe2e7; background: #fff; border-radius: 20px; padding: 9px 14px; font-size: 14px; }
.a-chips button.an { background: #15191e; color: #fff; border-color: #15191e; }
.scan-flaeche { background: #1b1f24; border-radius: 14px; aspect-ratio: 3 / 4; position: relative; overflow: hidden; display: grid; place-items: center; color: #9aa1ad; }
.scan-flaeche img { width: 100%; height: 100%; object-fit: contain; background: #2a2f36; }
.scan-flaeche .ecken { position: absolute; inset: 22px; pointer-events: none; }
.scan-flaeche .ecken i { position: absolute; width: 28px; height: 28px; border-color: #fff; border-style: solid; border-width: 0; opacity: .9; }
.scan-flaeche .ecken i:nth-child(1) { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 6px; }
.scan-flaeche .ecken i:nth-child(2) { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 6px; }
.scan-flaeche .ecken i:nth-child(3) { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 6px; }
.scan-flaeche .ecken i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 6px; }
.scan-flaeche .leerhinweis { text-align: center; padding: 20px; }
.scan-flaeche .leerhinweis .ic { width: 48px; height: 48px; stroke-width: 1.2; color: #fff; margin-bottom: 10px; }
.scan-werkzeuge { display: flex; gap: 8px; margin: 12px 0 16px; }
.scan-werkzeuge button { flex: 1; border: 1px solid #dfe2e7; background: #fff; border-radius: 10px; padding: 10px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.scan-werkzeuge button.an { border-color: #15191e; background: #15191e; color: #fff; }
.unterseite-kopf { display: flex; align-items: center; gap: 8px; margin: -4px 0 14px; }
.unterseite-kopf button { border: 0; background: none; padding: 6px; margin-left: -6px; display: flex; align-items: center; color: #15191e; }
.unterseite-kopf h2 { margin: 0; font-size: 20px; font-weight: 600; }
.woche-balken { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 16px; align-items: end; height: 130px; }
.woche-balken div { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; font-size: 11px; color: #6b7280; }
.woche-balken i { width: 100%; max-width: 34px; border-radius: 6px 6px 3px 3px; background: var(--firma); min-height: 3px; }
.woche-balken i.offen { background: color-mix(in srgb, var(--firma) 45%, white); }
.woche-balken i.heute { background: #c3c7cf; }
.summe-zeile { display: flex; justify-content: space-between; padding: 12px 16px; border-top: 1px solid #f0f1f4; font-size: 14px; }
.hinweis-box { background: #fff7e6; border: 1px solid #f1dfb7; color: #6c4d0c; border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; display: flex; gap: 10px; }
.hinweis-box.gruen { background: #e8f6ee; border-color: #c4e6d2; color: #1f5f3c; }
.a-status { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px; background: #eef0f3; color: #4b5260; white-space: nowrap; }
.a-status.ok { background: #e3f4ea; color: #1f7a4a; }
.a-status.warn { background: #fdf1dc; color: #9a6206; }
.a-status.bad { background: #fbe5e2; color: #ad3424; }
.a-status.info { background: #e4ecf8; color: #2e5b9c; }

/* App-Anmeldung */
.a-login { min-height: 100vh; display: flex; flex-direction: column; padding: calc(40px + env(safe-area-inset-top)) 24px 32px; background: #fff; }
.a-login .oben { flex: 1; }
.a-login h1 { font-size: 26px; font-weight: 600; margin: 28px 0 6px; letter-spacing: -.01em; }
.a-login p { color: #6b7280; margin: 0 0 26px; }
.a-login .marke svg { width: 36px; height: 36px; }
.pin-punkte { display: flex; gap: 16px; justify-content: center; margin: 26px 0 8px; }
.pin-punkte i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #15191e; }
.pin-punkte i.voll { background: #15191e; }
.pin-punkte.falsch { animation: wackeln .35s; }
.pin-punkte.falsch i { border-color: #c23a2b; }
@keyframes wackeln { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
.ziffernblock { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 300px; margin: 20px auto 0; }
.ziffernblock button { height: 64px; border-radius: 50%; border: 0; background: #f1f3f5; font-size: 24px; font-weight: 500; aspect-ratio: 1; justify-self: center; width: 64px; }
.ziffernblock button:active { background: #dfe3e8; }
.ziffernblock button.leer { background: none; }
.a-login .firmenzeile { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #e6e8ec; border-radius: 12px; }
.a-login .firmenzeile button { margin-left: auto; border: 0; background: none; color: #6b7280; font-size: 13px; }

/* =========================================================================
   Entwickler-Tool (Studio)
   ========================================================================= */
.ui-studio { height: 100vh; display: grid; grid-template-rows: 48px 1fr; grid-template-columns: 220px 1fr 340px; grid-template-areas: "kopf kopf kopf" "seite flaeche pruef"; background: #0f1218; color: #dfe3ea; font-size: 13px; overflow: hidden; }
.s-kopf { grid-area: kopf; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid #222833; background: #12161d; }
.s-kopf .marke { color: #fff; font-size: 14px; }
.s-kopf .marke small { color: #6f7a8d; border-color: #2a3140; }
.s-kopf .reiter { display: flex; gap: 2px; margin-left: 20px; }
.s-kopf .reiter button { background: none; border: 0; color: #8a95a8; padding: 14px 12px; font-size: 13px; border-bottom: 2px solid transparent; }
.s-kopf .reiter button.an { color: #fff; border-bottom-color: var(--rw-orange); }
.s-kopf .luecke { flex: 1; }
.s-kopf .sk { background: #1b212b; border: 1px solid #2a3140; color: #cfd5df; padding: 6px 10px; border-radius: 4px; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.s-kopf .sk:hover { border-color: #3d4658; }
.s-kopf .sk.orange { background: var(--rw-orange); border-color: var(--rw-orange); color: #1a0d07; font-weight: 600; }
.s-kopf .speicherstand { font-family: var(--mono); font-size: 11px; color: #6f7a8d; }
.s-seite { grid-area: seite; border-right: 1px solid #222833; background: #12161d; overflow-y: auto; display: flex; flex-direction: column; }
.s-abschnitt { padding: 14px 12px 6px; font-family: var(--mono); font-size: 10.5px; color: #6f7a8d; text-transform: uppercase; letter-spacing: .1em; }
.s-betrieb { display: flex; align-items: center; gap: 10px; margin: 2px 8px; padding: 8px; border-radius: 5px; background: none; border: 1px solid transparent; color: #cfd5df; text-align: left; }
.s-betrieb:hover { background: #181d26; }
.s-betrieb.an { background: #1b212b; border-color: #2a3140; color: #fff; }
.s-betrieb .firmenzeichen { width: 26px; height: 26px; font-size: 10px; border-radius: 4px; }
.s-betrieb small { display: block; color: #6f7a8d; font-size: 11px; font-family: var(--mono); }
.palette { padding: 0 8px 16px; }
.palette .pgruppe { font-size: 11px; color: #8a95a8; margin: 12px 4px 6px; display: flex; align-items: center; gap: 6px; }
.palette .pgruppe i { width: 8px; height: 8px; border-radius: 2px; }
.p-baustein { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; margin-bottom: 4px; border-radius: 4px; background: #181d26; border: 1px solid #252c38; color: #dfe3ea; cursor: grab; font-size: 12.5px; text-align: left; border-left: 3px solid var(--g); }
.p-baustein:hover { border-color: #39424f; border-left-color: var(--g); }
.p-baustein.benutzt { opacity: .38; cursor: default; }
.p-baustein .ic { width: 15px; height: 15px; color: var(--g); }
.s-flaeche { grid-area: flaeche; position: relative; overflow: hidden; background-color: #0f1218; background-image: radial-gradient(#252b36 1px, transparent 1px); background-size: 22px 22px; cursor: grab; touch-action: none; }
.s-flaeche.zieht { cursor: grabbing; }
.s-welt { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.s-welt svg.kanten { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.s-welt svg.kanten path { fill: none; stroke: #4a5568; stroke-width: 2; }
.s-welt svg.kanten path.aktiv { stroke: var(--rw-orange); stroke-width: 2.5; }
.s-welt svg.kanten path.vorlaeufig { stroke: var(--rw-blau); stroke-dasharray: 5 4; }
.s-welt svg.kanten path.treffer { pointer-events: stroke; stroke-width: 14; stroke: transparent; cursor: pointer; }
.s-welt svg.kanten path.treffer:hover + path { stroke: #c9524a; }
.knoten { position: absolute; width: 200px; background: #1a1f28; border: 1px solid #2c3441; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.35); user-select: none; cursor: move; }
.knoten::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 6px 0 0 6px; background: var(--g); }
.knoten .k-kopf { white-space: nowrap; overflow: hidden; display: flex; align-items: center; gap: 8px; padding: 9px 12px 2px 14px; font-weight: 600; color: #fff; font-size: 13px; }
.knoten .k-kopf .ic { width: 16px; height: 16px; color: var(--g); }
.knoten .k-info { padding: 0 12px 10px 38px; color: #8a95a8; font-size: 11px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.knoten.an { border-color: var(--rw-orange); box-shadow: 0 0 0 1px var(--rw-orange), 0 8px 24px rgba(0,0,0,.45); }
.knoten.geplant { border-style: dashed; opacity: .75; }
.knoten .port { position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: #0f1218; border: 2px solid #5a6475; cursor: crosshair; }
.knoten .port:hover, .knoten .port.ziel { border-color: var(--rw-orange); background: var(--rw-orange); }
.knoten .port.ein { left: -8px; }
.knoten .port.aus { right: -8px; }
.knoten .port.kann { border-color: var(--rw-blau); box-shadow: 0 0 0 4px rgba(111,148,255,.25); }
.s-werkzeug { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; z-index: 5; }
.s-werkzeug button, .s-werkzeug span { background: #1a1f28; border: 1px solid #2c3441; color: #cfd5df; padding: 6px 10px; border-radius: 4px; font-size: 12px; font-family: var(--mono); }
.s-tipp { position: absolute; right: 12px; bottom: 12px; color: #5f6a7d; font-size: 11px; font-family: var(--mono); z-index: 5; text-align: right; line-height: 1.6; }
.s-pruef { grid-area: pruef; border-left: 1px solid #222833; background: #12161d; overflow-y: auto; display: flex; flex-direction: column; }
.s-pruef .block { padding: 14px 16px; border-bottom: 1px solid #1f2530; }
.s-pruef h3 { margin: 0 0 2px; font-size: 15px; color: #fff; display: flex; gap: 8px; align-items: center; }
.s-pruef h3 .ic { color: var(--g); }
.s-pruef .klein { color: #8a95a8; font-size: 12px; }
.s-pruef .problem { margin-top: 10px; padding: 10px 12px; background: #171c24; border-left: 2px solid #3d4658; color: #aeb7c5; font-size: 12px; border-radius: 0 4px 4px 0; }
.s-pruef .problem b { display: block; font-family: var(--mono); font-size: 10px; color: #6f7a8d; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 3px; font-weight: 500; }
.s-titel { font-family: var(--mono); font-size: 10.5px; color: #6f7a8d; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
.s-param { display: grid; grid-template-columns: 1fr 150px; gap: 8px; align-items: center; margin-bottom: 8px; }
.s-param label { color: #cfd5df; font-size: 12.5px; }
.s-param .wert { display: flex; align-items: center; background: #0f1218; border: 1px solid #2c3441; border-radius: 4px; }
.s-param .wert input, .s-param .wert select { width: 100%; background: none; border: 0; color: #fff; padding: 6px 8px; font-family: var(--mono); font-size: 13px; min-width: 0; }
.s-param .wert select option { background: #1a1f28; }
.s-param .wert em { font-style: normal; color: #6f7a8d; font-size: 10.5px; padding-right: 8px; white-space: nowrap; font-family: var(--mono); }
.s-param.text { grid-template-columns: 1fr; }
.s-param.text .wert input { font-family: var(--schrift); }
.s-param .wert:focus-within { border-color: var(--rw-blau); }
.wirkung { list-style: none; margin: 0; padding: 0; }
.wirkung li { position: relative; padding: 4px 0 4px 16px; color: #cfd5df; font-size: 12.5px; }
.wirkung li::before { content: ""; position: absolute; left: 2px; top: 11px; width: 6px; height: 6px; border-radius: 1px; background: var(--rw-orange); }
.s-vorschau { padding: 14px 16px 20px; }
.vorschau-rahmen { border: 1px solid #2c3441; border-radius: 6px; overflow: hidden; background: #fff; }
.vorschau-rahmen .vr-kopf { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: #1a1f28; color: #8a95a8; font-family: var(--mono); font-size: 10.5px; border-bottom: 1px solid #2c3441; }

<script>
"use strict";
/* ---- hilfen.js ---- */
/* =========================================================================
   Kleine Hilfsfunktionen: HTML, Datum, Zahlen, Bilder
   ========================================================================= */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, wurzel = document) => wurzel.querySelector(sel);
const $$ = (sel, wurzel = document) => [...wurzel.querySelectorAll(sel)];

const Datum = {
  heute() { return Datum.iso(new Date()); },
  iso(d) { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; },
  von(iso) { const [j, m, t] = iso.split('-').map(Number); return new Date(j, m - 1, t, 12); },
  plus(iso, tage) { const d = Datum.von(iso); d.setDate(d.getDate() + tage); return Datum.iso(d); },
  montag(iso) { const d = Datum.von(iso); const wt = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wt); return Datum.iso(d); },
  wochentag(iso) { return (Datum.von(iso).getDay() + 6) % 7; }, // 0 = Montag
  istWerktag(iso) { return Datum.wochentag(iso) < 5; },
  kw(iso) {
    const d = Datum.von(iso); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    const w1 = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
  },
  kurz(iso) { const d = Datum.von(iso); return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.`; },
  lang(iso) { return Datum.von(iso).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }); },
  mittel(iso) { return Datum.von(iso).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' }); },
  monatName(ym) { const [j, m] = ym.split('-').map(Number); return new Date(j, m - 1, 1).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }); },
  WT: ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'],
  /* Gesetzliche Feiertage Niedersachsen */
  feiertag(iso) {
    const j = Number(iso.slice(0, 4));
    if (!Datum._ft || Datum._ft.jahr !== j) {
      const a = j % 19, b = Math.floor(j / 100), c = j % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
      const ostern = Datum.iso(new Date(j, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1, 12));
      const t = { [`${j}-01-01`]: 'Neujahr', [`${j}-05-01`]: 'Tag der Arbeit', [`${j}-10-03`]: 'Tag der Deutschen Einheit', [`${j}-10-31`]: 'Reformationstag', [`${j}-12-25`]: '1. Weihnachtstag', [`${j}-12-26`]: '2. Weihnachtstag' };
      t[Datum.plus(ostern, -2)] = 'Karfreitag'; t[Datum.plus(ostern, 1)] = 'Ostermontag'; t[Datum.plus(ostern, 39)] = 'Christi Himmelfahrt'; t[Datum.plus(ostern, 50)] = 'Pfingstmontag';
      Datum._ft = { jahr: j, t };
    }
    return Datum._ft.t[iso] || null;
  },
  istArbeitstag(iso) { return Datum.istWerktag(iso) && !Datum.feiertag(iso); },
  werktageZwischen(von, bis) {
    let n = 0; for (let d = von; d <= bis; d = Datum.plus(d, 1)) if (Datum.istArbeitstag(d)) n++;
    return n;
  },
  uhr(ms) { const d = new Date(ms); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; },
};

const Zahl = {
  std(h) { return (Math.round(h * 100) / 100).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
  eur(b) { return Number(b || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' }); },
  tage(n, wort = 'Tag') { return `${n} ${wort}${n === 1 ? '' : 'e'}`; },
  min(hhmm) { const [h, m] = String(hhmm || '0:0').split(':').map(Number); return h * 60 + (m || 0); },
  hhmm(min) { const m = Math.max(0, Math.round(min)); return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; },
};

/* Stunden eines Eintrags (ohne Pause) */
function stundenVon(e) {
  if (!e.von || !e.bis) return 0;
  return Math.max(0, (Zahl.min(e.bis) - Zahl.min(e.von) - (Number(e.pause) || 0)) / 60);
}

/* Foto verkleinern, optional als "Scan" (Graustufen + Kontrast) */
function bildVerkleinern(datei, { maxKante = 1100, scan = false, qualitaet = 0.62 } = {}) {
  return new Promise((ok, fehler) => {
    const leser = new FileReader();
    leser.onerror = () => fehler(new Error('Datei konnte nicht gelesen werden.'));
    leser.onload = () => {
      const img = new Image();
      img.onerror = () => fehler(new Error('Das ist kein Bild.'));
      img.onload = () => {
        const f = Math.min(1, maxKante / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
        const g = c.getContext('2d');
        g.drawImage(img, 0, 0, c.width, c.height);
        if (scan) {
          const px = g.getImageData(0, 0, c.width, c.height); const d = px.data;
          for (let i = 0; i < d.length; i += 4) {
            let y = 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2];
            y = Math.max(0, Math.min(255, (y - 128) * 1.45 + 150));
            d[i] = d[i + 1] = d[i + 2] = y;
          }
          g.putImageData(px, 0, 0);
        }
        let q = qualitaet; let url = c.toDataURL('image/jpeg', q);
        while (url.length > 230000 && q > 0.3) { q -= 0.08; url = c.toDataURL('image/jpeg', q); }
        if (url.length > 230000) { // noch kleiner rechnen
          const c2 = document.createElement('canvas'); c2.width = c.width * 0.7; c2.height = c.height * 0.7;
          c2.getContext('2d').drawImage(c, 0, 0, c2.width, c2.height); url = c2.toDataURL('image/jpeg', 0.5);
        }
        ok(url);
      };
      img.src = leser.result;
    };
    leser.readAsDataURL(datei);
  });
}

function dateiAlsDataUrl(datei) {
  return new Promise((ok, fehler) => { const l = new FileReader(); l.onload = () => ok(l.result); l.onerror = fehler; l.readAsDataURL(datei); });
}

  const txt = zeilen.map((z, i) => `<text x="28" y="${58 + i * 26}" font-size="${i === 0 ? 19 : 15}" font-weight="${i === 0 ? 700 : 400}">${z}</text>`).join('');
  const striche = Array.from({ length: 6 }, (_, i) => `<rect x="28" y="${250 + i * 18}" width="${150 + ((i * 47) % 120)}" height="6" fill="#c9ccc6"/>`).join('');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 460"><rect width="340" height="460" fill="#dcd8cf"/><g transform="rotate(-2 170 230)"><rect x="12" y="14" width="316" height="430" fill="#fbfaf6" stroke="#cfcac0"/><g font-family="Courier New,monospace" fill="#2a2a2a">${txt}</g>${striche}</g></svg>`;

}

/* ---- store.js ---- */
/* =========================================================================
   Datenspeicher
   Zwei Backends mit derselben Schnittstelle:
   - "cloud": Artifact-Datenbank (geteilt zwischen allen Geräten)
   - "lokal": localStorage + BroadcastChannel (nur dieser Browser, alle Tabs)
   Pfade:  meta/betriebe                 Liste aller Betriebe
           b/<fid>/cfg/main              Einstellungen, Team, Baukasten
           b/<fid>/items/<id>            ein Eintrag (Stunden, Beleg, ...)
           b/<fid>/dateien/<id>          ein Foto oder PDF (Data-URL)
   ========================================================================= */
const Store = (() => {
  let backend = null;
  let modus = 'lokal';

  /* ---------- lokales Backend ---------- */
  function lokalesBackend() {
    const PREFIX = 'rw1|';
    const kanal = ('BroadcastChannel' in window) ? new BroadcastChannel('richtwerk') : null;
    const beobachter = new Set();
    const lies = (k) => { try { const v = localStorage.getItem(PREFIX + k); return v ? JSON.parse(v) : null; } catch { return null; } };
    const alleSchluessel = () => {
      const out = [];
      try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PREFIX)) out.push(k.slice(PREFIX.length)); } } catch { /* gesperrt */ }
      return out;
    };
    const melde = (pfad) => { beobachter.forEach((b) => b(pfad)); };
    if (kanal) kanal.onmessage = (e) => melde(e.data);
    window.addEventListener('storage', (e) => { if (e.key && e.key.startsWith(PREFIX)) melde(e.key.slice(PREFIX.length)); });

    return {
      async get(pfad) { return lies(pfad); },
      async set(pfad, daten) {
        try { localStorage.setItem(PREFIX + pfad, JSON.stringify(daten)); }
        catch { throw new Error('Speicher dieses Browsers ist voll. Bitte kleinere Fotos verwenden.'); }
        melde(pfad); kanal && kanal.postMessage(pfad);
      },
      async del(pfad) { try { localStorage.removeItem(PREFIX + pfad); } catch { /* egal */ } melde(pfad); kanal && kanal.postMessage(pfad); },
      async list(sammlung) {
        const tiefe = sammlung.split('/').length + 1;
        return alleSchluessel()
          .filter((k) => k.startsWith(sammlung + '/') && k.split('/').length === tiefe)
          .map((k) => ({ id: k.split('/').pop(), daten: lies(k) }))
          .filter((d) => d.daten);
      },
      watchDoc(pfad, cb) {
        const f = (p) => { if (p === pfad) cb(lies(pfad)); };
        beobachter.add(f); cb(lies(pfad));
        return () => beobachter.delete(f);
      },
      watchList(sammlung, cb) {
        const tiefe = sammlung.split('/').length + 1;
        const neu = () => this.list(sammlung).then(cb);
        const f = (p) => { if (p.startsWith(sammlung + '/') && p.split('/').length === tiefe) neu(); };
        beobachter.add(f); neu();
        return () => beobachter.delete(f);
      },
    };
  }

  /* ---------- Cloud-Backend (Artifact-Datenbank) ---------- */
  function cloudBackend(db) {
    const warte = (ms) => new Promise((r) => setTimeout(r, ms));
    async function mitWiederholung(fn) {
      for (let versuch = 0; ; versuch++) {
        try { return await fn(); }
        catch (e) {
          const code = e && e.code;
          if ((code === 'unavailable' || code === 'resource_exhausted') && versuch < 4) { await warte(400 * (versuch + 1) + Math.random() * 300); continue; }
          if (code === 'quota_exceeded') throw new Error('Der Speicher ist voll. Bitte alte Fotos löschen.');
          throw e;
        }
      }
    }
    const reihe = new Map(); // ein Schreibvorgang pro Dokument gleichzeitig
    function nacheinander(pfad, fn) {
      const vorher = reihe.get(pfad) || Promise.resolve();
      const jetzt = vorher.catch(() => {}).then(fn);
      reihe.set(pfad, jetzt);
      return jetzt;
    }
    return {
      async get(pfad) { const s = await mitWiederholung(() => db.doc(pfad).get()); return s.exists ? s.data() : null; },
      set(pfad, daten) { return nacheinander(pfad, () => mitWiederholung(() => db.doc(pfad).set(daten))); },
      del(pfad) { return nacheinander(pfad, () => mitWiederholung(() => db.doc(pfad).delete())); },
      async list(sammlung) {
        const s = await mitWiederholung(() => db.collection(sammlung).get());
        return s.docs.map((d) => ({ id: d.id, daten: d.data() }));
      },
      watchDoc(pfad, cb) { return db.doc(pfad).onSnapshot((s) => cb(s.exists ? s.data() : null), () => {}); },
      watchList(sammlung, cb) {
        return db.collection(sammlung).onSnapshot((s) => cb(s.docs.map((d) => ({ id: d.id, daten: d.data() }))), () => {});
      },
    };
  }

  async function init() {
    let db = null;
    if (window.claude && typeof window.claude.use === 'function') {
      db = await Promise.race([
        window.claude.use('db').catch(() => null),
        new Promise((r) => setTimeout(() => r(null), 6000)),
      ]);
    }
    if (db) { backend = cloudBackend(db); modus = 'cloud'; }
    else { backend = lokalesBackend(); modus = 'lokal'; }
    return modus;
  }

  /* ---------- geöffneter Betrieb ---------- */
  const zustand = { fid: null, cfg: null, items: [], abos: [], hoerer: new Set() };
  const dateiCache = new Map();

  function oeffne(fid) {
    if (zustand.fid === fid) return;
    zustand.abos.forEach((u) => u());
    Object.assign(zustand, { fid, cfg: null, items: [], abos: [] });
    zustand.abos.push(backend.watchDoc(`b/${fid}/cfg/main`, (cfg) => { zustand.cfg = cfg; benachrichtige(); }));
    zustand.abos.push(backend.watchList(`b/${fid}/items`, (liste) => {
      zustand.items = liste.map((d) => ({ ...d.daten, id: d.id }));
      benachrichtige();
    }));
  }
  let geplant = false;
  function benachrichtige() {
    if (geplant) return; geplant = true;
    requestAnimationFrame(() => { geplant = false; zustand.hoerer.forEach((h) => h()); });
  }

  function uid(praefix = 'e') {
    return praefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  return {
    init,
    get modus() { return modus; },
    get fid() { return zustand.fid; },
    get cfg() { return zustand.cfg; },
    get items() { return zustand.items; },
    oeffne,
    abonniere(h) { zustand.hoerer.add(h); return () => zustand.hoerer.delete(h); },
    uid,

    /* Betriebsliste */
    async betriebe() { return (await backend.get('meta/betriebe')) || null; },
    async setzeBetriebe(liste) { await backend.set('meta/betriebe', { liste }); },
    async ladeCfg(fid) { return backend.get(`b/${fid}/cfg/main`); },

    /* Einstellungen */
    async speichereCfg(cfg, fid = zustand.fid) {
      const sauber = JSON.parse(JSON.stringify(cfg));
      if (fid === zustand.fid) { zustand.cfg = sauber; benachrichtige(); }
      await backend.set(`b/${fid}/cfg/main`, sauber);
    },

    /* Einträge */
    async neu(eintrag) {
      const id = eintrag.id || uid();
      const daten = { ...eintrag, erstellt: eintrag.erstellt || Date.now() };
      delete daten.id;
      zustand.items = [...zustand.items, { ...daten, id }]; benachrichtige();
      await backend.set(`b/${zustand.fid}/items/${id}`, daten);
      return id;
    },
    async aendere(id, patch) {
      const alt = zustand.items.find((i) => i.id === id);
      if (!alt) return;
      const neu = { ...alt, ...patch, geaendert: Date.now() };
      zustand.items = zustand.items.map((i) => (i.id === id ? neu : i)); benachrichtige();
      const daten = { ...neu }; delete daten.id;
      await backend.set(`b/${zustand.fid}/items/${id}`, daten);
    },
    async loesche(id) {
      zustand.items = zustand.items.filter((i) => i.id !== id); benachrichtige();
      await backend.del(`b/${zustand.fid}/items/${id}`);
    },

    /* Dateien (Fotos, PDFs) */
    async speichereDatei(dataUrl, name) {
      if (dataUrl.length > 240000) throw new Error('Die Datei ist zu groß (max. ca. 170 KB). Fotos werden automatisch verkleinert, PDFs bitte kleiner speichern.');
      const id = uid('f');
      await backend.set(`b/${zustand.fid}/dateien/${id}`, { daten: dataUrl, name: name || '' });
      dateiCache.set(id, dataUrl);
      return id;
    },
    async datei(id) {
      if (!id) return null;
      if (dateiCache.has(id)) return dateiCache.get(id);
      const d = await backend.get(`b/${zustand.fid}/dateien/${id}`);
      if (d) dateiCache.set(id, d.daten);
      return d ? d.daten : null;
    },

    /* Ganzen Betrieb ersetzen (Musterdaten / leeren) */
    async ersetzeBetrieb(fid, cfg, items, fortschritt) {
      const alt = await backend.list(`b/${fid}/items`);
      const neueIds = new Set(items.map((i) => i.id));
      const loeschen = alt.filter((d) => !neueIds.has(d.id));
      const aufgaben = [
        ...loeschen.map((d) => () => backend.del(`b/${fid}/items/${d.id}`)),
        ...items.map((i) => () => { const d = { ...i }; delete d.id; return backend.set(`b/${fid}/items/${i.id}`, d); }),
      ];
      let fertig = 0;
      const arbeiter = async () => {
        while (aufgaben.length) { await aufgaben.shift()(); fertig++; fortschritt && fortschritt(fertig); }
      };
      await backend.set(`b/${fid}/cfg/main`, cfg);
      await Promise.all([arbeiter(), arbeiter(), arbeiter()]);
      return fertig;
    },
  };
})();

/* Regeln, die sich aus dem Aufbau eines Betriebs ergeben */
function regeln(cfg) {
  const bk = (cfg && cfg.baukasten) || { knoten: [], kanten: [] };
  const typen = new Set(bk.knoten.filter((k) => BAUSTEINE[k.typ] && BAUSTEINE[k.typ].gruppe !== 'geplant').map((k) => k.typ));
  const hat = (t) => typen.has(t);
  const verb = (a, b) => hat(a) && hat(b) && bk.kanten.some((k) => k.von === a && k.zu === b);
  const p = (t) => {
    const def = (BAUSTEINE[t] && BAUSTEINE[t].p) || {};
    const knoten = bk.knoten.find((k) => k.typ === t);
    const out = {};
    for (const [k, d] of Object.entries(def)) out[k] = knoten && knoten.p && knoten.p[k] !== undefined ? knoten.p[k] : d.wert;
    return out;
  };
  const liste = (t, k) => String(p(t)[k] || '').split(',').map((s) => s.trim()).filter(Boolean);
  return {
    hat, verb, p, liste,
    imApp: (t) => hat('app') && verb('app', t),
    mitBaustelle: (t) => verb('baustellen', t),
    freigabe: (t) => verb(t, 'freigabe'),
    imExport: (t) => verb(t, 'export') || (verb(t, 'freigabe') && verb('freigabe', 'export')),
    stempeln: () => hat('app') && verb('app', 'stempeln') && verb('stempeln', 'stunden'),
    stundenImApp: () => hat('app') && (verb('app', 'stunden') || verb('stempeln', 'stunden') && verb('app', 'stempeln')),
    darfFreigeben: (rolle) => rolle === 'chef' || (rolle === 'buero' && p('freigabe').wer === 'Chef und Büro'),
  };
}

/* Klartext: Was bewirkt der Aufbau? (für das Entwickler-Tool) */
function wirkungen(cfg, typ) {
  const R = regeln(cfg); const B = BAUSTEINE[typ]; const out = [];
  if (!B) return out;
  if (B.gruppe === 'geplant') return ['Noch in Entwicklung. Beim Kunden nicht sichtbar.'];
  const imBuero = { stunden: 'Stunden', urlaub: 'Urlaub', belege: 'Belege', lieferscheine: 'Lieferscheine', tagelohn: 'Tagelöhner', export: 'Steuerberater', baustellen: 'Baustellen', material: 'Material', dokumente: 'Steuerberater' }[typ];
  if (imBuero) out.push(`Im Büro als Bereich „${imBuero}“ sichtbar.`);
  if (['stempeln', 'stunden', 'urlaub', 'belege', 'lieferscheine', 'material', 'dokumente'].includes(typ)) {
    if (typ === 'stunden') out.push(R.stundenImApp() ? 'Mitarbeiter sehen und erfassen Stunden in der App.' : 'Nicht mit der App verbunden: Stunden nur im Büro.');
    else out.push(R.imApp(typ) ? 'In der Mitarbeiter-App sichtbar.' : 'Nicht mit der App verbunden: Mitarbeiter sehen das nicht.');
  }
  if (typ === 'stempeln') out.push(R.verb('stempeln', 'stunden') ? 'Jedes Stempeln wird ein Stundeneintrag.' : 'Nicht mit dem Stundenzettel verbunden: Stempeln ist ausgeschaltet.');
  if (R.mitBaustelle(typ)) out.push('Mitarbeiter wählen eine Baustelle aus.');
  if (R.freigabe(typ)) out.push(typ === 'belege' ? `Belege ab ${Zahl.eur(R.p('belege').grenze)} muss ${R.p('freigabe').wer === 'Chef' ? 'der Chef' : 'Chef oder Büro'} freigeben.` : `Muss erst von ${R.p('freigabe').wer === 'Chef' ? 'dem Chef' : 'Chef oder Büro'} freigegeben werden.`);
  else if (['stunden', 'urlaub', 'belege', 'tagelohn', 'material'].includes(typ)) out.push(typ === 'material' ? 'Ohne Freigabe: geht direkt auf die Bestell-Liste.' : 'Ohne Freigabe: gilt sofort als erledigt.');
  if (['stunden', 'belege', 'lieferscheine', 'tagelohn'].includes(typ)) out.push(R.imExport(typ) ? `Kommt ins Monatspaket für ${R.p('export').empfaenger}.` : 'Geht nicht ans Steuerbüro.');
  if (typ === 'export') {
    const drin = ['stunden', 'belege', 'lieferscheine', 'tagelohn'].filter(R.imExport).map((t) => BAUSTEINE[t].name);
    out.push(drin.length ? 'Im Paket: ' + drin.join(', ') + '.' : 'Noch nichts angeschlossen.');
    if (R.verb('freigabe', 'export')) out.push('Über die Freigabe kommen nur freigegebene Einträge ins Paket.');
  }
  if (typ === 'freigabe') {
    const rein = B.ein.filter((t) => R.verb(t, 'freigabe')).map((t) => BAUSTEINE[t].name);
    out.push(rein.length ? 'Prüft: ' + rein.join(', ') + '.' : 'Noch nichts angeschlossen.');
  }
  if (typ === 'tagelohn' && R.p('tagelohn').satz < 13.9) out.push('Achtung: unter dem Mindestlohn von 13,90 €.');
  return out;
}

  function ahlersItems(heute = Datum.heute()) {
    const items = [];

    const jahr = Number(heute.slice(0, 4));
    const montag = Datum.montag(heute);
    const start = Datum.plus(montag, -14);
    const arbeiter = ['p3', 'p4', 'p5', 'p6', 'p7'];
    // Wer an welcher Baustelle arbeitet (pro Woche wechselnd)
    const plan = [
      { p3: 'b3', p4: 'b3', p5: 'b2', p6: 'b2', p7: 'b3' },
      { p3: 'b1', p4: 'b0', p5: 'b2', p6: 'b0', p7: 'b1' },
      { p3: 'b1', p4: 'b1', p5: 'b2', p6: 'b2', p7: 'b1' },
    ];
    const taetigkeit = { b0: 'Abbund Dachstuhl Hinrichs', b1: 'Dachstuhl richten', b2: 'Carport aufstellen', b3: 'Sparren verstärken, Dämmung' };
    const krankMarek = Datum.plus(montag, -7 + 2); // Mi + Do letzte Woche
    for (let d = start; d < heute; d = Datum.plus(d, 1)) {
      const wt = Datum.wochentag(d);
      if (wt > 4 || Datum.feiertag(d)) continue;
      const woche = Math.floor((Datum.von(d) - Datum.von(start)) / 864e5 / 7);
      const aktuelleWoche = d >= montag;
      for (const p of arbeiter) {
        if (p === 'p7' && (d === krankMarek || d === Datum.plus(krankMarek, 1))) continue;
        let bs = plan[woche][p]; let von = '07:00'; let bis = wt === 4 ? '13:00' : '16:15'; let pause = wt === 4 ? 15 : 45; let txt = taetigkeit[bs];
        if (p === 'p6' && wt === 1) { bs = ''; von = '07:45'; bis = '15:15'; pause = 30; txt = 'Berufsschule'; }
        if (p === 'p3' && wt === 2) bis = '17:00';
        if (p === 'p5' && wt === 0 && woche === 1) { von = '06:30'; }
        add(`s_${d}_${p}`, { typ: 'stunden', pid: p, datum: d, von, bis, pause, bs, taetigkeit: txt, quelle: 'stempeln', status: aktuelleWoche ? 'offen' : 'freigegeben' });
      }
    }
    // Heute: wer schon eingestempelt ist
    if (Datum.istWerktag(heute)) {
      const heuteBs = plan[2];
      // Beginn 07:00; außerhalb der Arbeitszeit (Vorführung am Abend) zwei Stunden vor jetzt
      const jetzt = new Date().getHours() * 60 + new Date().getMinutes();
      const beginn = jetzt >= 8 * 60 && jetzt <= 17 * 60 ? 7 * 60 : Math.max(0, Math.floor((jetzt - 120) / 15) * 15);
      for (const p of ['p3', 'p4', 'p5', 'p7']) add(`s_${heute}_${p}`, { typ: 'stunden', pid: p, datum: heute, von: Zahl.hhmm(p === 'p5' ? beginn + 15 : beginn), bis: '', pause: 0, bs: heuteBs[p], taetigkeit: '', quelle: 'stempeln', status: 'laeuft' });
    }
    // Urlaub und Krank
    add('u_marek_krank', { typ: 'krank', pid: 'p7', von: krankMarek, bis: Datum.plus(krankMarek, 1), notiz: 'Erkältung', status: 'gemeldet', au: true });
    add('u_sommer_p3', { typ: 'urlaub', pid: 'p3', von: `${jahr}-07-20`, bis: `${jahr}-08-07`, art: 'Urlaub', status: 'genehmigt' });
    add('u_sommer_p4', { typ: 'urlaub', pid: 'p4', von: `${jahr}-08-10`, bis: `${jahr}-08-21`, art: 'Urlaub', status: 'genehmigt' });
    add('u_sommer_p5', { typ: 'urlaub', pid: 'p5', von: `${jahr}-06-01`, bis: `${jahr}-06-12`, art: 'Urlaub', status: 'genehmigt' });
    add('u_sommer_p6', { typ: 'urlaub', pid: 'p6', von: `${jahr}-07-27`, bis: `${jahr}-08-14`, art: 'Urlaub', status: 'genehmigt' });
    add('u_sommer_p7', { typ: 'urlaub', pid: 'p7', von: `${jahr}-08-03`, bis: `${jahr}-08-14`, art: 'Urlaub', status: 'genehmigt' });
    const weihnachten = heute < `${jahr}-12-14` ? [`${jahr}-12-22`, `${jahr + 1}-01-02`] : [Datum.plus(heute, 20), Datum.plus(heute, 31)];
    add('u_antrag_p5', { typ: 'urlaub', pid: 'p5', von: weihnachten[0], bis: weihnachten[1], art: 'Urlaub', notiz: 'Weihnachten bei der Familie', status: 'beantragt' });
    add('u_antrag_p4', { typ: 'urlaub', pid: 'p4', von: Datum.plus(montag, 11), bis: Datum.plus(montag, 11), art: 'Überstundenabbau', notiz: 'Umzug', status: 'beantragt' });
    // Belege
    const b = (id, tage, pid, kategorie, haendler, betrag, bs, status, notiz) => {
      const datum = Datum.plus(heute, -tage); const e = { typ: 'beleg', pid, datum, kategorie, haendler, betrag, bs, status, notiz };
      e.datei = 'muster'; add(id, e);
    };
    b('be1', 12, 'p3', 'Tanken', 'Tankstelle Hude', 78.4, 'b1', 'freigegeben', 'Bulli HB-ZA 410');
    b('be2', 9, 'p5', 'Material', 'Baumarkt Delmenhorst', 23.95, 'b2', 'freigegeben', 'Schlossschrauben M12');
    b('be3', 6, 'p4', 'Werkzeug', 'Würth Niederlassung', 146.2, 'b0', 'offen', 'Sägeblätter Handkreissäge');
    b('be4', 3, 'p3', 'Verpflegung', 'Bäckerei Hude', 18.5, 'b1', 'freigegeben', 'Richtfest Brötchen');
    b('be5', 1, 'p5', 'Tanken', 'Tankstelle Ganderkesee', 92.1, 'b2', 'offen', 'Pritsche HB-ZA 77');
    b('be6', 0, 'p7', 'Material', 'Baumarkt Delmenhorst', 12.49, 'b1', 'neu', 'Abdeckplane');
    // Lieferscheine
    const l = (id, tage, pid, lieferant, nummer, bs, status, positionen) => add(id, { typ: 'lieferschein', pid, datum: Datum.plus(heute, -tage), lieferant, nummer, bs, status, positionen, datei: 'muster', notiz: '' });
    l('ls1', 10, 'p3', 'Holzhandel Ritter', 'LS-204471', 'b1', 'geprueft', ['KVH 80x200 C24, 38 Stk', 'BSH 120x240 GL24h, 4 Stk', 'Dachlatten 30/50, 20 Bd']);
    l('ls2', 8, 'p5', 'Baustoffe Nord', '8812-33', 'b2', 'geprueft', ['Pfostenträger U 100, 6 Stk', 'Trapezblech 0,63 mm, 14 Tafeln']);
    l('ls3', 2, 'p3', 'Holzhandel Ritter', 'LS-204915', 'b1', 'neu', ['Konterlatten 40/60, 12 Bd', 'Unterdeckbahn 1,5 x 50 m, 3 Rollen']);
    l('ls4', 0, 'p4', 'Würth', '4471-0098', 'b3', 'neu', ['Vollgewindeschrauben 8x300, 2 Pak', 'Holzbauwinkel 105, 40 Stk']);
    // Tagelöhner
    add('tl1', { typ: 'tagelohn', tid: 't1', datum: Datum.plus(montag, -6), stunden: 7.5, satz: 16, bs: 'b1', taetigkeit: 'Richten Dachstuhl, Material reichen', status: 'freigegeben', bezahlt: true });
    add('tl2', { typ: 'tagelohn', tid: 't2', datum: Datum.plus(montag, -5), stunden: 6, satz: 18, bs: 'b1', taetigkeit: 'Richten Dachstuhl', status: 'freigegeben', bezahlt: true });
    add('tl3', { typ: 'tagelohn', tid: 't1', datum: Datum.plus(montag, 0) < heute ? Datum.plus(montag, 0) : Datum.plus(montag, -3), stunden: 8, satz: 16, bs: 'b3', taetigkeit: 'Entsorgung Altdämmung', status: 'offen', bezahlt: false });
    // Material
    add('m1', { typ: 'material', pid: 'p3', datum: Datum.plus(heute, -1), bs: 'b1', text: 'Dachlatten 30/50 nochmal 10 Bund, Nagelplatten', status: 'offen' });
    add('m2', { typ: 'material', pid: 'p5', datum: Datum.plus(heute, -4), bs: 'b2', text: 'Kopfbänder 2 Stk nachschneiden lassen', status: 'erledigt' });
    // Lohnzettel Vormonat
    const vm = Datum.plus(heute.slice(0, 8) + '01', -1).slice(0, 7);
    for (const p of arbeiter) add(`d_lohn_${p}`, { typ: 'dokument', fuer: p, titel: `Lohnabrechnung ${Datum.monatName(vm)}`, monat: vm, datei: 'muster', name: `Lohnabrechnung_${vm}.pdf`, gelesen: p === 'p3', datum: Datum.plus(heute, -12) });
    return items;
  }

  function leerCfg() {
    return {
      id: 'leer', kennung: 'neu', name: 'Neuer Betrieb', zusatz: 'Hier wird ein Betrieb von Grund auf eingerichtet', ort: '', farbe: '#3a4a63', kuerzel: 'NB', paket: 'Start',
      personen: [{ id: 'p1', name: 'Inhaber', rolle: 'chef', funktion: 'Inhaber', code: '1001', soll: 0, urlaub: 30 }],
      baustellen: [], tageloehner: [], baukasten: leererBaukasten(), notizen: '', angelegt: Date.now(),
    };
  }

  const LISTE = [
    { id: 'ahlers', kennung: 'ahlers', name: 'Zimmerei Ahlers', art: 'muster' },
    { id: 'leer', kennung: 'neu', name: 'Neuer Betrieb', art: 'leer' },
  ];

  async function einrichten(fortschritt) {
    await Store.ersetzeBetrieb('ahlers', ahlersCfg(), ahlersItems(), fortschritt);
    await Store.ersetzeBetrieb('leer', leerCfg(), [], fortschritt);
    await Store.setzeBetriebe(LISTE);
  }

  async function zuruecksetzen(fid, fortschritt) {
    if (fid === 'ahlers') return Store.ersetzeBetrieb('ahlers', ahlersCfg(), ahlersItems(), fortschritt);
    if (fid === 'leer') return Store.ersetzeBetrieb('leer', leerCfg(), [], fortschritt);

})();

/* ---- gemeinsam.js ---- */
/* =========================================================================
   Gemeinsame Auswertungen für Büro, App und Vorschau
   Ein "Kontext" bündelt alles, was eine Ansicht braucht.
   ========================================================================= */
function kontext(cfg, items, pid) {
  const R = regeln(cfg);
  const personen = (cfg && cfg.personen) || [];
  const c = {
    cfg, items, R, personen,
    ich: personen.find((p) => p.id === pid) || null,
    heute: Datum.heute(),
    person: (id) => personen.find((p) => p.id === id) || { name: 'Unbekannt', rolle: '', id },
    baustelle: (id) => ((cfg && cfg.baustellen) || []).find((b) => b.id === id),
    bsName: (id) => { const b = c.baustelle(id); return b ? b.name : (id ? '–' : 'ohne Baustelle'); },
    baustellenOffen: () => ((cfg && cfg.baustellen) || []).filter((b) => b.status !== 'fertig'),
    tageloehner: (id) => ((cfg && cfg.tageloehner) || []).find((t) => t.id === id) || { name: 'Unbekannt' },
    arbeiter: () => personen.filter((p) => Number(p.soll) > 0),
    typ: (t) => items.filter((i) => i.typ === t),
    kuerzel: (name) => String(name || '?').split(/\s+/).map((s) => s[0]).join('').slice(0, 2).toUpperCase(),
  };

  c.stundenAm = (pid, datum) => items.filter((i) => i.typ === 'stunden' && i.pid === pid && i.datum === datum);
  c.stundenSumme = (pid, von, bis) => items.filter((i) => i.typ === 'stunden' && i.pid === pid && i.datum >= von && i.datum <= bis).reduce((s, e) => s + stundenVon(e), 0);
  c.laeuft = (pid) => items.find((i) => i.typ === 'stunden' && i.pid === pid && i.status === 'laeuft');
  c.abwesend = (pid, datum) => items.find((i) => (i.typ === 'urlaub' || i.typ === 'krank') && i.pid === pid && i.von <= datum && i.bis >= datum && i.status !== 'abgelehnt');

  c.urlaubstage = (e, jahr) => {
    const von = e.von < `${jahr}-01-01` ? `${jahr}-01-01` : e.von;
    const bis = e.bis > `${jahr}-12-31` ? `${jahr}-12-31` : e.bis;
    return von > bis ? 0 : Datum.werktageZwischen(von, bis);
  };
  c.urlaubKonto = (pid, jahr = Number(c.heute.slice(0, 4))) => {
    const p = c.person(pid);
    const anspruch = Number(p.urlaub) || Number(R.p('urlaub').tage) || 30;
    const eig = items.filter((i) => i.typ === 'urlaub' && i.pid === pid && i.art !== 'Überstundenabbau');
    const genommen = eig.filter((i) => i.status === 'genehmigt').reduce((s, e) => s + c.urlaubstage(e, jahr), 0);
    const beantragt = eig.filter((i) => i.status === 'beantragt').reduce((s, e) => s + c.urlaubstage(e, jahr), 0);
    return { anspruch, genommen, beantragt, rest: anspruch - genommen };
  };

  /* Was wartet auf eine Entscheidung? */
  c.offen = () => {
    const out = { stunden: [], urlaub: [], belege: [], lieferscheine: [], material: [], tagelohn: [] };
    for (const i of items) {
      if (i.typ === 'stunden' && i.status === 'offen' && R.freigabe('stunden')) out.stunden.push(i);
      if (i.typ === 'urlaub' && i.status === 'beantragt') out.urlaub.push(i);
      if (i.typ === 'beleg' && (i.status === 'offen' || i.status === 'neu')) out.belege.push(i);
      if (i.typ === 'lieferschein' && i.status === 'neu') out.lieferscheine.push(i);
      if (i.typ === 'material' && i.status === 'offen') out.material.push(i);
      if (i.typ === 'tagelohn' && i.status === 'offen' && R.freigabe('tagelohn')) out.tagelohn.push(i);
    }
    return out;
  };
  return c;
}

/* Status neuer Einträge je nach Aufbau */
function startStatus(R, typ, e = {}) {
  if (typ === 'stunden') return R.freigabe('stunden') ? 'offen' : 'freigegeben';
  if (typ === 'urlaub') return R.freigabe('urlaub') ? 'beantragt' : 'genehmigt';
  if (typ === 'beleg') return R.freigabe('belege') && Number(e.betrag) >= Number(R.p('belege').grenze) ? 'offen' : 'neu';
  if (typ === 'tagelohn') return R.freigabe('tagelohn') ? 'offen' : 'freigegeben';
  if (typ === 'material') return 'offen';
  if (typ === 'lieferschein') return 'neu';
  return 'neu';
}

const STATUS_TEXT = {
  offen: ['Zu prüfen', 'warn'], laeuft: ['Läuft', 'info'], freigegeben: ['Freigegeben', 'ok'], abgelehnt: ['Abgelehnt', 'bad'],
  beantragt: ['Beantragt', 'warn'], genehmigt: ['Genehmigt', 'ok'], gemeldet: ['Gemeldet', 'info'],
  neu: ['Neu', 'info'], geprueft: ['Geprüft', 'ok'], erledigt: ['Erledigt', 'ok'], bestellt: ['Bestellt', 'info'],
};
const chip = (status, klasse = 'chip') => { const [t, k] = STATUS_TEXT[status] || [status, '']; return `<span class="${klasse} ${k}">${esc(t)}</span>`; };

/* Bild eines Eintrags auflösen (Musterbild oder gespeicherte Datei) */
async function bildFuer(e) {
  if (!e || !e.datei) return null;
  if (e.datei === 'muster') {
    if (e.typ === 'dokument') return lohnzettelBild(e);
    return musterBild(e.typ === 'lieferschein' ? 'lieferschein' : 'beleg', e);
  }
  return Store.datei(e.datei);
}
function lohnzettelBild(e) {
  const p = (Store.cfg && Store.cfg.personen || []).find((x) => x.id === e.fuer) || { name: '' };
  const z = ['Lohnabrechnung', esc(Datum.monatName(e.monat || Datum.heute().slice(0, 7))), '', 'Arbeitnehmer: ' + esc(p.name), 'Steuerklasse I', '', 'Bruttolohn', 'Gesetzl. Abzüge', 'Nettolohn', '', '(Musterdokument)'];
  const t = z.map((s, i) => `<text x="30" y="${50 + i * 26}" font-size="${i === 0 ? 20 : 14}" font-weight="${i === 0 ? 700 : 400}">${s}</text>`).join('');
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 460"><rect width="340" height="460" fill="#fff"/><rect x="0" y="0" width="340" height="8" fill="#2f5e4e"/><g font-family="Arial" fill="#222">${t}</g></svg>`);
}
/* Nach dem Zeichnen: alle <img data-eintrag="id"> befüllen */
function bilderNachladen(wurzel, items) {
  $$('img[data-eintrag]', wurzel).forEach(async (img) => {
    const e = items.find((i) => i.id === img.dataset.eintrag);
    const url = await bildFuer(e).catch(() => null);
    if (url && img.isConnected) img.src = url;
  });
}
