      <div class="a-karte stempel"><div class="status"><i style="background:var(--firma)"></i>Resturlaub ${c.heute.slice(0, 4)}</div><div class="zeit">${k.rest}<span style="font-size:18px;color:#6b7280;font-family:var(--schrift);font-weight:400"> von ${k.anspruch} Tagen</span></div>
      <div class="ort">${k.genommen} genommen${k.beantragt ? ` · ${k.beantragt} beantragt` : ''}</div>
      <button class="gross-knopf firma" data-a="unter" data-id="urlaubsantrag">${Icon('plus')} Urlaub beantragen</button>
      ${c.R.p('urlaub').krank === 'ja' ? `<button class="gross-knopf hell" style="margin-top:10px" data-a="unter" data-id="krank">${Icon('krank')} Krank melden</button>` : ''}</div>
      <div class="a-titel">Meine Anträge</div><div class="a-karte">${eig.map((u) => zeile({ sym: u.typ === 'krank' ? 'krank' : 'kalender', titel: `${u.typ === 'krank' ? 'Krank' : esc(u.art || 'Urlaub')}: ${Datum.kurz(u.von)} – ${Datum.kurz(u.bis)}`, unter: `${Zahl.tage(Datum.werktageZwischen(u.von, u.bis), 'Arbeitstag')}${u.notiz ? ' · ' + esc(u.notiz) : ''}`, rechts: status(u.status) })).join('') || '<div class="leer">Noch keine Anträge.</div>'}</div>`;
  };

  BILD.mehr = (c) => {
    const doks = c.items.filter((i) => i.typ === 'dokument' && (i.fuer === c.ich.id || i.fuer === 'alle')).sort((a, b) => b.erstellt - a.erstellt);
    return `<div class="unterseite-kopf"><h2>Mehr</h2></div>
      <div class="a-karte">${zeile({ sym: 'person', symKlasse: 'firma', titel: esc(c.ich.name), unter: `${esc(c.ich.funktion || '')} · ${esc(c.cfg.name)}` })}</div>
      ${c.R.imApp('dokumente') ? `<div class="a-titel">Meine Dokumente</div><div class="a-karte">${doks.map((d) => zeile({ sym: 'dokument', titel: esc(d.titel), unter: d.gelesen ? 'gelesen' : '<b style="color:#c23a2b">neu</b>', a: 'dokument', id: d.id })).join('') || '<div class="leer">Noch keine Dokumente.</div>'}</div>` : ''}
      <div class="a-titel">Konto</div><div class="a-karte">${zeile({ sym: 'abmelden', titel: 'Abmelden', unter: 'Ein anderer Mitarbeiter meldet sich an', a: 'abmelden' })}${zeile({ sym: 'x', titel: 'Betrieb trennen', unter: 'Handy von diesem Betrieb lösen', a: 'trennen' })}</div>
      <p style="text-align:center;color:#9aa1ad;font-size:12px;margin-top:24px">${LOGO.replace('<svg', '<svg style="width:18px;height:18px;vertical-align:-4px;margin-right:6px"')}Richtwerk · Mitarbeiter-App 0.9</p>`;
  };

  BILD.freigaben = (c) => {
    const o = c.offen(); const darf = c.R.darfFreigeben(c.ich.rolle);
    let html = `<div class="unterseite-kopf"><h2>Freigaben</h2></div>`;
    if (!darf) html += `<div class="hinweis-box">Freigaben macht in diesem Betrieb nur der Chef.</div>`;
    if (o.urlaub.length) html += `<div class="a-titel">Urlaub</div><div class="a-karte">${o.urlaub.map((u) => `${zeile({ sym: 'kalender', titel: `${esc(c.person(u.pid).name)}: ${Datum.kurz(u.von)} – ${Datum.kurz(u.bis)}`, unter: `${Zahl.tage(Datum.werktageZwischen(u.von, u.bis))} · ${esc(u.art || 'Urlaub')}${u.notiz ? ' · ' + esc(u.notiz) : ''}` })}${darf ? `<div style="display:flex;gap:8px;padding:0 16px 14px"><button class="gross-knopf hell" style="padding:11px;font-size:15px" data-a="entscheide" data-id="${u.id}" data-wert="abgelehnt">Ablehnen</button><button class="gross-knopf firma" style="padding:11px;font-size:15px" data-a="entscheide" data-id="${u.id}" data-wert="genehmigt">Genehmigen</button></div>` : ''}`).join('')}</div>`;
    if (o.stunden.length) {
      const proPerson = {}; o.stunden.forEach((s) => { (proPerson[s.pid] = proPerson[s.pid] || []).push(s); });
      html += `<div class="a-titel">Stunden</div><div class="a-karte">${Object.entries(proPerson).map(([pid, l]) => zeile({ sym: 'uhr', titel: esc(c.person(pid).name), unter: `${l.length} Tage · ${Zahl.std(l.reduce((s, e) => s + stundenVon(e), 0))} Std.`, rechts: darf ? `<button class="a-status ok" style="border:0;padding:8px 12px;font-size:13px" data-a="stunden-frei" data-id="${pid}">Freigeben</button>` : '' })).join('')}</div>`;
    }
    const belege = o.belege.filter((b) => b.status === 'offen');
    if (belege.length) html += `<div class="a-titel">Belege über ${Zahl.eur(c.R.p('belege').grenze)}</div><div class="a-karte">${belege.map((b) => `${zeile({ sym: 'beleg', titel: `${Zahl.eur(b.betrag)} · ${esc(b.kategorie)}`, unter: `${esc(c.person(b.pid).name)} · ${esc(b.haendler || b.notiz || '')}` })}${darf ? `<div style="display:flex;gap:8px;padding:0 16px 14px"><button class="gross-knopf hell" style="padding:11px;font-size:15px" data-a="entscheide" data-id="${b.id}" data-wert="abgelehnt">Ablehnen</button><button class="gross-knopf firma" style="padding:11px;font-size:15px" data-a="entscheide" data-id="${b.id}" data-wert="freigegeben">Freigeben</button></div>` : ''}`).join('')}</div>`;
    if (o.material.length) html += `<div class="a-titel">Material</div><div class="a-karte">${o.material.map((m) => zeile({ sym: 'material', titel: esc(m.text), unter: `${esc(c.person(m.pid).name)} · ${esc(c.bsName(m.bs))}`, rechts: `<button class="a-status info" style="border:0;padding:8px 12px;font-size:13px" data-a="entscheide" data-id="${m.id}" data-wert="bestellt">Bestellt</button>` })).join('')}</div>`;
    if (!o.urlaub.length && !o.stunden.length && !belege.length && !o.material.length) html += `<div class="hinweis-box gruen">${Icon('haken')} Alles erledigt. Nichts wartet auf dich.</div>`;
    return html;
  };

  /* ---------- Unterseiten (Formulare) ---------- */
  const UNTER = {};

  UNTER.einstempeln = (c) => `${unterKopf('Arbeitsbeginn')}<p style="color:#6b7280;margin:-6px 4px 14px">Wo arbeitest du heute?</p>
    <div class="a-karte">${c.baustellenOffen().map((b) => zeile({ sym: 'haus', titel: esc(b.name), unter: esc(b.ort), a: 'einstempeln', id: b.id })).join('')}${zeile({ sym: 'start', titel: 'Ohne Baustelle', unter: 'Halle, Fahrt, Sonstiges', a: 'einstempeln', id: '' })}</div>`;
  UNTER.wechsel = (c) => `${unterKopf('Baustelle wechseln')}<p style="color:#6b7280;margin:-6px 4px 14px">Die bisherige Zeit wird abgeschlossen, ab jetzt zählt die neue Baustelle.</p>
    <div class="a-karte">${c.baustellenOffen().map((b) => zeile({ sym: 'haus', titel: esc(b.name), unter: esc(b.ort), a: 'wechseln', id: b.id })).join('')}</div>`;

  UNTER.feierabend = (c) => {
    const d = zustand.daten;
    return `${unterKopf('Feierabend')}<div class="a-karte" style="padding:16px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="a-feld"><span>Beginn</span><input type="time" name="von" value="${esc(d.von)}"></label><label class="a-feld"><span>Ende</span><input type="time" name="bis" value="${esc(d.bis)}"></label></div>
      <label class="a-feld"><span>Pause (Minuten)</span><input type="number" name="pause" inputmode="numeric" value="${esc(d.pause)}"></label>
      ${c.R.mitBaustelle('stunden') ? bsAuswahl(c, d.bs) : ''}
      <label class="a-feld"><span>Was hast du gemacht?</span><input name="taetigkeit" placeholder="z. B. Sparren gesetzt" value="${esc(d.taetigkeit || '')}"></label>
      <button class="gross-knopf firma" data-a="speichere-feierabend">${Icon('haken')} Zeit speichern</button></div>
      <p style="color:#6b7280;font-size:13px;text-align:center">Gerundet auf ${c.R.p('stempeln').rundung} Min. · Pause nach Regel des Betriebs vorgeschlagen</p>`;
  };

  UNTER.stunden = (c) => {
    const min = Datum.plus(c.heute, -Number(c.R.p('stunden').nachtrag));
    return `${unterKopf('Stunden eintragen')}<div class="a-karte" style="padding:16px">
      <label class="a-feld"><span>Tag</span><input type="date" name="datum" value="${c.heute}" min="${min}" max="${c.heute}"></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="a-feld"><span>Beginn</span><input type="time" name="von" value="07:00"></label><label class="a-feld"><span>Ende</span><input type="time" name="bis" value="16:15"></label></div>
      <label class="a-feld"><span>Pause (Minuten)</span><input type="number" name="pause" inputmode="numeric" value="45"></label>
      ${c.R.mitBaustelle('stunden') ? bsAuswahl(c, (c.baustellenOffen()[0] || {}).id) : ''}
      <label class="a-feld"><span>Tätigkeit</span><input name="taetigkeit" placeholder="z. B. Abbund"></label>
      <button class="gross-knopf firma" data-a="speichere-stunden">${Icon('haken')} Speichern</button></div>`;
  };

  UNTER.urlaubsantrag = (c) => {
    let ab = Datum.plus(c.heute, Number(c.R.p('urlaub').vorlauf));
    while (!Datum.istArbeitstag(ab)) ab = Datum.plus(ab, 1);
    return `${unterKopf('Urlaub beantragen')}<div class="a-karte" style="padding:16px">
      <div class="a-feld"><span>Art</span><div class="a-chips" data-wahl="art">${['Urlaub', 'Überstundenabbau', 'Sonderurlaub'].map((a, i) => `<button type="button" class="${i ? '' : 'an'}" data-a="wahl" data-id="${a}">${a}</button>`).join('')}</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="a-feld"><span>Von</span><input type="date" name="von" min="${ab}" value="${ab}"></label><label class="a-feld"><span>Bis</span><input type="date" name="bis" min="${ab}" value="${ab}"></label></div>
      <label class="a-feld"><span>Bemerkung (optional)</span><input name="notiz"></label>
      <p id="urlaub-tage" style="color:#6b7280;margin:0 0 14px">1 Arbeitstag</p>
      <button class="gross-knopf firma" data-a="speichere-urlaub">${Icon('haken')} Antrag senden</button></div>
      ${Number(c.R.p('urlaub').vorlauf) ? `<p style="color:#6b7280;font-size:13px;text-align:center">Urlaub bitte mindestens ${c.R.p('urlaub').vorlauf} Tage vorher beantragen.</p>` : ''}`;
  };

  UNTER.krank = (c) => `${unterKopf('Krank melden')}<div class="hinweis-box">Gute Besserung! Die Meldung geht sofort an ${esc(c.cfg.name)}. Die Krankmeldung vom Arzt (AU) bitte im Büro abgeben.</div>
    <div class="a-karte" style="padding:16px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="a-feld"><span>Ab</span><input type="date" name="von" value="${c.heute}"></label><label class="a-feld"><span>Voraussichtlich bis</span><input type="date" name="bis" value="${c.heute}"></label></div>
    <label class="a-feld"><span>Notiz (optional)</span><input name="notiz"></label><button class="gross-knopf rot" data-a="speichere-krank">Krank melden</button></div>`;

  UNTER.material = (c) => `${unterKopf('Material anfordern')}<div class="a-karte" style="padding:16px">
    ${c.R.mitBaustelle('material') ? bsAuswahl(c, (c.baustellenOffen()[0] || {}).id) : ''}
    <label class="a-feld"><span>Was fehlt?</span><textarea name="text" placeholder="z. B. 10 Bund Dachlatten 30/50"></textarea></label>
    <button class="gross-knopf firma" data-a="speichere-material">${Icon('haken')} An den Chef senden</button></div>`;

  function scanFormular(c, art) {
    const d = zustand.daten; const istBeleg = art === 'beleg';
    const flaeche = d.bild
      ? `<div class="scan-flaeche"><img src="${d.anzeige || d.bild}" alt="Foto"><div class="ecken"><i></i><i></i><i></i><i></i></div></div>
         <div class="scan-werkzeuge"><button data-a="scanmodus" data-id="0" class="${d.scan ? '' : 'an'}">Original</button><button data-a="scanmodus" data-id="1" class="${d.scan ? 'an' : ''}">Dokument (s/w)</button><button data-a="foto">${Icon('kamera')} Neu</button></div>`
      : `<button class="scan-flaeche" data-a="foto" style="border:0;width:100%"><div class="ecken"><i></i><i></i><i></i><i></i></div><div class="leerhinweis">${Icon('kamera')}<div style="color:#fff;font-weight:600;font-size:16px">Foto aufnehmen</div><div style="font-size:13px;margin-top:4px">${istBeleg ? 'Quittung flach hinlegen' : 'Lieferschein flach hinlegen'}, gut ausleuchten</div></div></button>
         <button class="gross-knopf hell" style="margin:12px 0 16px" data-a="galerie">Aus der Galerie wählen</button>`;
    const felder = istBeleg
      ? `<label class="a-feld"><span>Betrag in €</span><input class="betrag" name="betrag" inputmode="decimal" placeholder="0,00" value="${esc(d.betrag || '')}"></label>
         <div class="a-feld"><span>Kategorie</span><div class="a-chips" data-wahl="kategorie">${c.R.liste('belege', 'kategorien').map((k, i) => `<button type="button" class="${(d.kategorie || c.R.liste('belege', 'kategorien')[0]) === k ? 'an' : ''}" data-a="wahl" data-id="${esc(k)}">${esc(k)}</button>`).join('')}</div></div>
         <label class="a-feld"><span>Geschäft (optional)</span><input name="haendler" value="${esc(d.haendler || '')}"></label>`
      : `<div class="a-feld"><span>Lieferant</span><div class="a-chips" data-wahl="lieferant">${c.R.liste('lieferscheine', 'lieferanten').map((k) => `<button type="button" class="${(d.lieferant || c.R.liste('lieferscheine', 'lieferanten')[0]) === k ? 'an' : ''}" data-a="wahl" data-id="${esc(k)}">${esc(k)}</button>`).join('')}</div></div>
         <label class="a-feld"><span>Lieferschein-Nr. (optional)</span><input name="nummer" value="${esc(d.nummer || '')}"></label>`;
    return `${unterKopf(istBeleg ? 'Beleg scannen' : 'Lieferschein')}${flaeche}
      <div class="a-karte" style="padding:16px">${felder}${c.R.mitBaustelle(istBeleg ? 'belege' : 'lieferscheine') ? bsAuswahl(c, d.bs !== undefined ? d.bs : (c.laeuft(c.ich.id) || c.baustellenOffen()[0] || {}).bs || (c.baustellenOffen()[0] || {}).id) : ''}
      <label class="a-feld"><span>Notiz (optional)</span><input name="notiz" value="${esc(d.notiz || '')}"></label>
      <button class="gross-knopf firma" data-a="speichere-scan" data-id="${art}" ${d.bild ? '' : 'disabled'}>${Icon('upload')} Ans Büro senden</button></div>`;
  }
  UNTER.beleg = (c) => scanFormular(c, 'beleg');
  UNTER.lieferschein = (c) => scanFormular(c, 'lieferschein');

  UNTER.gesendet = (c) => `<div style="text-align:center;padding:60px 20px"><div style="width:84px;height:84px;border-radius:50%;background:var(--firma-hell);color:var(--firma);display:grid;place-items:center;margin:0 auto 20px">${Icon('haken').replace('class="ic"', 'class="ic" style="width:42px;height:42px;stroke-width:2.2"')}</div>
    <h2 style="margin:0 0 8px">${esc(zustand.daten.titel || 'Gesendet')}</h2><p style="color:#6b7280;margin:0 0 28px">${esc(zustand.daten.text || 'Ist jetzt im Büro sichtbar.')}</p>
    <button class="gross-knopf firma" data-a="fertig">Fertig</button>${zustand.daten.nochmal ? `<button class="gross-knopf hell" style="margin-top:10px" data-a="unter" data-id="${zustand.daten.nochmal}">Noch einen</button>` : ''}</div>`;

  UNTER.dokument = (c) => {
    const d = c.items.find((i) => i.id === zustand.daten.id);
    return `${unterKopf(esc(d ? d.titel : 'Dokument'))}<div class="a-karte" id="dok-anzeige" style="min-height:300px"><div class="leer">Wird geladen …</div></div>`;
  };

  UNTER.eintrag = (c) => {
    const e = c.items.find((i) => i.id === zustand.daten.id);
    if (!e) return unterKopf('Eintrag');
    return `${unterKopf('Eintrag')}<div class="a-karte">${zeile({ sym: 'uhr', titel: `${Datum.mittel(e.datum)} · ${esc(e.von)} – ${esc(e.bis)}`, unter: `${Zahl.std(stundenVon(e))} Std. · Pause ${e.pause} Min.`, rechts: status(e.status) })}${zeile({ sym: 'haus', titel: esc(c.bsName(e.bs)), unter: esc(e.taetigkeit || '') })}</div>
      <p style="color:#6b7280;font-size:13px;margin:12px 4px">${e.status === 'abgelehnt' ? 'Dieser Eintrag wurde abgelehnt. Bitte löschen und neu eintragen.' : 'Noch nicht freigegeben. Du kannst ihn löschen und neu eintragen.'}</p>
      <button class="gross-knopf hell" data-a="loesche-eintrag" data-id="${e.id}">${Icon('muell')} Eintrag löschen</button>`;
  };

  /* ---------- Gesamtbild ---------- */
  function html(c, { reiter = zustand.reiter, unter = zustand.unter } = {}) {
    const tabs = reiterListe(c); const o = c.offen();
    const nFrei = o.urlaub.length + o.stunden.length + o.belege.filter((b) => b.status === 'offen').length + o.material.length;
    const ungelesen = c.items.filter((i) => i.typ === 'dokument' && (i.fuer === c.ich.id || i.fuer === 'alle') && !i.gelesen).length;
    const inhalt = unter && UNTER[unter] ? UNTER[unter](c) : (BILD[reiter] || BILD.start)(c);
    return `<div class="ui-app" style="--firma:${esc(c.cfg.farbe)}"><div class="app-rahmen">
      <header class="a-kopf"><span class="firmenzeichen">${esc(c.cfg.kuerzel || c.kuerzel(c.cfg.name))}</span><div class="titel"><b>${esc(c.cfg.name)}</b><small>${esc(c.ich.name)}</small></div></header>
      <main class="a-inhalt">${inhalt}</main>
      <nav class="a-tabs" style="grid-template-columns:repeat(${tabs.length},1fr)">${tabs.map((t) => `<button class="${t.scan ? 'scan' : ''} ${reiter === t.id && !unter ? 'an' : ''}" data-a="reiter" data-id="${t.id}">${t.scan ? `<span class="kreis">${Icon(t.icon)}</span>` : Icon(t.icon)}${t.name}${t.id === 'freigaben' && nFrei ? `<span class="zahl">${nFrei}</span>` : ''}${t.id === 'mehr' && ungelesen ? `<span class="zahl">${ungelesen}</span>` : ''}</button>`).join('')}</nav>
    </div></div>`;
  }

  /* =====================================================================
     Anmeldung
     ===================================================================== */
  function anmeldungBetrieb(fehler = '') {
    Wurzel().innerHTML = `<div class="ui-app"><div class="app-rahmen" style="padding:0"><div class="a-login"><div class="oben">
      <div class="marke">${LOGO}</div><h1>Mit deinem Betrieb verbinden</h1><p>Die Betriebskennung bekommst du von deinem Chef oder aus dem Büro.</p>
      <form id="f-betrieb"><label class="a-feld"><span>Betriebskennung</span><input name="kennung" autocapitalize="none" autocomplete="off" spellcheck="false" required></label>
      <div class="fehlertext">${esc(fehler)}</div><button class="gross-knopf" type="submit">Weiter</button></form></div>
      <a href="#" style="color:#9aa1ad;font-size:13px;text-align:center;text-decoration:none">Richtwerk · Bereich wählen</a></div></div></div>`;
    $('#f-betrieb').addEventListener('submit', async (e) => {
      e.preventDefault();
      const b = await findeBetrieb(new FormData(e.target).get('kennung'));
      if (!b) return anmeldungBetrieb('Diese Betriebskennung gibt es nicht.');
      koppeln({ fid: b.fid, name: b.cfg.name, kuerzel: b.cfg.kuerzel, farbe: b.cfg.farbe });
      anmeldungCode();
    });
  }

  function anmeldungCode() {
    const b = gekoppelt(); let code = '';
    const punkte = () => `<div class="pin-punkte" id="pin">${[0, 1, 2, 3].map((i) => `<i class="${i < code.length ? 'voll' : ''}"></i>`).join('')}</div>`;
    Wurzel().innerHTML = `<div class="ui-app" style="--firma:${esc(b.farbe)}"><div class="app-rahmen" style="padding:0"><div class="a-login"><div class="oben">
      <div class="firmenzeile"><span class="firmenzeichen">${esc(b.kuerzel || '')}</span><b>${esc(b.name)}</b><button data-a="anderer">Ändern</button></div>
      <h1 style="text-align:center">Zugangscode</h1><p style="text-align:center">Gib deinen persönlichen Code ein.</p>
      <div id="pin-huelle">${punkte()}</div>
      <div class="ziffernblock">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map((z) => `<button class="${z === '' ? 'leer' : ''}" data-z="${z}" ${z === '' ? 'disabled' : ''} aria-label="${z === '⌫' ? 'Löschen' : z}">${z}</button>`).join('')}</div>
      </div></div></div></div>`;
    const huelle = $('#pin-huelle');
    Wurzel().querySelector('.a-login').addEventListener('click', async (e) => {
      if (e.target.closest('[data-a="anderer"]')) { koppeln(null); return anmeldungBetrieb(); }
      const t = e.target.closest('[data-z]'); if (!t) return;
      const z = t.dataset.z;
      if (z === '⌫') code = code.slice(0, -1); else if (code.length < 4) code += z;
      huelle.innerHTML = punkte();
      if (code.length === 4) {
        const cfg = await Store.ladeCfg(b.fid);
        const p = cfg && cfg.personen.find((x) => x.code === code);
        if (!p) { $('#pin').classList.add('falsch'); setTimeout(() => { code = ''; huelle.innerHTML = punkte(); }, 450); return; }
        Sitzung.setze('app', { fid: b.fid, pid: p.id });
        zustand.reiter = 'start'; zustand.unter = null; start();
      }
    });
  }

  /* =====================================================================
     Ablauf
     ===================================================================== */
  function ctx() { return kontext(Store.cfg, Store.items, sitzung && sitzung.pid); }
  let uhrTimer = null;

  function start() {
    aktiverBereich = Handy;
    document.body.classList.add('app-modus');
    sitzung = Sitzung.lies('app');
    if (!sitzung) { aktiverBereich = null; return gekoppelt() ? anmeldungCode() : anmeldungBetrieb(); }
    Store.oeffne(sitzung.fid);
    zeichne(true);
    clearInterval(uhrTimer);
    uhrTimer = setInterval(() => {
      if (aktiverBereich !== Handy) return;
      const z = $('.stempel .zeit[data-seit]'); if (z) z.textContent = Zahl.hhmm((Date.now() - new Date(z.dataset.seit).getTime()) / 60000);
    }, 20000);
  }

  function zeichne(erzwingen = false) {
    if (aktiverBereich !== Handy) return;
    const c = ctx();
    if (!c.cfg) { Wurzel().innerHTML = `<div class="laden" style="background:#fff;color:#6b7280"><div>Wird geladen<div class="balken"><i></i></div></div></div>`; return; }
    if (!c.ich) { Sitzung.setze('app', null); aktiverBereich = null; return anmeldungCode(); }
    if (!erzwingen && zustand.unter && !['gesendet', 'dokument', 'eintrag'].includes(zustand.unter)) return; // Formular offen
    document.documentElement.style.setProperty('--firma', c.cfg.farbe);
    const scroll = window.scrollY;
    Wurzel().innerHTML = html(c);
    if (zustand.unter === 'dokument') dokumentLaden(c);
    if (zustand.unter === 'urlaubsantrag') urlaubstageZeigen();
    window.scrollTo(0, erzwingen ? 0 : scroll);
  }

  function geheZu(unter, daten = {}) { zustand.unter = unter; zustand.daten = daten; zeichne(true); }
  function werte() { const out = {}; $$('.a-inhalt [name]').forEach((el) => { out[el.name] = el.value; }); $$('.a-inhalt [data-wahl]').forEach((g) => { const an = $('.an', g); if (an) out[g.dataset.wahl] = an.dataset.id; }); return out; }
  function gesendet(titel, text, nochmal) { geheZu('gesendet', { titel, text, nochmal }); }

  function runde(min, schritt) { return Math.round(min / schritt) * schritt; }
  function jetztHHMM(rundung) { const d = new Date(); return Zahl.hhmm(runde(d.getHours() * 60 + d.getMinutes(), rundung)); }

  function dokumentLaden(c) {
    const d = c.items.find((i) => i.id === zustand.daten.id); if (!d) return;
    if (!d.gelesen) Store.aendere(d.id, { gelesen: true });
    bildFuer(d).then((url) => {
      const box = $('#dok-anzeige'); if (!box) return;
      box.innerHTML = url && url.startsWith('data:application/pdf')
        ? `<div style="padding:16px"><a class="gross-knopf firma" href="${url}" download="${esc(d.name || 'Dokument.pdf')}" style="text-decoration:none">${Icon('download')} PDF öffnen</a></div><iframe src="${url}" style="width:100%;height:60vh;border:0"></iframe>`
        : `<img src="${url}" style="width:100%;display:block">`;
    });
  }
  function urlaubstageZeigen() {
    const f = () => { const v = $('[name=von]').value; const b = $('[name=bis]').value; const n = v && b && b >= v ? Datum.werktageZwischen(v, b) : 0; $('#urlaub-tage').textContent = n === 1 ? '1 Arbeitstag' : `${n} Arbeitstage`; };
    $$('.a-inhalt input[type=date]').forEach((i) => i.addEventListener('change', () => { if (i.name === 'von' && $('[name=bis]').value < i.value) $('[name=bis]').value = i.value; f(); }));
    f();
  }

  function fotoAufnehmen(kamera) {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    if (kamera) inp.setAttribute('capture', 'environment');
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      try {
        Object.assign(zustand.daten, werte());
        const bild = await bildVerkleinern(f, { maxKante: 1300 });
        const scan = await bildVerkleinern(f, { maxKante: 1300, scan: true });
        Object.assign(zustand.daten, { bild, scanBild: scan, original: bild, scan: false, anzeige: bild });
        zeichne(true);
      } catch (err) { meldung(err.message, 'fehler'); }
    };
    inp.click();
  }

  /* ---------- Aktionen ---------- */
  document.addEventListener('click', (e) => {
    if (aktiverBereich !== Handy) return;
    const el = e.target.closest('[data-a]'); if (!el || !Wurzel().contains(el)) return;
    const fn = AKTION[el.dataset.a]; if (fn) { e.preventDefault(); fn(el, ctx()); }
  });

  const AKTION = {
    reiter(el) { zustand.reiter = el.dataset.id; zustand.unter = null; zeichne(true); },
    unter(el) { geheZu(el.dataset.id); },
    zurueck() { zustand.unter = null; zeichne(true); },
    fertig() { zustand.unter = null; zustand.reiter = 'start'; zeichne(true); },
    woche(el) { zustand.woche = Datum.plus(zustand.woche, Number(el.dataset.id)); zeichne(true); },
    wahl(el) { $$('button', el.parentElement).forEach((b) => b.classList.toggle('an', b === el)); },
    abmelden() { Sitzung.setze('app', null); aktiverBereich = null; anmeldungCode(); },
    trennen() { Sitzung.setze('app', null); koppeln(null); aktiverBereich = null; anmeldungBetrieb(); },
    dokument(el) { geheZu('dokument', { id: el.dataset.id }); },
    eintrag(el) { geheZu('eintrag', { id: el.dataset.id }); },
    'loesche-eintrag'(el) { Store.loesche(el.dataset.id); zustand.unter = null; zeichne(true); meldung('Gelöscht'); },
    foto() { fotoAufnehmen(true); },
    galerie() { fotoAufnehmen(false); },
    scanmodus(el) { Object.assign(zustand.daten, werte()); const s = el.dataset.id === '1'; Object.assign(zustand.daten, { scan: s, bild: s ? zustand.daten.scanBild : zustand.daten.original, anzeige: s ? zustand.daten.scanBild : zustand.daten.original }); zeichne(true); },

    einstempeln(el, c) {
      const bs = el.dataset.id || '';
      Store.neu({ typ: 'stunden', pid: c.ich.id, datum: c.heute, von: jetztHHMM(Number(c.R.p('stempeln').rundung)), bis: '', pause: 0, bs, taetigkeit: '', quelle: 'stempeln', status: 'laeuft' });
      zustand.unter = null; zustand.reiter = 'start'; zeichne(true);
      meldung('Eingestempelt. Gute Arbeit!');
    },
    wechseln(el, c) {
      const l = c.laeuft(c.ich.id); if (!l) return;
      const jetzt = jetztHHMM(Number(c.R.p('stempeln').rundung));
      if (jetzt > l.von) Store.aendere(l.id, { bis: jetzt, status: startStatus(c.R, 'stunden') }); else Store.loesche(l.id);
      Store.neu({ typ: 'stunden', pid: c.ich.id, datum: c.heute, von: jetzt, bis: '', pause: 0, bs: el.dataset.id, taetigkeit: '', quelle: 'stempeln', status: 'laeuft' });
      zustand.unter = null; zeichne(true); meldung('Baustelle gewechselt');
    },
    feierabend(el, c) {
      const l = c.laeuft(c.ich.id); if (!l) return;
      const p = c.R.p('stempeln'); const bis = jetztHHMM(Number(p.rundung));
      const dauer = Zahl.min(bis) - Zahl.min(l.von);
      const pause = dauer > 9 * 60 ? Number(p.pause9) : dauer > 6 * 60 ? Number(p.pause6) : 0;
      geheZu('feierabend', { id: l.id, von: l.von, bis: bis > l.von ? bis : l.von, pause, bs: l.bs });
    },
    'speichere-feierabend'(el, c) {
      const w = werte(); if (!w.bis || w.bis <= w.von) return meldung('Das Ende muss nach dem Beginn liegen.', 'fehler');
      Store.aendere(zustand.daten.id, { von: w.von, bis: w.bis, pause: Number(w.pause) || 0, bs: w.bs !== undefined ? w.bs : zustand.daten.bs, taetigkeit: w.taetigkeit, status: startStatus(c.R, 'stunden') });
      gesendet('Feierabend!', `${Zahl.std((Zahl.min(w.bis) - Zahl.min(w.von) - (Number(w.pause) || 0)) / 60)} Stunden gespeichert.`);
    },
    'speichere-stunden'(el, c) {
      const w = werte(); if (!w.bis || w.bis <= w.von) return meldung('Das Ende muss nach dem Beginn liegen.', 'fehler');
      if (w.datum < Datum.plus(c.heute, -Number(c.R.p('stunden').nachtrag))) return meldung('So weit zurück darfst du nicht nachtragen. Bitte im Büro melden.', 'fehler');
      const std = (Zahl.min(w.bis) - Zahl.min(w.von) - (Number(w.pause) || 0)) / 60;
      Store.neu({ typ: 'stunden', pid: c.ich.id, datum: w.datum, von: w.von, bis: w.bis, pause: Number(w.pause) || 0, bs: w.bs || '', taetigkeit: w.taetigkeit, quelle: 'app', status: startStatus(c.R, 'stunden') });
      gesendet('Gespeichert', std > Number(c.R.p('stunden').maxTag) ? `${Zahl.std(std)} Stunden. Das ist ein langer Tag, das Büro sieht einen Hinweis.` : `${Zahl.std(std)} Stunden eingetragen.`, 'stunden');
    },
    'speichere-urlaub'(el, c) {
      const w = werte(); if (!w.von || !w.bis || w.bis < w.von) return meldung('Bitte Zeitraum prüfen.', 'fehler');
      if (!Datum.werktageZwischen(w.von, w.bis)) return meldung('In diesem Zeitraum liegt kein Arbeitstag.', 'fehler');
      Store.neu({ typ: 'urlaub', pid: c.ich.id, von: w.von, bis: w.bis, art: w.art || 'Urlaub', notiz: w.notiz, status: startStatus(c.R, 'urlaub') });
      gesendet(c.R.freigabe('urlaub') ? 'Antrag gesendet' : 'Eingetragen', c.R.freigabe('urlaub') ? 'Du bekommst Bescheid, sobald er entschieden ist.' : 'Dein Urlaub ist eingetragen.');
    },
    'speichere-krank'(el, c) {
      const w = werte(); Store.neu({ typ: 'krank', pid: c.ich.id, von: w.von, bis: w.bis < w.von ? w.von : w.bis, notiz: w.notiz, status: 'gemeldet', au: false });
      const l = c.laeuft(c.ich.id); if (l) Store.loesche(l.id);
      gesendet('Gute Besserung', 'Das Büro weiß Bescheid.');
    },
    'speichere-material'(el, c) {
      const w = werte(); if (!w.text || !w.text.trim()) return meldung('Was fehlt denn?', 'fehler');
      Store.neu({ typ: 'material', pid: c.ich.id, datum: c.heute, bs: w.bs || '', text: w.text.trim(), status: 'offen' });
      gesendet('Gesendet', 'Der Chef sieht deine Anforderung.', 'material');
    },
    async 'speichere-scan'(el, c) {
      const art = el.dataset.id; const w = werte(); const d = zustand.daten;
      if (!d.bild) return;
      let betrag = 0;
      if (art === 'beleg') { betrag = Number(String(w.betrag || '').replace(/\./g, '').replace(',', '.')); if (!betrag || betrag <= 0) return meldung('Bitte den Betrag eingeben.', 'fehler'); }
      el.disabled = true; el.innerHTML = 'Wird gesendet …';
      try {
        const datei = await Store.speichereDatei(d.bild, `${art}.jpg`);
        if (art === 'beleg') {
          Store.neu({ typ: 'beleg', pid: c.ich.id, datum: c.heute, betrag, kategorie: w.kategorie, haendler: w.haendler, bs: w.bs || '', notiz: w.notiz, datei, status: startStatus(c.R, 'beleg', { betrag }) });
          gesendet('Beleg gesendet', `${Zahl.eur(betrag)} · ${w.kategorie}. Den Zettel kannst du wegwerfen, wenn der Chef es sagt.`, 'beleg');
        } else {
          Store.neu({ typ: 'lieferschein', pid: c.ich.id, datum: c.heute, lieferant: w.lieferant, nummer: w.nummer, bs: w.bs || '', notiz: w.notiz, datei, status: 'neu' });
          gesendet('Lieferschein gesendet', 'Liegt jetzt beim Auftrag im Büro.', 'lieferschein');
        }
      } catch (err) { el.disabled = false; el.textContent = 'Ans Büro senden'; meldung(err.message, 'fehler'); }
    },
    entscheide(el, c) {
      const e = c.items.find((i) => i.id === el.dataset.id); const wert = el.dataset.wert;
      Store.aendere(el.dataset.id, { status: wert, ...(e && e.typ === 'urlaub' ? { entschieden: Date.now() } : {}) });
      meldung(wert === 'abgelehnt' ? 'Abgelehnt' : 'Erledigt');
    },
    'stunden-frei'(el, c) { c.offen().stunden.filter((s) => s.pid === el.dataset.id).forEach((s) => Store.aendere(s.id, { status: 'freigegeben', freigabeVon: c.ich.id })); meldung('Stunden freigegeben'); },
  };

  return { start, neuZeichnen: () => zeichne(false), html, BILD };
})();

/* ---- studio.js ---- */
/* =========================================================================
   Entwickler-Tool (Richtwerk Studio)
   Links: Betriebe + Bausteine · Mitte: Baukasten-Fläche · Rechts: Prüfer
   Bausteine ziehen, Ausgang (rechter Punkt) auf Eingang (linker Punkt)
   ziehen = verbinden. Klick auf eine Linie = trennen.
   ========================================================================= */
const Studio = (() => {
  const KN_B = 200; const KN_H = 60;
  const zustand = { reiter: 'baukasten', fid: null, gewaehlt: null, ansicht: { x: 40, y: 40, z: 0.85 }, vorschau: 'app', liste: [], aktion: null };

  /* ---------- Anmeldung ---------- */
  function anmeldung(fehler = '') {
    aktiverBereich = null;
    Wurzel().innerHTML = `<div class="studio-login"><form class="formular" id="f-studio" autocomplete="off">
      <div class="marke" style="color:#fff;margin-bottom:22px">${LOGO}Richtwerk <small style="color:#6f7a8d;border-color:#2a3140">Studio</small></div>
      <h2>Entwicklerzugang</h2><p class="hinweis">Nur für Richtwerk. Kunden sehen diesen Bereich nicht.</p>
      <label class="feld"><span>Kennung</span><input name="kennung" autocapitalize="none" spellcheck="false"></label>
      <label class="feld"><span>Code</span><input name="code" type="password" class="code" inputmode="numeric"></label>
      <div class="fehlertext">${esc(fehler)}</div><button class="knopf-voll" type="submit">Öffnen</button>
      <a class="zurueck" href="#">${Icon('zurueck')} Bereich wählen</a></form></div>`;
    $('#f-studio').addEventListener('submit', (e) => {
      e.preventDefault(); const w = Object.fromEntries(new FormData(e.target));
      if (w.kennung.trim().toLowerCase() !== ENTWICKLER.kennung || w.code.trim() !== ENTWICKLER.code) return anmeldung('Kennung oder Code stimmt nicht.');
      Sitzung.setze('studio', { ok: true }); start();
    });
  }

  async function start() {
    if (!Sitzung.lies('studio')) return anmeldung();
    aktiverBereich = Studio;
    const meta = await Store.betriebe();
    zustand.liste = (meta && meta.liste) || [];
    if (!zustand.fid || !zustand.liste.some((b) => b.id === zustand.fid)) zustand.fid = (zustand.liste[0] || {}).id;
    if (zustand.fid) Store.oeffne(zustand.fid);
    zeichne(true);
  }

  /* ---------- Hilfen ---------- */
  const cfg = () => Store.cfg;
  const bk = () => cfg().baukasten;
  const knoten = (typ) => bk().knoten.find((k) => k.typ === typ);
  let speichernTimer = null;
  function speichere(sofort = false) {
    clearTimeout(speichernTimer);
    const los = () => { Store.speichereCfg(cfg()).then(() => standZeigen('gespeichert')).catch((e) => meldung(e.message, 'fehler')); };
    standZeigen('speichert …');
    if (sofort) los(); else speichernTimer = setTimeout(los, 400);
  }
  function standZeigen(t) { const s = $('.speicherstand'); if (s) s.textContent = t; }
  function aendereBaukasten(fn) {
    const neu = JSON.parse(JSON.stringify(cfg())); fn(neu.baukasten, neu);
    Store.speichereCfg(neu).then(() => standZeigen('gespeichert'));
    standZeigen('speichert …');
  }
  const darfVerbinden = (von, zu) => von !== zu && BAUSTEINE[zu] && BAUSTEINE[zu].ein.includes(von);

  /* ---------- Zeichnen ---------- */
  function zeichne(voll = false) {
    if (aktiverBereich !== Studio) return;
    if (zustand.aktion) return; // während Ziehen nicht neu zeichnen
    const c = cfg();
    if (!c) { Wurzel().innerHTML = `<div class="laden"><div>Studio wird geladen<div class="balken"><i></i></div></div></div>`; return; }
    if (!voll && $('.ui-studio') && zustand.reiter === 'baukasten') { flaecheZeichnen(); seiteZeichnen(); if (!$('.s-pruef').contains(document.activeElement)) pruefZeichnen(); return; }
    if (!voll && $('.ui-studio') && document.activeElement && $('.s-inhalt-seite') && $('.s-inhalt-seite').contains(document.activeElement)) return;
    Wurzel().innerHTML = `<div class="ui-studio">
      <header class="s-kopf"><div class="marke">${LOGO}Richtwerk <small>Studio</small></div>
        <nav class="reiter">${[['baukasten', 'Baukasten'], ['team', 'Betrieb & Zugänge'], ['betriebe', 'Alle Betriebe']].map(([k, t]) => `<button class="${zustand.reiter === k ? 'an' : ''}" data-s="reiter" data-id="${k}">${t}</button>`).join('')}</nav>
        <span class="luecke"></span><span class="speicherstand">${Store.modus === 'cloud' ? 'live' : 'lokal'}</span>
        <button class="sk" data-s="kunde" data-id="buero">Büro dieses Betriebs öffnen</button>
        <button class="sk" data-s="kunde" data-id="app">App öffnen</button>
        <button class="sk" data-s="abmelden">${Icon('abmelden')}</button></header>
      ${zustand.reiter === 'baukasten' ? `<aside class="s-seite"></aside><section class="s-flaeche" id="flaeche"><div class="studio-schmal">Das Entwickler-Tool ist für einen großen Bildschirm gebaut. Auf dem Handy nur ansehen.</div><div class="s-welt" id="welt"></div>
        <div class="s-werkzeug"><button data-s="zoom" data-id="-1">−</button><span id="zoomwert">${Math.round(zustand.ansicht.z * 100)}%</span><button data-s="zoom" data-id="1">+</button><button data-s="einpassen">Einpassen</button></div>
        <div class="s-tipp">Baustein aus der Liste ziehen<br>Rechten Punkt auf linken Punkt ziehen = verbinden<br>Linie anklicken = trennen</div></section><aside class="s-pruef"></aside>` : `<aside class="s-seite"></aside><main class="s-inhalt-seite">${zustand.reiter === 'team' ? teamSeite() : betriebeSeite()}</main>`}
    </div>`;
    document.documentElement.style.setProperty('--firma', c.farbe);
    seiteZeichnen();
    if (zustand.reiter === 'baukasten') { flaecheZeichnen(); pruefZeichnen(); flaecheVorbereiten(); }
  }

  function seiteZeichnen() {
    const s = $('.s-seite'); if (!s) return;
    const benutzt = new Set(bk().knoten.map((k) => k.typ));
    const gruppen = Object.entries(GRUPPEN).map(([g, info]) => {
      const steine = Object.entries(BAUSTEINE).filter(([, b]) => b.gruppe === g);
      return `<div class="pgruppe"><i style="background:${info.farbe}"></i>${info.name}</div>${steine.map(([typ, b]) => `<button class="p-baustein ${benutzt.has(typ) ? 'benutzt' : ''}" style="--g:${info.farbe}" data-palette="${typ}" title="${esc(b.kurz)}">${Icon(b.icon)}${esc(b.name)}</button>`).join('')}`;
    }).join('');
    s.innerHTML = `<div class="s-abschnitt">Betriebe</div>${zustand.liste.map((b) => `<button class="s-betrieb ${b.id === zustand.fid ? 'an' : ''}" data-s="betrieb" data-id="${b.id}"><span class="firmenzeichen" style="background:${b.id === zustand.fid ? esc(cfg().farbe) : '#3a4252'}">${esc((b.id === zustand.fid ? cfg().kuerzel : '') || b.name.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase())}</span><span>${esc(b.name)}<small>${esc(b.kennung)}</small></span></button>`).join('')}
      ${zustand.reiter === 'baukasten' ? `<div class="s-abschnitt">Bausteine</div><div class="palette">${gruppen}</div>` : ''}`;
  }

  function flaecheZeichnen() {
    const welt = $('#welt'); if (!welt) return;
    const a = zustand.ansicht;
    welt.style.transform = `translate(${a.x}px, ${a.y}px) scale(${a.z})`;
    const z = $('#zoomwert'); if (z) z.textContent = Math.round(a.z * 100) + '%';
    const R = regeln(cfg());
    const kn = bk().knoten;
    const pos = (typ) => kn.find((k) => k.typ === typ);
    const kanten = bk().kanten.filter((k) => pos(k.von) && pos(k.zu)).map((k) => {
      const a1 = pos(k.von); const b1 = pos(k.zu);
      const x1 = a1.x + KN_B; const y1 = a1.y + KN_H / 2; const x2 = b1.x; const y2 = b1.y + KN_H / 2;
      const dx = Math.max(50, Math.abs(x2 - x1) / 2);
      const d = `M${x1} ${y1} C${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
      const aktiv = zustand.gewaehlt && (k.von === zustand.gewaehlt || k.zu === zustand.gewaehlt);
      return `<path class="treffer" d="${d}" data-kante="${k.von}>${k.zu}"/><path d="${d}" class="${aktiv ? 'aktiv' : ''}"/>`;
    }).join('');
    const info = (k) => {
      const B = BAUSTEINE[k.typ]; if (B.gruppe === 'geplant') return 'in Entwicklung';
      const p = R.p(k.typ); const def = B.p;
      const teile = Object.entries(def).filter(([, d]) => d.typ === 'zahl').slice(0, 2).map(([n, d]) => `${String(p[n]).replace('.', ',')} ${d.einheit}`);
      if (k.typ === 'app') return `${cfg().personen.length} Zugänge`;
      if (k.typ === 'baustellen') return `${c_offen()} laufend`;
      if (k.typ === 'freigabe') return p.wer;
      if (k.typ === 'export') return p.format;
      return teile.join(' · ') || B.kurz;
    };
    const c_offen = () => (cfg().baustellen || []).filter((b) => b.status !== 'fertig').length;
    welt.innerHTML = `<svg class="kanten" width="1" height="1">${kanten}<path id="vorlaeufig" class="vorlaeufig" d=""/></svg>
      ${kn.filter((k) => BAUSTEINE[k.typ]).map((k) => { const B = BAUSTEINE[k.typ]; const g = GRUPPEN[B.gruppe];
        return `<div class="knoten ${zustand.gewaehlt === k.typ ? 'an' : ''} ${B.gruppe === 'geplant' ? 'geplant' : ''}" style="left:${k.x}px;top:${k.y}px;height:${KN_H}px;--g:${g.farbe}" data-knoten="${k.typ}">
          ${B.ein.length ? `<span class="port ein" data-port="ein" data-typ="${k.typ}"></span>` : ''}

  function pruefZeichnen() {

      if (d.typ === 'text') return `<div class="s-param text"><label>${esc(d.name)}</label><div class="wert"><input data-param="${name}" value="${esc(w)}"></div></div>`;
      return `<div class="s-param"><label>${esc(d.name)}</label><div class="wert"><input type="number" data-param="${name}" value="${esc(w)}" min="${d.min}" max="${d.max}" step="${d.min % 1 ? 0.1 : 1}"><em>${esc(d.einheit)}</em></div></div>`;
    }).join('');
    p.innerHTML = `<div class="block" style="--g:${g.farbe}"><div class="s-titel">${esc(g.name)}</div><h3>${Icon(B.icon)}${esc(B.name)}</h3><div class="klein">${esc(B.kurz)}</div>
        <div class="problem"><b>Problem im Betrieb</b>${esc(B.wofuer)}</div></div>
      ${params ? `<div class="block"><div class="s-titel">Werte für ${esc(c.name)}</div>${params}</div>` : ''}
      <div class="block"><div class="s-titel">Wirkung</div><ul class="wirkung">${wirkungen(c, typ).map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div>
      <div class="s-vorschau">${vorschauRahmen()}</div>
      <div class="block" style="border-bottom:0"><button class="s-knopf gefahr" data-s="entfernen">${Icon('muell')} Baustein entfernen</button></div>`;

  /* ---------- Vorschau ----------
     Pro Baustein: welche Büro-Seite und welcher App-Bildschirm ihn zeigt. */
  const VORSCHAU = {
    app: { app: 'start' }, stempeln: { app: 'start' }, stunden: { buero: 'stunden', app: 'zeiten' }, urlaub: { buero: 'urlaub', app: 'urlaub' },
    belege: { buero: 'belege', app: 'u:beleg' }, lieferscheine: { buero: 'lieferscheine', app: 'u:lieferschein' }, material: { buero: 'material', app: 'u:material' },
    tagelohn: { buero: 'tagelohn' }, freigabe: { buero: 'uebersicht', app: 'freigaben' }, export: { buero: 'steuer' }, dokumente: { buero: 'steuer', app: 'mehr' },
    baustellen: { buero: 'baustellen' },
  };
  const OHNE_AUSWAHL = { buero: 'uebersicht', app: 'start' };
  function vorschauZiel(typ) { return typ ? (VORSCHAU[typ] || null) : OHNE_AUSWAHL; }
  function vorschauRahmen() {
    const v = vorschauZiel(zustand.gewaehlt);
    if (!v) return `<div class="vorschau-rahmen"><div class="vr-kopf">Vorschau</div><div class="vorschau-leer">Dieser Baustein ist noch in Entwicklung und hat keine Oberfläche.</div></div>`;
    const modus = v[zustand.vorschau] ? zustand.vorschau : (v.app ? 'app' : 'buero');
    const knopf = (m, t) => (v[m] ? `<button class="${modus === m ? 'an' : ''}" data-s="vmodus" data-id="${m}">${t}</button>` : '');
    return `<div class="vorschau-rahmen"><div class="vr-kopf"><span>Live-Vorschau</span><span class="segment">${knopf('buero', 'Büro')}${knopf('app', 'App')}</span><button class="s-knopf" style="padding:2px 8px;font-size:10.5px" data-s="vgross">Groß</button></div><div class="vorschau-buehne" id="buehne" data-modus="${modus}"></div></div>`;
  }
  function vorschauHtml(modus, typ) {

    }

    if (!p) return { breite: 390, html: '<div class="vorschau-leer">Noch keine Personen angelegt.</div>' };

    const opt = v.app.startsWith('u:') ? { reiter: 'erfassen', unter: v.app.slice(2) } : { reiter: v.app, unter: null };

  function vorschauFuellen() {

    const skal = (b.clientWidth || 340) / breite;

  /* ---------- Fläche: Ziehen, Verbinden, Verschieben ---------- */
  function weltPunkt(e) {
    const r = $('#flaeche').getBoundingClientRect(); const a = zustand.ansicht;
    return { x: (e.clientX - r.left - a.x) / a.z, y: (e.clientY - r.top - a.y) / a.z };
  }
  function flaecheVorbereiten() {
    const fl = $('#flaeche');
    fl.addEventListener('wheel', (e) => {
      e.preventDefault(); const r = fl.getBoundingClientRect(); const a = zustand.ansicht;
      const z2 = Math.min(1.6, Math.max(0.35, a.z * (e.deltaY < 0 ? 1.1 : 0.9)));
      const mx = e.clientX - r.left; const my = e.clientY - r.top;
      a.x = mx - ((mx - a.x) / a.z) * z2; a.y = my - ((my - a.y) / a.z) * z2; a.z = z2; flaecheZeichnen();
    }, { passive: false });
    fl.addEventListener('pointerdown', (e) => {
      const port = e.target.closest('.port.aus');
      const kn = e.target.closest('[data-knoten]');
      const kante = e.target.closest('[data-kante]');
      if (kante) {
        const [von, zu] = kante.dataset.kante.split('>');
        aendereBaukasten((b) => { b.kanten = b.kanten.filter((k) => !(k.von === von && k.zu === zu)); });
        meldung(`Verbindung ${BAUSTEINE[von].name} → ${BAUSTEINE[zu].name} getrennt`);
        return;
      }
      if (port) {
        e.stopPropagation(); const typ = port.dataset.typ;
        zustand.aktion = { art: 'verbinden', von: typ };
        $$('.port.ein').forEach((p) => { if (darfVerbinden(typ, p.dataset.typ)) p.classList.add('kann'); });
        fl.setPointerCapture(e.pointerId); return;
      }
      if (e.target.closest('.s-werkzeug, .studio-schmal')) return;
      if (kn) {
        const typ = kn.dataset.knoten; const k = knoten(typ); const pt = weltPunkt(e);
        zustand.aktion = { art: 'schieben', typ, dx: pt.x - k.x, dy: pt.y - k.y, bewegt: false, el: kn };
        fl.setPointerCapture(e.pointerId); return;
      }
      zustand.aktion = { art: 'pan', sx: e.clientX, sy: e.clientY, ox: zustand.ansicht.x, oy: zustand.ansicht.y, bewegt: false };
      fl.classList.add('zieht'); fl.setPointerCapture(e.pointerId);
    });
    fl.addEventListener('pointermove', (e) => {
      const a = zustand.aktion; if (!a) return;
      if (a.art === 'pan') { a.bewegt = a.bewegt || Math.abs(e.clientX - a.sx) + Math.abs(e.clientY - a.sy) > 3; zustand.ansicht.x = a.ox + e.clientX - a.sx; zustand.ansicht.y = a.oy + e.clientY - a.sy; $('#welt').style.transform = `translate(${zustand.ansicht.x}px, ${zustand.ansicht.y}px) scale(${zustand.ansicht.z})`; }
      if (a.art === 'schieben') {
        const pt = weltPunkt(e); const k = knoten(a.typ);
        const nx = Math.round((pt.x - a.dx) / 10) * 10; const ny = Math.round((pt.y - a.dy) / 10) * 10;
        if (nx !== k.x || ny !== k.y) { a.bewegt = true; a.x = nx; a.y = ny; a.el.style.left = nx + 'px'; a.el.style.top = ny + 'px'; kantenLive(a.typ, nx, ny); }
      }
      if (a.art === 'verbinden') {
        const k = knoten(a.von); const pt = weltPunkt(e);
        const x1 = k.x + KN_B; const y1 = k.y + KN_H / 2; const dx = Math.max(50, Math.abs(pt.x - x1) / 2);
        $('#vorlaeufig').setAttribute('d', `M${x1} ${y1} C${x1 + dx} ${y1}, ${pt.x - dx} ${pt.y}, ${pt.x} ${pt.y}`);
        $$('.port.ziel').forEach((p) => p.classList.remove('ziel'));
        const ziel = zielUnter(e); if (ziel && darfVerbinden(a.von, ziel)) { const p = $(`.port.ein[data-typ="${ziel}"]`); p && p.classList.add('ziel'); }
      }
    });
    const ende = (e) => {
      const a = zustand.aktion; if (!a) return; zustand.aktion = null; fl.classList.remove('zieht');
      if (a.art === 'pan' && !a.bewegt) { zustand.gewaehlt = null; zeichne(); }
      if (a.art === 'schieben') {
        if (a.bewegt) aendereBaukasten((b) => { const k = b.knoten.find((x) => x.typ === a.typ); k.x = a.x; k.y = a.y; });
        else { zustand.gewaehlt = a.typ; zeichne(); }
      }
      if (a.art === 'verbinden') {
        const ziel = zielUnter(e);
        if (ziel && darfVerbinden(a.von, ziel)) {
          if (!bk().kanten.some((k) => k.von === a.von && k.zu === ziel)) {
            aendereBaukasten((b) => { b.kanten.push({ von: a.von, zu: ziel }); });
            meldung(`${BAUSTEINE[a.von].name} → ${BAUSTEINE[ziel].name} verbunden`);
          }
          zustand.gewaehlt = ziel;
        } else if (ziel && ziel !== a.von) meldung(`${BAUSTEINE[a.von].name} passt nicht in ${BAUSTEINE[ziel].name}`, 'fehler');
        zeichne();
      }
    };
    fl.addEventListener('pointerup', ende);
    fl.addEventListener('pointercancel', () => { zustand.aktion = null; zeichne(); });
  }
  function zielUnter(e) {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const k = el && el.closest('[data-knoten]'); return k ? k.dataset.knoten : null;
  }
  function kantenLive(typ, x, y) {
    // während des Verschiebens nur die Linien neu berechnen
    const kn = bk().knoten.map((k) => (k.typ === typ ? { ...k, x, y } : k));
    const pos = (t) => kn.find((k) => k.typ === t);
    const pfade = $$('#welt svg path:not(#vorlaeufig)');
    let i = 0;
    for (const k of bk().kanten) {
      const a1 = pos(k.von); const b1 = pos(k.zu); if (!a1 || !b1) continue;
      const x1 = a1.x + KN_B; const y1 = a1.y + KN_H / 2; const x2 = b1.x; const y2 = b1.y + KN_H / 2; const dx = Math.max(50, Math.abs(x2 - x1) / 2);
      const d = `M${x1} ${y1} C${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
      if (pfade[i]) pfade[i].setAttribute('d', d); if (pfade[i + 1]) pfade[i + 1].setAttribute('d', d); i += 2;
    }
  }

  /* Baustein aus der Liste ziehen */
  document.addEventListener('pointerdown', (e) => {
    if (aktiverBereich !== Studio) return;
    const p = e.target.closest('[data-palette]'); if (!p || p.classList.contains('benutzt')) return;
    e.preventDefault();
    const typ = p.dataset.palette; const B = BAUSTEINE[typ]; const g = GRUPPEN[B.gruppe];
    const geist = document.createElement('div'); geist.className = 'knoten'; geist.style.cssText = `position:fixed;z-index:200;pointer-events:none;left:${e.clientX - 40}px;top:${e.clientY - 20}px;height:${KN_H}px;--g:${g.farbe};opacity:.9;font-family:var(--schrift);color:#dfe3ea;font-size:13px`;
    geist.innerHTML = `<div class="k-kopf">${Icon(B.icon)}${esc(B.name)}</div><div class="k-info">loslassen zum Einsetzen</div>`;
    let bewegt = false; const sx = e.clientX; const sy = e.clientY;
    const zieh = (ev) => { if (!bewegt && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 4) { bewegt = true; document.body.appendChild(geist); } geist.style.left = ev.clientX - 40 + 'px'; geist.style.top = ev.clientY - 20 + 'px'; };
    const los = (ev) => {
      document.removeEventListener('pointermove', zieh); document.removeEventListener('pointerup', los); geist.remove();
      const fl = $('#flaeche'); if (!fl) return;
      const r = fl.getBoundingClientRect();
      let x; let y;
      if (bewegt && ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom) { const pt = weltPunkt(ev); x = pt.x - 40; y = pt.y - 20; }
      else if (!bewegt) { const maxY = Math.max(0, ...bk().knoten.map((k) => k.y)); x = 330; y = maxY + 95; }
      else return;
      aendereBaukasten((b) => { b.knoten.push({ id: 'k_' + typ, typ, x: Math.round(x / 10) * 10, y: Math.round(y / 10) * 10, p: {} }); });
      zustand.gewaehlt = typ; meldung(`${B.name} eingesetzt. Jetzt verbinden.`);
    };
    document.addEventListener('pointermove', zieh); document.addEventListener('pointerup', los);
  });

  /* ---------- Seiten: Betrieb & Zugänge, Alle Betriebe ---------- */

  /* ---------- Aktionen ---------- */
  document.addEventListener('click', async (e) => {
    if (aktiverBereich !== Studio) return;
    const el = e.target.closest('[data-s]'); if (!el) return;
    const id = el.dataset.id;
    switch (el.dataset.s) {
      case 'reiter': zustand.reiter = id; zeichne(true); break;
      case 'betrieb': zustand.fid = id; zustand.gewaehlt = null; Store.oeffne(id); zustand.reiter = zustand.reiter === 'betriebe' ? 'baukasten' : zustand.reiter; zeichne(true); break;
      case 'abmelden': Sitzung.setze('studio', null); anmeldung(); break;
      case 'zoom': { const a = zustand.ansicht; a.z = Math.min(1.6, Math.max(0.35, a.z + Number(id) * 0.1)); flaecheZeichnen(); break; }
      case 'einpassen': einpassen(); break;
      case 'vmodus': zustand.vorschau = id; pruefZeichnen(); break;
      case 'vgross': vorschauGross(); break;
      case 'entfernen': {
        const typ = zustand.gewaehlt; if (typ === 'app') { meldung('Die Mitarbeiter-App ist der Start jedes Betriebs.', 'fehler'); break; }
        aendereBaukasten((b) => { b.knoten = b.knoten.filter((k) => k.typ !== typ); b.kanten = b.kanten.filter((k) => k.von !== typ && k.zu !== typ); });
        zustand.gewaehlt = null; meldung(`${BAUSTEINE[typ].name} entfernt`); break;
      }
      case 'kunde': {
        const c = cfg(); const chef = c.personen.find((p) => p.rolle === 'chef');
        const ma = c.personen.find((p) => p.rolle === 'geselle') || c.personen.find((p) => p.rolle !== 'chef' && p.rolle !== 'buero') || chef;
        if (id === 'buero' && chef) Sitzung.setze('buero', { fid: zustand.fid, pid: chef.id });
        if (id === 'app' && ma) { Sitzung.setze('app', { fid: zustand.fid, pid: ma.id }); try { localStorage.setItem('rw-app-betrieb', JSON.stringify({ fid: zustand.fid, name: c.name, kuerzel: c.kuerzel, farbe: c.farbe })); } catch { /* */ } }
        window.open(location.href.split('#')[0] + '#' + id, '_blank');
        break;
      }
      case 'person-neu': { const c = JSON.parse(JSON.stringify(cfg())); let code; do { code = String(2000 + Math.floor(Math.random() * 7999)); } while (c.personen.some((p) => p.code === code)); c.personen.push({ id: Store.uid('p'), name: 'Neue Person', funktion: 'Geselle', rolle: 'geselle', code, soll: 40, urlaub: 30 }); await Store.speichereCfg(c); zeichne(true); break; }
      case 'person-weg': { const c = JSON.parse(JSON.stringify(cfg())); if (c.personen.length <= 1) { meldung('Mindestens eine Person muss bleiben.', 'fehler'); break; } c.personen.splice(Number(id), 1); await Store.speichereCfg(c); zeichne(true); break; }
      case 'zuruecksetzen': case 'leeren': {
        if (!confirmZweimal(el)) break;
        el.textContent = 'Wird geladen …';
        if (id === 'ahlers' || id === 'leer') await Muster.zuruecksetzen(id);
        else { const alt = await Store.ladeCfg(id); await Store.ersetzeBetrieb(id, { ...Muster.leerCfg(), id, kennung: alt.kennung, name: alt.name, angelegt: Date.now() }, []); }
        meldung('Fertig. Alle offenen Fenster zeigen jetzt die neuen Daten.'); zeichne(true); break;
      }
      case 'loeschen': {
        if (!confirmZweimal(el)) break;
        zustand.liste = zustand.liste.filter((b) => b.id !== id); await Store.setzeBetriebe(zustand.liste); await Store.ersetzeBetrieb(id, { geloescht: true, personen: [], baukasten: leererBaukasten() }, []);
        if (zustand.fid === id) { zustand.fid = zustand.liste[0].id; Store.oeffne(zustand.fid); }
        zeichne(true); break;
      }
      case 'betrieb-neu': {
        const name = $('#nb-name').value.trim(); const kennung = $('#nb-kennung').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
        if (!name || !kennung) { meldung('Bitte Name und Kennung eingeben.', 'fehler'); break; }
        if (zustand.liste.some((b) => b.kennung === kennung) || kennung === ENTWICKLER.kennung) { meldung('Diese Kennung ist schon vergeben.', 'fehler'); break; }
        const fid = Store.uid('b');
        await Store.ersetzeBetrieb(fid, { ...Muster.leerCfg(), id: fid, kennung, name, kuerzel: name.split(/\s+/).map((s) => s[0]).join('').slice(0, 2).toUpperCase(), zusatz: '' }, []);
        zustand.liste = [...zustand.liste, { id: fid, kennung, name }]; await Store.setzeBetriebe(zustand.liste);
        zustand.fid = fid; Store.oeffne(fid); zustand.reiter = 'baukasten'; meldung(`${name} angelegt. Anmeldung: ${kennung} / 1001`); zeichne(true); break;
      }
      default:
    }
  });
  function confirmZweimal(el) {
    if (el.dataset.sicher) return true;
    el.dataset.sicher = '1'; const alt = el.innerHTML; el.innerHTML = 'Wirklich? Nochmal klicken';
    setTimeout(() => { if (el.isConnected) { delete el.dataset.sicher; el.innerHTML = alt; } }, 3000);
    return false;
  }
  // Werte in Bausteinen und Betriebsdaten
  document.addEventListener('change', async (e) => {
    if (aktiverBereich !== Studio) return;
    const el = e.target;
    if (el.dataset.param) {
      const typ = zustand.gewaehlt; const d = BAUSTEINE[typ].p[el.dataset.param];
      let w = el.value; if (d.typ === 'zahl') { w = Number(w); if (Number.isNaN(w)) return; w = Math.min(d.max, Math.max(d.min, w)); el.value = w; }
      aendereBaukasten((b) => { const k = b.knoten.find((x) => x.typ === typ); k.p = { ...(k.p || {}), [el.dataset.param]: w }; });
      setTimeout(() => { flaecheZeichnen(); pruefZeichnen(); }, 30);
    }
    if (el.dataset.cfg) {
      const c = JSON.parse(JSON.stringify(cfg()));
      if (el.dataset.cfg === 'kennung') { const k = el.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, ''); if (!k || zustand.liste.some((b) => b.kennung === k && b.id !== zustand.fid)) { meldung('Kennung ungültig oder vergeben.', 'fehler'); el.value = c.kennung; return; } c.kennung = k; zustand.liste = zustand.liste.map((b) => (b.id === zustand.fid ? { ...b, kennung: k } : b)); await Store.setzeBetriebe(zustand.liste); }
      else c[el.dataset.cfg] = el.value;
      if (el.dataset.cfg === 'name') { zustand.liste = zustand.liste.map((b) => (b.id === zustand.fid ? { ...b, name: el.value } : b)); await Store.setzeBetriebe(zustand.liste); }
      await Store.speichereCfg(c); standZeigen('gespeichert'); seiteZeichnen();
    }
    if (el.dataset.person !== undefined) {
      const c = JSON.parse(JSON.stringify(cfg())); const p = c.personen[Number(el.dataset.person)]; const f = el.dataset.feld;
      if (f === 'code') { const code = el.value.replace(/\D/g, '').slice(0, 4); if (code.length !== 4 || c.personen.some((x, i) => x.code === code && i !== Number(el.dataset.person))) { meldung('Code muss 4 Ziffern haben und eindeutig sein.', 'fehler'); el.value = p.code; return; } p.code = code; }
      else p[f] = f === 'soll' || f === 'urlaub' ? Number(el.value) : el.value;
      await Store.speichereCfg(c); standZeigen('gespeichert');
    }
  });

  function einpassen() {
    const fl = $('#flaeche'); if (!fl) return; const kn = bk().knoten; if (!kn.length) return;
    const minX = Math.min(...kn.map((k) => k.x)); const minY = Math.min(...kn.map((k) => k.y));
    const maxX = Math.max(...kn.map((k) => k.x + KN_B)); const maxY = Math.max(...kn.map((k) => k.y + KN_H));
    const z = Math.min(1.2, Math.max(0.35, Math.min((fl.clientWidth - 80) / (maxX - minX), (fl.clientHeight - 80) / (maxY - minY))));
    zustand.ansicht = { z, x: (fl.clientWidth - (maxX - minX) * z) / 2 - minX * z, y: (fl.clientHeight - (maxY - minY) * z) / 2 - minY * z };
    flaecheZeichnen();
  }
  function vorschauGross() {
    const b = $('#buehne'); if (!b) return;
    const { breite, html } = vorschauHtml(b.dataset.modus, zustand.gewaehlt);
    const hg = Fenster.oeffne({ titel: `Vorschau: ${zustand.gewaehlt ? esc(BAUSTEINE[zustand.gewaehlt].name) : 'Übersicht'}`, breit: true, inhalt: `<div class="vorschau-buehne" style="height:70vh;overflow:auto;pointer-events:auto"><div style="width:${breite}px;margin:auto">${html}</div></div>` });
    hg.querySelector('.fenster').style.maxWidth = (breite + 60) + 'px';
    bilderNachladen(hg, Store.items);
  }

  let ersteAnsicht = true;
  return {
    start,
    neuZeichnen() { zeichne(false); if (ersteAnsicht && $('#flaeche')) { ersteAnsicht = false; einpassen(); } },
  };
})();

/* ---- app.js ---- */
/* =========================================================================
   Start, Anmeldung, Umschalten zwischen den Bereichen
   #          Startseite (Richtwerk intern) mit drei Einträgen
   #buero     Betriebszentrale (Computer)
   #app       Mitarbeiter-App (Handy)
   #studio    Entwickler-Tool
   Jeder Bereich hat seine eigene Anmeldung. So kann in einem Tab das Büro
   und im zweiten Tab (oder am Handy) die App offen sein.
   ========================================================================= */
const LOGO = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0C1424"/><path d="M21 50V14.5H34a9.5 9.5 0 010 19H21" fill="none" stroke="#6F94FF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 34L46 50" fill="none" stroke="#FF6B3D" stroke-width="8.5" stroke-linecap="round"/></svg>`;

const Sitzung = {
  lies(bereich) { try { return JSON.parse(localStorage.getItem('rw-sitzung-' + bereich) || 'null'); } catch { return null; } },
  setze(bereich, wert) { try { wert ? localStorage.setItem('rw-sitzung-' + bereich, JSON.stringify(wert)) : localStorage.removeItem('rw-sitzung-' + bereich); } catch { /* privat */ } },
};

/* ---------- Fenster (Dialog) ---------- */
const Fenster = {
  oeffne({ titel, inhalt, fuss = '', breit = false, bereich = '', aktionen = {} }) {
    Fenster.schliesse();
    const hg = document.createElement('div');
    hg.className = 'fenster-hg ' + bereich; hg.id = 'fenster';
    hg.innerHTML = `<div class="fenster ${breit ? 'breit' : ''}" role="dialog" aria-modal="true">
      <div class="kopf"><h3>${titel}</h3><button data-f="zu" aria-label="Schließen">${Icon('x')}</button></div>
      <div class="koerper">${inhalt}</div>${fuss ? `<div class="fuss">${fuss}</div>` : ''}</div>`;
    hg.addEventListener('click', (e) => {
      if (e.target === hg) return Fenster.schliesse();
      const el = e.target.closest('[data-f]'); if (!el) return;
      const name = el.dataset.f;
      if (name === 'zu') return Fenster.schliesse();
      if (aktionen[name]) aktionen[name](el, hg);
    });
    document.body.appendChild(hg);
    const erstes = hg.querySelector('input:not([type=hidden]), select, textarea'); if (erstes && window.innerWidth > 700) erstes.focus();
    return hg;
  },
  schliesse() { const f = $('#fenster'); if (f) f.remove(); },
  werte(hg) {
    const out = {}; $$('[name]', hg).forEach((el) => { out[el.name] = el.type === 'checkbox' ? el.checked : el.value; }); return out;
  },
};
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') Fenster.schliesse(); });

/* ---------- Bereiche ---------- */
const Wurzel = () => $('#wurzel');
let aktiverBereich = null;

function zeige() {
  const ziel = (location.hash || '#').slice(1);
  Fenster.schliesse();
  document.body.className = '';
  if (ziel === 'buero') return Buero.start();
  if (ziel === 'app') return Handy.start();
  if (ziel === 'studio') return Studio.start();
  aktiverBereich = null;
  return startseite();
}
window.addEventListener('hashchange', zeige);
Store.abonniere(() => { if (aktiverBereich && aktiverBereich.neuZeichnen) aktiverBereich.neuZeichnen(); });

function startseite() {
  const basis = location.href.split('#')[0];
  const eintrag = (nr, ziel, wer, titel, text) => `
    <div class="bereich">
      <span class="nr">${nr}</span>
      <a href="#${ziel}" style="color:inherit;text-decoration:none">
        <div class="wer">${wer}</div><h2>${titel}</h2><p>${text}</p>
      </a>
      <div class="aktionen">
        <a class="knopf-rand" href="${esc(basis)}#${ziel}" target="_blank" rel="noopener">Neuer Tab</a>
        <a class="knopf-voll" href="#${ziel}">Öffnen</a>
      </div>
    </div>`;
  Wurzel().innerHTML = `<div class="ui-start">
    <header class="start-kopf"><div class="marke">${LOGO}Richtwerk <small>Intern</small></div><span class="stand">Arbeitsstand ${Datum.kurz(Datum.heute())}${Datum.heute().slice(0, 4)}</span></header>
    <main class="start-inhalt">
      <h1>Bereich wählen</h1>
      <p class="unter">Die drei Teile laufen unabhängig voneinander. Für die Vorführung den Büro-Bereich am Laptop öffnen und die Mitarbeiter-App in einem zweiten Tab oder am Handy. Alles, was dort erfasst wird, erscheint sofort im Büro.</p>
      <div class="bereiche">
        ${eintrag('01', 'buero', 'Für Inhaber und Büro', 'Betriebszentrale', 'Stunden prüfen, Urlaub freigeben, Belege und Lieferscheine, Tagelöhner, Paket für das Steuerbüro.')}
        ${eintrag('02', 'app', 'Für die Mitarbeiter am Handy', 'Mitarbeiter-App', 'Stempeln, Belege und Lieferscheine abfotografieren, Urlaub beantragen, Lohnzettel ansehen.')}
        ${eintrag('03', 'studio', 'Nur Richtwerk', 'Entwickler-Tool', 'Betriebe aus Bausteinen zusammenstellen, Verbindungen ziehen, Werte pro Betrieb einstellen.')}
      </div>
    </main>
    <footer class="start-fuss">
      <div><b>Daten</b><span class="datenmodus">${Store.modus === 'cloud' ? 'Geteilt über alle Geräte' : 'Nur in diesem Browser (Offline-Modus)'}</span></div>
      <div><b>Anmeldung</b>Betriebskennung und persönlicher Zugangscode</div>
      <div><b>Version</b><span class="mono">0.9 Vorführung</span></div>
    </footer>
  </div>`;
}

/* Betrieb über seine Kennung finden */
async function findeBetrieb(kennung) {
  const k = String(kennung || '').trim().toLowerCase();
  const meta = await Store.betriebe();
  const eintrag = meta && meta.liste.find((b) => b.kennung.toLowerCase() === k);
  if (!eintrag) return null;
  const cfg = await Store.ladeCfg(eintrag.id);
  return cfg ? { fid: eintrag.id, cfg } : null;
}

/* ---------- Anmeldung Büro (und Studio nutzt eine eigene Variante) ---------- */
function bueroAnmeldung(fehler = '') {
  Wurzel().innerHTML = `<div class="ui-start anmeldung">
    <div class="links">
      <div class="marke">${LOGO}Richtwerk <small>Betriebszentrale</small></div>
      <div><h1>Der Betrieb auf einen Blick.</h1><p>Stunden, Urlaub, Belege und Lieferscheine aus der Mitarbeiter-App laufen hier zusammen.</p></div>
      <div class="fuss">Verbindung verschlüsselt · Daten gehören dem Betrieb</div>
    </div>
    <div class="rechts">
      <form class="formular" id="f-login" autocomplete="off">
        <h2>Anmelden</h2>
        <p class="hinweis">Mit der Betriebskennung und Ihrem persönlichen Zugangscode.</p>
        <label class="feld"><span>Betriebskennung</span><input name="kennung" autocapitalize="none" spellcheck="false" required></label>
        <label class="feld"><span>Zugangscode</span><input name="code" class="code" inputmode="numeric" type="password" maxlength="8" required></label>
        <div class="fehlertext">${esc(fehler)}</div>
        <button class="knopf-voll" type="submit">Anmelden</button>
        <a class="zurueck" href="#">${Icon('zurueck')} Bereich wählen</a>
      </form>
    </div></div>`;
  $('#f-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const w = Object.fromEntries(new FormData(e.target));
    const b = await findeBetrieb(w.kennung);
    if (!b) return bueroAnmeldung('Diese Betriebskennung ist nicht bekannt.');
    const p = b.cfg.personen.find((x) => x.code === String(w.code).trim());
    if (!p) return bueroAnmeldung('Der Zugangscode stimmt nicht.');
    if (!['chef', 'buero'].includes(p.rolle)) return bueroAnmeldung('Dieser Zugang gilt für die Mitarbeiter-App am Handy.');
    Sitzung.setze('buero', { fid: b.fid, pid: p.id });
    Buero.start();
  });
}

/* ---------- Start ---------- */
async function boot() {
  Wurzel().innerHTML = `<div class="laden"><div>Richtwerk wird geladen<div class="balken"><i></i></div></div></div>`;
  await Store.init();
  try {
    const meta = await Store.betriebe();
    if (!meta) {
      const t = $('.laden > div');
      if (t) t.firstChild.textContent = 'Vorführbetrieb wird eingerichtet … ';
      await Muster.einrichten((n) => { if (t) t.firstChild.textContent = `Vorführbetrieb wird eingerichtet … ${n}`; });
    }
  } catch (e) { console.error(e); }
  zeige();
}
boot();

</script>
